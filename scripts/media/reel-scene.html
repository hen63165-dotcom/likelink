<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>LikeLink reel scene</title>
<!-- Renderer page for scripts/media/render-reels.mjs. Deterministic: every
     frame is a pure function of (t, concept, image). All visuals are original
     drawings — no third-party characters, logos or footage. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" />
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<script>
const W = 720, H = 1280;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let C = null;      // concept
let IMG = null;    // product image
let BLUR = null;   // pre-blurred background

const UI = '"Heebo", "DejaVu Sans", sans-serif';
const DISPLAY = '"Frank Ruhl Libre", "Heebo", "DejaVu Serif", serif';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b) => clamp((t - a) / (b - a));
function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

let SCENES = [];  // AI story: generated character scenes (never the product)
window.loadScenes = async (urls) => {
  SCENES = await Promise.all(urls.map((u) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; })));
  return SCENES.length;
};
window.loadConcept = async (concept, dataUrl) => {
  C = concept;
  IMG = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  const off = document.createElement("canvas"); off.width = W / 4; off.height = H / 4;
  const o = off.getContext("2d"); o.filter = "blur(10px) brightness(0.55) saturate(1.2)";
  coverDraw(o, IMG, -20, -20, off.width + 40, off.height + 40, 1.1);
  BLUR = off;
  await document.fonts.ready;
  return { w: IMG.naturalWidth, h: IMG.naturalHeight };
};

function coverRect(img, w, h) {
  const ir = img.naturalWidth / img.naturalHeight, r = w / h;
  if (ir > r) { const sw = img.naturalHeight * r; return [(img.naturalWidth - sw) / 2, 0, sw, img.naturalHeight]; }
  const sh = img.naturalWidth / r; return [0, (img.naturalHeight - sh) / 2, img.naturalWidth, sh];
}
function coverDraw(c, img, x, y, w, h, zoom = 1, fx = 0.5, fy = 0.5) {
  const [sx, sy, sw, sh] = coverRect(img, w, h);
  const zw = sw / zoom, zh = sh / zoom;
  c.drawImage(img, sx + (sw - zw) * fx, sy + (sh - zh) * fy, zw, zh, x, y, w, h);
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function wrap(text, font, maxW, maxLines = 2) {
  ctx.font = font;
  const words = String(text || "").split(/\s+/).filter(Boolean); const lines = []; let cur = "";
  for (const w of words) { const next = cur ? cur + " " + w : w; if (ctx.measureText(next).width > maxW && cur) { lines.push(cur); cur = w; } else cur = next; }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { const kept = lines.slice(0, maxLines); kept[maxLines - 1] = kept[maxLines - 1].replace(/\s*\S*$/, "") + "…"; return kept; }
  return lines;
}
function textBlock(lines, x, y, font, lh, color, alpha = 1, shadow = true) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = "center"; ctx.direction = "rtl";
  if (shadow) { ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 18; ctx.shadowOffsetY = 4; }
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh)); ctx.restore();
}
function pill(label, x, y, { font = `700 26px ${UI}`, bg = "rgba(255,255,255,.95)", fg = "#17131f", padX = 22, h = 52, alpha = 1, scale = 1 } = {}) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = font; ctx.direction = "rtl";
  const w = ctx.measureText(label).width + padX * 2;
  ctx.translate(x, y); ctx.scale(scale, scale);
  rr(ctx, -w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(label, 0, 2);
  ctx.restore(); return w;
}
function disclosure(t, extra = "") {
  const label = extra ? `${extra} · ${C.disclosure}` : C.disclosure;
  pill(label, W / 2, H - 46, { font: `500 21px ${UI}`, bg: "rgba(10,8,14,.62)", fg: "#fff", h: 40, padX: 18 });
}
function brandMark(x, y, alpha = 1, color = "#fff") {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = `900 34px ${DISPLAY}`; ctx.textAlign = "left"; ctx.direction = "ltr";
  const a = ctx.measureText("LikeLink").width, b = ctx.measureText("2").width, x0 = x - (a + b) / 2;
  ctx.fillStyle = color; ctx.fillText("LikeLink", x0, y); ctx.fillStyle = C.accent; ctx.fillText("2", x0 + a, y); ctx.restore();
}

/* 3D card: perspective-projected vertical strips (rotation about Y). */
function card3D(cx, cy, w, h, angle, opts = {}) {
  const strips = 90, f = 1100, [sx, sy, sw, sh] = coverRect(IMG, w, h);
  const pts = [];
  for (let i = 0; i <= strips; i++) {
    const x = -w / 2 + (w * i) / strips; const z = x * Math.sin(angle); const s = f / (f + z);
    pts.push({ X: cx + x * Math.cos(angle) * s, s });
  }
  // floor shadow
  if (!opts.bare) { ctx.save(); const sg = ctx.createRadialGradient(cx, cy + h / 2 + 40, 10, cx, cy + h / 2 + 40, w * 0.7);
  sg.addColorStop(0, "rgba(0,0,0,.55)"); sg.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = sg;
  ctx.beginPath(); ctx.ellipse(cx, cy + h / 2 + 40, w * 0.62, 46, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  for (const reflect of opts.bare ? [false] : [true, false]) {
    for (let i = 0; i < strips; i++) {
      const a = pts[i], b = pts[i + 1]; const hh = h * a.s; const dx = Math.min(a.X, b.X), dw = Math.abs(b.X - a.X) + 0.8;
      const srcX = sx + (sw * i) / strips; const srcW = sw / strips;
      ctx.save();
      if (reflect) { ctx.globalAlpha = 0.16; ctx.translate(0, cy + h * a.s / 2 + 8); ctx.scale(1, -0.45); ctx.drawImage(IMG, srcX, sy, srcW, sh, dx, -hh, dw, hh); }
      else ctx.drawImage(IMG, srcX, sy, srcW, sh, dx, cy - hh / 2, dw, hh);
      ctx.restore();
    }
  }
  // edge + light sweep, clipped to the projected quad
  const tl = [pts[0].X, cy - (h * pts[0].s) / 2], tr = [pts[strips].X, cy - (h * pts[strips].s) / 2];
  const br = [pts[strips].X, cy + (h * pts[strips].s) / 2], bl = [pts[0].X, cy + (h * pts[0].s) / 2];
  ctx.save(); ctx.beginPath(); ctx.moveTo(...tl); ctx.lineTo(...tr); ctx.lineTo(...br); ctx.lineTo(...bl); ctx.closePath();
  ctx.lineWidth = 6; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.stroke(); ctx.clip();
  if (opts.sweep != null) {
    const p = opts.sweep * (w + 600) - 300 + cx - w / 2;
    const g = ctx.createLinearGradient(p - 140, 0, p + 140, 0);
    g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,.38)"); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

/* ------------------------------------------------------------ cinematic3d */
function cinematic(t) {
  const T = t / 1000;
  ctx.drawImage(BLUR, 0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H * 0.45, 200, W / 2, H * 0.5, 900);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.7)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // depth particles (parallax)
  for (let i = 0; i < 42; i++) {
    const depth = 0.3 + rand(i) * 0.9; const x = (rand(i + 9) * W + T * 22 * depth) % W; const y = (rand(i + 3) * H - T * 30 * depth + H) % H;
    ctx.fillStyle = `rgba(255,${200 + rand(i) * 55},${180 + rand(i + 1) * 60},${0.08 + depth * 0.18})`;
    ctx.beginPath(); ctx.arc(x, y, 2 + depth * 9, 0, Math.PI * 2); ctx.fill();
  }
  // stage glow
  const fl = ctx.createRadialGradient(W / 2, 1010, 10, W / 2, 1010, 420); fl.addColorStop(0, C.accent + "88"); fl.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = fl; ctx.fillRect(0, 700, W, 600);
  const enter = back(win(T, 0.1, 1.3));
  const angle = (-0.55 + 0.55 * enter) + Math.sin(T * 0.9) * 0.32 * enter;
  // below a two-line title (ends ≈ y 310), above the fact pills (from y 960)
  const cy = 625 + (1 - enter) * 500 + Math.sin(T * 1.6) * 8;
  card3D(W / 2, cy, 440, 550, angle, { sweep: (T % 3.2) / 3.2 });
  // copy
  textBlock([C.lines.kicker || ""], W / 2, 150, `700 30px ${UI}`, 40, "#ffd9c2", ease(win(T, 0.5, 1.2)));
  const tl = wrap(C.lines.title, `900 56px ${DISPLAY}`, 620, 2);
  textBlock(tl, W / 2, 230, `900 56px ${DISPLAY}`, 64, "#fff", ease(win(T, 1.0, 1.8)));
  C.lines.facts.forEach((f, i) => pill(f, W / 2, 960 + i * 64, { alpha: ease(win(T, 3 + i * 0.6, 3.6 + i * 0.6)), scale: 0.9 + 0.1 * back(win(T, 3 + i * 0.6, 3.6 + i * 0.6)) }));
  const end = ease(win(T, 6.6, 7.3));
  if (end > 0) { pill(C.lines.cta, W / 2, 1160, { bg: C.accent, fg: "#fff", alpha: end, font: `800 28px ${UI}`, h: 60 }); }
  brandMark(W / 2, 92, ease(win(T, 0, 0.6)));
  disclosure(t);
}

/* ------------------------------------------------------------- ugc_style */
function ugc(t) {
  const T = t / 1000; const seg = Math.min(2, Math.floor(T / 3)); const local = T - seg * 3;
  const punch = 1 + 0.07 * (1 - ease(local / 0.5));
  const shakeX = Math.sin(T * 7.1) * 6 + Math.sin(T * 13.3) * 3, shakeY = Math.cos(T * 6.3) * 5, rot = Math.sin(T * 3.7) * 0.008;
  ctx.save(); ctx.translate(W / 2 + shakeX, H / 2 + shakeY); ctx.rotate(rot); ctx.scale(punch, punch);
  coverDraw(ctx, IMG, -W / 2 - 30, -H / 2 - 40, W + 60, H + 80, 1.04 + T * 0.012, 0.5, 0.45); ctx.restore();
  const gTop = ctx.createLinearGradient(0, 0, 0, 260); gTop.addColorStop(0, "rgba(0,0,0,.55)"); gTop.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = gTop; ctx.fillRect(0, 0, W, 260);
  const gBot = ctx.createLinearGradient(0, H - 560, 0, H); gBot.addColorStop(0, "rgba(0,0,0,0)"); gBot.addColorStop(1, "rgba(0,0,0,.7)"); ctx.fillStyle = gBot; ctx.fillRect(0, H - 560, W, 560);
  // story progress
  for (let i = 0; i < 3; i++) {
    const x = 24 + i * ((W - 48) / 3); const w = (W - 48) / 3 - 8;
    ctx.fillStyle = "rgba(255,255,255,.35)"; rr(ctx, x, 26, w, 6, 3); ctx.fill();
    const p = i < seg ? 1 : i === seg ? clamp(local / 3) : 0; ctx.fillStyle = "#fff"; rr(ctx, x, 26, w * p, 6, 3); ctx.fill();
  }
  pill("UGC סינתטי · ממוחשב", 160, 78, { font: `700 21px ${UI}`, bg: "rgba(10,8,14,.6)", fg: "#fff", h: 40, padX: 16 });
  brandMark(W - 120, 90);
  const pop = (a) => back(win(local, a, a + 0.35));
  const chip = (label, y, a, big = false) => pill(label, W / 2, y, { font: big ? `900 40px ${UI}` : `800 30px ${UI}`, h: big ? 76 : 60, padX: 26, scale: pop(a), alpha: clamp(pop(a) * 1.5) });
  if (seg === 0) { chip(C.lines.kicker || "", 860, 0.15, true); }
  if (seg === 1) { wrap(C.lines.title, `900 40px ${UI}`, 600, 2).forEach((l, i) => chip(l, 820 + i * 88, 0.1 + i * 0.25, true)); }
  if (seg === 2) { C.lines.facts.forEach((f, i) => chip(f, 760 + i * 76, 0.1 + i * 0.3)); chip(C.lines.cta, 1060, 1.2); }
  disclosure(t);
}

/* -------------------------------------------------------- animated_story */
function spark(x, y, r, T, squash = 1, mood = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1 / Math.sqrt(squash), squash);
  const glow = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 2.1); glow.addColorStop(0, "rgba(255,214,240,.55)"); glow.addColorStop(1, "rgba(255,214,240,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, r * 2.1, 0, Math.PI * 2); ctx.fill();
  const body = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  body.addColorStop(0, "#fff4fb"); body.addColorStop(0.45, "#c9a6ff"); body.addColorStop(1, "#6b4ad6");
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  const blink = (T % 2.6) > 2.45 ? 0.15 : 1;
  for (const ex of [-r * 0.32, r * 0.32]) {
    ctx.fillStyle = "#1b1530"; ctx.beginPath(); ctx.ellipse(ex, -r * 0.05, r * 0.12, r * 0.18 * blink, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex + r * 0.04, -r * 0.12, r * 0.045, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = "#1b1530"; ctx.lineWidth = r * 0.06; ctx.lineCap = "round"; if (mood >= 0) { ctx.beginPath(); ctx.arc(0, r * 0.18, r * 0.2, 0.2, Math.PI - 0.2); ctx.stroke(); } else { ctx.beginPath(); ctx.arc(0, r * 0.42, r * 0.18, Math.PI + 0.35, -0.35); ctx.stroke(); }
  ctx.fillStyle = "rgba(255,120,170,.45)"; for (const ex of [-r * 0.55, r * 0.55]) { ctx.beginPath(); ctx.ellipse(ex, r * 0.2, r * 0.13, r * 0.08, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function story(t) {
  const T = t / 1000;
  const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#ffd8c2"); sky.addColorStop(0.55, "#f7b6d2"); sky.addColorStop(1, "#8f7bf0");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) { // soft clouds
    const x = ((rand(i) * W + T * (10 + i * 6)) % (W + 300)) - 150, y = 180 + rand(i + 5) * 420, s = 0.6 + rand(i + 2) * 0.8;
    ctx.fillStyle = "rgba(255,255,255,.55)"; for (const [dx, dy, r] of [[0, 0, 60], [55, -20, 70], [115, 0, 55]]) { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2); ctx.fill(); }
  }
  // pedestal (cylinder)
  const px = W / 2, py = 940;
  const side = ctx.createLinearGradient(px - 230, 0, px + 230, 0); side.addColorStop(0, "#5a3fc0"); side.addColorStop(0.5, "#9d86ff"); side.addColorStop(1, "#4b33a8");
  ctx.fillStyle = side; ctx.fillRect(px - 230, py, 460, 120);
  ctx.fillStyle = "#3d2a8f"; ctx.beginPath(); ctx.ellipse(px, py + 120, 230, 44, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = side; ctx.fillRect(px - 230, py, 460, 120);
  const top = ctx.createRadialGradient(px - 60, py - 10, 20, px, py, 240); top.addColorStop(0, "#efe8ff"); top.addColorStop(1, "#b8a6ff");
  ctx.fillStyle = top; ctx.beginPath(); ctx.ellipse(px, py, 230, 44, 0, 0, Math.PI * 2); ctx.fill();
  // product drops in with squash & stretch
  const drop = win(T, 1.4, 2.2); const land = win(T, 2.2, 2.8);
  const cardH = 475, cardW = 380;
  let cy = -400 + (py - cardH / 2 - 8 + 400) * (drop * drop);
  let sq = 1; if (land > 0 && land < 1) sq = 1 - Math.sin(land * Math.PI) * 0.12 * (1 - land);
  if (drop >= 1) cy = py - cardH / 2 - 8;
  if (T >= 1.4) {
    ctx.save(); ctx.translate(px, py - 8); ctx.scale(1 / sq, sq); ctx.translate(-px, -(py - 8));
    card3D(px, cy, cardW, cardH, Math.sin(T * 0.8) * 0.22 * clamp((T - 2.6) / 0.6), { sweep: T > 3 ? ((T - 3) % 3) / 3 : null });
    ctx.restore();
  }
  // confetti burst at landing
  if (T > 2.2 && T < 5) {
    const k = (T - 2.2) / 2.8;
    for (let i = 0; i < 60; i++) {
      const a = rand(i) * Math.PI * 2, v = 260 + rand(i + 4) * 420;
      const x = px + Math.cos(a) * v * k, y = py - 300 + Math.sin(a) * v * k + 520 * k * k;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(x, y); ctx.rotate(T * 6 + i);
      ctx.fillStyle = ["#ff6b8b", "#ffd166", "#8f7bf0", "#4fd1c5", "#fff"][i % 5]; ctx.fillRect(-7, -4, 14, 8); ctx.restore();
    }
  }
  // the mascot bounces in, then hovers beside the product
  const inT = win(T, 0, 1.1); const hop = Math.abs(Math.sin(T * 3.2)) * (T < 1.4 ? 40 : 12);
  const mx = T < 1.4 ? W + 120 - (W + 120 - W / 2) * ease(inT) : W / 2 + (W / 2 - 92) * ease(win(T, 1.4, 2.0));
  const my = (T < 1.4 ? 640 : 600) - hop; const msq = T < 1.4 ? 1 + Math.sin(T * 6.4) * 0.08 : 1 + Math.sin(T * 3.2) * 0.04;
  spark(mx, my, 70, T, msq);
  // speech bubble
  const bub = back(win(T, 0.7, 1.1)) * (T < 6.2 ? 1 : 1 - ease(win(T, 6.2, 6.5)));
  if (bub > 0) {
    const label = T < 3 ? (C.lines.kicker || "") : "תראו מה מצאתי";
    pill(label, T < 1.4 ? W / 2 : mx - 120, my - 120, { font: `800 30px ${UI}`, scale: bub, h: 62 });
  }
  const tl = wrap(C.lines.title, `900 50px ${DISPLAY}`, 620, 2);
  textBlock(tl, W / 2, 150, `900 50px ${DISPLAY}`, 60, "#2a1a52", ease(win(T, 2.8, 3.5)), false);
  C.lines.facts.forEach((f, i) => pill(f, W / 2, 300 + i * 58, { alpha: ease(win(T, 4 + i * 0.6, 4.6 + i * 0.6)), font: `700 25px ${UI}`, h: 50 }));
  if (T > 7.6) pill(C.lines.cta, W / 2, 1150, { bg: "#2a1a52", fg: "#fff", alpha: ease(win(T, 7.6, 8.2)), scale: back(win(T, 7.6, 8.1)), font: `800 28px ${UI}`, h: 60 });
  brandMark(W / 2, 64, 1, "#2a1a52");
  disclosure(t);
}

/* ------------------------------------------------------- hook prelude (v2)
   The first 1.5 s: one specific question in big kinetic type. The product is
   NOT shown yet — the reveal is the payoff of the question. */
function prelude(t) {
  const T = t / 1000, D = (C.hookMs || 1500) / 1000;
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#14101c"); g.addColorStop(1, "#2a1530");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const pulse = 0.75 + 0.25 * Math.sin(T * 9);
  const gl = ctx.createRadialGradient(W / 2, H * 0.45, 20, W / 2, H * 0.45, 520 * pulse); gl.addColorStop(0, C.accent + "aa"); gl.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  // kinetic type: the question builds word by word
  const words = String(C.lines.hook || "").split(/\s+/).filter(Boolean);
  const font = `900 64px ${UI}`; ctx.font = font;
  const lines = wrap(C.lines.hook, font, 600, 3);
  let k = 0; const per = Math.min(0.16, 0.8 / Math.max(1, words.length));
  ctx.save(); ctx.direction = "rtl"; ctx.textAlign = "center"; ctx.font = font;
  lines.forEach((line, li) => {
    const ws = line.split(" "); const shown = [];
    for (const w of ws) { if (T >= 0.08 + k * per) shown.push(w); k += 1; }
    const s = 1 + 0.08 * (1 - ease(win(T, 0.08 + (k - 1) * per, 0.08 + (k - 1) * per + 0.25)));
    ctx.save(); ctx.translate(W / 2, 560 + li * 84 - (lines.length - 1) * 42); ctx.scale(s, s);
    ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 24; ctx.fillStyle = "#fff"; ctx.fillText(shown.join(" "), 0, 0); ctx.restore();
  });
  ctx.restore();
  // underline sweep in the creator's accent
  const u = ease(win(T, 0.5, 1.1)); ctx.fillStyle = C.accent; rr(ctx, W / 2 - 180 * u, 690 + (lines.length - 1) * 42, 360 * u, 10, 5); ctx.fill();
  pill("👀 רגע…", W / 2, 860, { font: `700 30px ${UI}`, bg: "rgba(255,255,255,.12)", fg: "#fff", alpha: ease(win(T, 0.9, 1.2)), h: 58 });
  brandMark(W / 2, 92, 0.85);
  // flash into the reveal
  const f = win(T, D - 0.12, D); if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${0.85 * f})`; ctx.fillRect(0, 0, W, H); }
  disclosure(t);
}

/* -------------------------------------------------------- animated_unbox
   An original gift box: anticipation shake, lid pop, light rays, the product
   card rises out of the box. All shapes drawn here. */
function unbox(t) {
  const T = t / 1000;
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#fff3ea"); bg.addColorStop(0.6, "#ffd9e4"); bg.addColorStop(1, "#e9d6ff");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(90,40,90,.08)"; ctx.beginPath(); ctx.ellipse(W / 2, 1060, 340, 60, 0, 0, Math.PI * 2); ctx.fill();
  const bx = W / 2, bw = 400, bh = 300, depth = 70;
  const rise = back(win(T, 0.0, 0.9));
  const by = 1040 - bh + (1 - rise) * 700; // top edge of the front face
  const shake = T > 1.0 && T < 1.9 ? Math.sin(T * 60) * 9 * win(T, 1.0, 1.85) : 0;
  const open = win(T, 1.9, 2.4);

    ctx.save(); ctx.translate(bx, by); ctx.globalAlpha = 0.55 * ease(open) * (T < 6 ? 1 : 1 - win(T, 6, 7));
    for (let i = 0; i < 14; i++) {
      const a = -Math.PI / 2 + (i - 6.5) * 0.17 + Math.sin(T * 0.8) * 0.05;
      const gr = ctx.createLinearGradient(0, 0, Math.cos(a) * 900, Math.sin(a) * 900); gr.addColorStop(0, "rgba(255,240,200,.9)"); gr.addColorStop(1, "rgba(255,240,200,0)");
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a - 0.05) * 900, Math.sin(a - 0.05) * 900); ctx.lineTo(Math.cos(a + 0.05) * 900, Math.sin(a + 0.05) * 900); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  ctx.save(); ctx.translate(shake, 0);
  // box back / inner opening
  ctx.fillStyle = "#4a2a6a"; ctx.beginPath(); ctx.moveTo(bx - bw / 2, by); ctx.lineTo(bx - bw / 2 + depth, by - depth * 0.6); ctx.lineTo(bx + bw / 2 + depth, by - depth * 0.6); ctx.lineTo(bx + bw / 2, by); ctx.closePath(); ctx.fill();

  const up = ease(win(T, 2.2, 3.4));
  if (up > 0) {
    const ch = 470, cw = 376; const cy = by + 120 - up * 420 + Math.sin(T * 1.8) * 6 * win(T, 3.4, 4);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, by + 2); ctx.clip();
    card3D(bx, cy, cw * (0.8 + 0.2 * up), ch * (0.8 + 0.2 * up), Math.sin(T * 0.9) * 0.2 * win(T, 3.2, 3.8), { bare: true, sweep: T > 3.4 ? ((T - 3.4) % 2.8) / 2.8 : null });

  }

  const fg = ctx.createLinearGradient(bx - bw / 2, 0, bx + bw / 2, 0); fg.addColorStop(0, C.accent); fg.addColorStop(1, shade(C.accent, -40));
  ctx.fillStyle = fg; rr(ctx, bx - bw / 2, by, bw, bh, 14); ctx.fill();
  ctx.fillStyle = shade(C.accent, -70); ctx.beginPath(); ctx.moveTo(bx + bw / 2, by); ctx.lineTo(bx + bw / 2 + depth, by - depth * 0.6); ctx.lineTo(bx + bw / 2 + depth, by + bh - depth * 0.6); ctx.lineTo(bx + bw / 2, by + bh); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.fillRect(bx - 22, by, 44, bh); // ribbon
  ctx.fillStyle = "rgba(255,255,255,.18)"; rr(ctx, bx - bw / 2 + 18, by + 18, 70, bh - 36, 10); ctx.fill(); // gloss
  // the lid flies off
  const lidY = by - 34 - ease(open) * 1500, lidR = open * 0.9, lidX = bx + open * 260;
  if (open < 1) {
    ctx.save(); ctx.translate(lidX, lidY); ctx.rotate(lidR);
    ctx.fillStyle = shade(C.accent, 15); rr(ctx, -bw / 2 - 18, -10, bw + 36, 64, 14); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillRect(-22, -10, 44, 64);
    ctx.fillStyle = "#fff"; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 46, -26, 48, 26, sx * 0.5, 0, Math.PI * 2); ctx.fill(); }

    ctx.restore();
  }
  ctx.restore();

  if (T > 2.3 && T < 5.2) {
    const k = (T - 2.3) / 2.9;
    for (let i = 0; i < 70; i++) {
      const a = -Math.PI / 2 + (rand(i) - 0.5) * 2.2, v = 300 + rand(i + 4) * 520;
      const x = bx + Math.cos(a) * v * k, y = by + Math.sin(a) * v * k + 640 * k * k;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(x, y); ctx.rotate(T * 7 + i);
      ctx.fillStyle = ["#ff6b8b", "#ffd166", "#8f7bf0", "#4fd1c5", C.accent][i % 5]; ctx.fillRect(-7, -4, 14, 8); ctx.restore();
    }

  const tl = wrap(C.lines.title, `900 50px ${DISPLAY}`, 620, 2);
  textBlock(tl, W / 2, 150, `900 50px ${DISPLAY}`, 60, "#2a1a52", ease(win(T, 3.2, 3.9)), false);
  C.lines.facts.forEach((f, i) => pill(f, W / 2, by + 80 + i * 66, { alpha: ease(win(T, 4.2 + i * 0.5, 4.7 + i * 0.5)), scale: 0.9 + 0.1 * back(win(T, 4.2 + i * 0.5, 4.7 + i * 0.5)), font: `800 27px ${UI}`, h: 54 }));
  if (T > 6.8) pill(C.lines.cta, W / 2, 1180, { bg: "#2a1a52", fg: "#fff", alpha: ease(win(T, 6.8, 7.4)), scale: back(win(T, 6.8, 7.3)), font: `800 28px ${UI}`, h: 60 });

}
function shade(hex, d) {
  const n = parseInt(hex.slice(1), 16); const c = (v) => Math.max(0, Math.min(255, v + d));

/* ---------------------------------------------------- likeloop_cinematic
   LikeLoop Cinematic — an original 6-beat short: world → tension → change →
   hero → CTA. Original character ("spark"), an original mirror scene; story
   lines come from concept.story (built from the product's own category). */
function likeloop(t) {
  const T = t / 1000;
  const beats = C.story || [];
  const at = (name) => beats.find((b) => b.beat === name) || { line: "" };
  // scene clock (the 1.5 s hook prelude already ran): world 0.5–3.5, tension 3.5–7.5,
  // change 7.5–11.5, hero 11.5–14.5, cta 14.5–18.5
  const warm = ease(win(T, 7.5, 9));
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, `rgb(${Math.round(40 + 215 * warm)},${Math.round(36 + 180 * warm)},${Math.round(70 + 120 * warm)})`);
  sky.addColorStop(1, `rgb(${Math.round(24 + 120 * warm)},${Math.round(20 + 90 * warm)},${Math.round(48 + 160 * warm)})`);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // room: floor + soft window light
  ctx.fillStyle = `rgba(255,255,255,${0.04 + 0.08 * warm})`; ctx.fillRect(0, 980, W, 300);
  const glow = ctx.createRadialGradient(W * 0.75, 260, 20, W * 0.75, 260, 520); glow.addColorStop(0, `rgba(255,220,170,${0.15 + 0.45 * warm})`); glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  // the mirror (an arch), with the character's reflection
  const mx = W / 2 - 40, my = 360, mw = 300, mh = 520;
  ctx.save(); ctx.translate(0, (1 - ease(win(T, 0.2, 1.2))) * 60); ctx.globalAlpha = ease(win(T, 0.2, 1.0)) * (T < 11.3 ? 1 : 1 - ease(win(T, 11.3, 12)));

  ctx.fillStyle = "rgba(210,225,255,.18)"; ctx.fill(); ctx.lineWidth = 14; ctx.strokeStyle = "#e8c48a"; ctx.stroke(); ctx.clip();
  spark(mx + 10, my + 330 + Math.sin(T * 2) * 6, 66, T, 1, T > 3.5 && T < 8.5 ? -1 : 1);
  ctx.restore();
  // the character, in front of the mirror
  const sad = T > 3.5 && T < 8.5;
  const cx = W / 2 + 150, cy = 760 + Math.abs(Math.sin(T * (sad ? 1.2 : 3))) * (sad ? 4 : 14);
  if (T < 11.6) spark(cx, cy, 82, T, 1 + Math.sin(T * 3) * 0.03, sad ? -1 : 1);

  const enter = back(win(T, 8.2, 9.4)), hero = easeInOut(win(T, 11.3, 12.6));
  if (T > 8.2) {
    const px = (W + 300) - (W + 300 - (W / 2 - 120)) * enter + (W / 2 - (W / 2 - 120)) * hero;
    const py = 640 + (560 - 640) * hero;
    const s = 0.55 + 0.45 * hero;
    card3D(px, py, 420 * s, 525 * s, Math.sin(T * 0.9) * 0.25 * (1 - hero) + Math.sin(T * 0.8) * 0.18 * hero, { bare: hero < 0.5, sweep: T > 12.6 ? ((T - 12.6) % 2.6) / 2.6 : null });
    if (T > 9 && T < 12.5) for (let i = 0; i < 26; i++) { // sparkles around the change
      const a = rand(i) * Math.PI * 2, r0 = 120 + rand(i + 3) * 160, k = ((T - 9) * 0.6 + rand(i + 7)) % 1;
      ctx.fillStyle = `rgba(255,236,190,${(1 - k) * 0.9})`; ctx.beginPath(); ctx.arc(px + Math.cos(a) * r0 * k, py + Math.sin(a) * r0 * k, 3 + rand(i) * 5, 0, Math.PI * 2); ctx.fill();
    }
  }
  // Hebrew captions per beat (burned in)
  const cap = (line, a, b) => { const al = ease(win(T, a, a + 0.4)) * (1 - ease(win(T, b - 0.35, b))); if (al > 0 && line) pill(line, W / 2, 1110, { font: `800 34px ${UI}`, h: 74, alpha: al, bg: "rgba(255,255,255,.95)" }); };
  cap(at("world").line, 0.5, 3.5);
  cap(at("tension").line, 3.5, 7.5);
  cap(at("change").line, 7.5, 11.5);
  if (T > 11.8) textBlock(wrap(C.lines.title, `900 50px ${DISPLAY}`, 620, 2), W / 2, 150, `900 50px ${DISPLAY}`, 60, "#fff", ease(win(T, 11.8, 12.5)));
  if (T > 12.6) C.lines.facts.forEach((f, i) => pill(f, W / 2, 930 + i * 60, { alpha: ease(win(T, 12.6 + i * 0.4, 13.1 + i * 0.4)), font: `700 25px ${UI}`, h: 50 }));
  if (T > 14.5) pill(C.lines.cta, W / 2, 1150, { bg: C.accent, fg: "#fff", alpha: ease(win(T, 14.5, 15)), scale: back(win(T, 14.5, 15)), font: `800 30px ${UI}`, h: 64 });
  brandMark(W / 2, 64, 0.9);
  disclosure(t);
}


/* ---------------------------------------------------------- street_story
   An original stylized character walks down a sunny street (setup), the sky
   turns and her curls frizz in the rain (twist), the real product photo is the

function walker(x, y, T, walk, frizz, mood) {

    ctx.fillStyle = "#7f9cc9"; rr(ctx, -22, 0, 44, 230, 20); ctx.fill();
    ctx.fillStyle = "#1d1a24"; ctx.beginPath(); ctx.ellipse(6, 236, 30, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  ctx.fillStyle = "#f7f1ea"; rr(ctx, -62, -120, 124, 250, 40); ctx.fill();
  ctx.fillStyle = "#f08aa8";
  ctx.beginPath(); ctx.moveTo(-78, -110); ctx.lineTo(-24, -118); ctx.lineTo(-30, 140); ctx.lineTo(-86, 128); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(78, -110); ctx.lineTo(24, -118); ctx.lineTo(30, 140); ctx.lineTo(86, 128); ctx.closePath(); ctx.fill();
  // arm + bag (swings opposite to the legs)
  ctx.save(); ctx.translate(-80, -96); ctx.rotate(-sw * 0.6);
  ctx.fillStyle = "#f08aa8"; rr(ctx, -18, 0, 36, 170, 18); ctx.fill();
  ctx.fillStyle = "#211b26"; rr(ctx, -46, 150, 70, 84, 14); ctx.fill(); ctx.strokeStyle = "#211b26"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(-11, 150, 26, Math.PI, 0); ctx.stroke();
  ctx.restore();
  // neck + head
  ctx.fillStyle = "#e9b48f"; rr(ctx, -16, -150, 32, 40, 12); ctx.fill();
  const hairR = 118 * (1 + frizz * 0.38);
  // one shaded hair mass behind the head, falling to the shoulders
  const hg = ctx.createRadialGradient(-30, -250, 20, 0, -170, hairR * 1.5);
  hg.addColorStop(0, "#9a5a35"); hg.addColorStop(0.55, "#6a3720"); hg.addColorStop(1, "#3c1f12");
  ctx.fillStyle = hg; ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const a = (i / 40) * Math.PI * 2, wav = 1 + 0.07 * Math.sin(a * 9 + T * 3) + frizz * 0.12 * Math.sin(a * 17 + T * 6);
    const rx = hairR * 1.08 * wav, ry = hairR * 1.3 * wav;
    const x = Math.cos(a) * rx, y = -165 + Math.sin(a) * ry;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill();

  ctx.lineWidth = 5; ctx.lineCap = "round";
  for (let i = 0; i < 34; i++) {
    const a = rand(i) * Math.PI * 2, d = hairR * (0.35 + rand(i + 9) * 0.6);
    const x = Math.cos(a) * d * 1.05, y = -165 + Math.sin(a) * d * 1.25;
    if (Math.abs(x) < 58 && y > -275 && y < -130) continue; // keep the face clear
    ctx.strokeStyle = `rgba(214,150,100,${0.35 + rand(i + 2) * 0.35})`;
    ctx.beginPath(); ctx.arc(x, y + Math.sin(T * 4 + i) * (1 + frizz * 3), 9 + rand(i + 4) * 9 + frizz * 5, rand(i) * 6, rand(i) * 6 + 3.6); ctx.stroke();
  }

  ctx.fillStyle = "rgba(240,120,140,.35)"; for (const ex of [-34, 34]) { ctx.beginPath(); ctx.ellipse(ex, -180, 13, 8, 0, 0, Math.PI * 2); ctx.fill(); }
  // sunglasses + lips
  ctx.fillStyle = "#14121a"; rr(ctx, -50, -228, 44, 30, 12); ctx.fill(); rr(ctx, 6, -228, 44, 30, 12); ctx.fill(); ctx.fillRect(-8, -218, 16, 5);
  ctx.fillStyle = "rgba(255,255,255,.35)"; rr(ctx, -44, -224, 14, 8, 4); ctx.fill(); rr(ctx, 12, -224, 14, 8, 4); ctx.fill();

    const lg = ctx.createLinearGradient(side * 60, -270, side * 80, -120); lg.addColorStop(0, "#a56238"); lg.addColorStop(1, "#6a3720");

  }
  ctx.restore();

function street(t) {
  const T = t / 1000, L0 = C.street || { setup: "", twist: "", payoff: "" };
  const noEmoji = (x) => String(x || "").replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, "").trim();
  const L = { setup: noEmoji(L0.setup), twist: noEmoji(L0.twist), payoff: noEmoji(L0.payoff) };
  const rain = ease(win(T, 4, 5)) * (1 - ease(win(T, 7.5, 8.6)));
  const walk = T < 4 ? 1 : T < 7.5 ? 0.15 : T < 11 ? 0.8 : 0.4;
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  const mix = (a, b) => Math.round(a + (b - a) * rain);
  sky.addColorStop(0, `rgb(${mix(132, 92)},${mix(196, 104)},${mix(240, 122)})`); sky.addColorStop(1, `rgb(${mix(255, 120)},${mix(226, 126)},${mix(196, 140)})`);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // parallax facades (far, near) + trees + lamps
  const off = (T * 70) % 260;
  for (let layer = 0; layer < 2; layer++) {
    const spd = layer ? 1 : 0.45, base = layer ? 300 : 220, col = layer ? `rgb(${mix(238, 150)},${mix(220, 150)},${mix(196, 156)})` : `rgb(${mix(214, 132)},${mix(196, 134)},${mix(176, 142)})`;
    for (let i = -1; i < 5; i++) {
      const bx = i * 260 - ((T * 70 * spd) % 260);
      ctx.fillStyle = col; ctx.fillRect(bx, base, 250, 820 - base + 200);
      ctx.fillStyle = `rgba(60,70,90,${0.35 + 0.2 * layer})`;
      for (let wy = 0; wy < 4; wy++) for (let wx = 0; wx < 3; wx++) { rr(ctx, bx + 28 + wx * 74, base + 40 + wy * 120, 44, 70, 8); ctx.fill(); }
      if (layer) { ctx.fillStyle = "#b8463f"; ctx.fillRect(bx + 10, base + 520, 230, 26); }
    }
  }
  for (let i = -1; i < 4; i++) { // trees in front
    const tx = i * 340 - ((T * 110) % 340) + 120;
    ctx.fillStyle = "#5b3b25"; ctx.fillRect(tx - 9, 640, 18, 360);
    ctx.fillStyle = rain > 0.5 ? "#4e7a4a" : "#6fae5a"; for (const [dx, dy, r] of [[0, 0, 90], [-60, 40, 70], [60, 40, 70]]) { ctx.beginPath(); ctx.arc(tx + dx, 600 + dy, r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.fillStyle = `rgb(${mix(206, 120)},${mix(196, 120)},${mix(184, 128)})`; ctx.fillRect(0, 1000, W, 280);
  // the character
  const exit = easeInOut(win(T, 10.6, 11.4));
  if (exit < 1) { ctx.save(); ctx.globalAlpha = 1 - exit; walker(W / 2 - 40 - exit * 420, 760, T, walk, rain, T > 4 && T < 8 ? -1 : 1); ctx.restore(); }
  // rain streaks

  // payoff: the real product enters
  const enter = back(win(T, 8, 9));
  if (T > 8) {
    const hero = easeInOut(win(T, 11, 12));
    const px = W + 260 - (W + 260 - (W - 190)) * enter - (W - 190 - W / 2) * hero, py = 640 - 110 * hero, sc = 0.55 + 0.4 * hero;
    card3D(px, py, 420 * sc, 525 * sc, Math.sin(T * 0.9) * 0.2, { sweep: ((T - 8) % 2.4) / 2.4 });
    if (T < 11) for (let i = 0; i < 20; i++) { const a = rand(i) * 6.28, k = ((T - 8) * 0.7 + rand(i + 3)) % 1; ctx.fillStyle = `rgba(255,236,190,${(1 - k) * 0.9})`; ctx.beginPath(); ctx.arc(px + Math.cos(a) * 200 * k, py + Math.sin(a) * 200 * k, 3 + rand(i) * 5, 0, 6.28); ctx.fill(); }
  }
  // captions: big, creator-style, one per beat

  cap(L.setup, 0.2, 4);

  if (T > 11.4) textBlock(wrap(C.lines.title, `900 46px ${DISPLAY}`, 620, 2), W / 2, 170, `900 46px ${DISPLAY}`, 56, "#fff", ease(win(T, 11.4, 12)));
  if (T > 12) C.lines.facts.forEach((f, i) => pill(f, W / 2, 960 + i * 58, { alpha: ease(win(T, 12 + i * 0.35, 12.5 + i * 0.35)), font: `700 25px ${UI}`, h: 50 }));
  if (T > 13) pill(C.lines.cta, W / 2, 1150, { bg: C.accent, fg: "#fff", alpha: ease(win(T, 13, 13.4)), scale: back(win(T, 13, 13.5)), font: `800 32px ${UI}`, h: 66 });

/* ------------------------------------------------------------ text_hook */
// Creator-style text reel: the real product photo full-bleed with a slow push-in,

  ctx.lineJoin = "round"; ctx.lineWidth = Math.round(size * 0.2); ctx.strokeStyle = "rgba(0,0,0,.92)"; ctx.fillStyle = "#fff";
  lines.forEach((l, i) => { const yy = y + i * size * lh; ctx.strokeText(l, W / 2, yy); ctx.fillText(l, W / 2, yy); });
  ctx.restore();
}
function textHook(ms) {
  const t = ms / 1000; // the renderer passes milliseconds
  const noEmoji = (x) => String(x || "").replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, "").trim();
  const TH = C.textHook || { hook: C.lines.hook, reveal: [C.lines.title], cta: [C.lines.cta] };
  // background: the product photo, slow push-in, soft vignette for legibility
  ctx.drawImage(BLUR, 0, 0, W, H);

  coverDraw(ctx, IMG, 0, 0, W, H, z, 0.5, 0.45);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "rgba(0,0,0,.55)"); g.addColorStop(0.42, "rgba(0,0,0,.05)"); g.addColorStop(0.75, "rgba(0,0,0,.05)"); g.addColorStop(1, "rgba(0,0,0,.6)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const beat = (a, b) => ease(win(t, a, a + 0.35)) * (1 - ease(win(t, b - 0.3, b)));
  const hookA = beat(0, 4.2), revA = beat(4.2, 7.6), ctaA = t >= 7.6 ? ease(win(t, 7.6, 8)) : 0;
  if (hookA > 0) outlined(wrap(noEmoji(TH.hook), `900 64px ${UI}`, 640, 4), 250, 64, hookA);
  if (revA > 0) {
    const lines = [...wrap(noEmoji(TH.reveal[0] || ""), `900 54px ${UI}`, 640, 3), ...TH.reveal.slice(1).map(noEmoji)];

  if (ctaA > 0) {
    outlined(TH.cta.map(noEmoji), 250, 66, ctaA);
    pill((TH.pill || "הקישור בביו"), W / 2, 1110, { bg: C.accent, fg: "#fff", alpha: ctaA, scale: back(win(t, 7.8, 8.3)), font: `900 36px ${UI}`, h: 74, padX: 30 });
  }

}

/* Creator-style caption: each line on its own bold colour box, popping in
   (the look of the reels that travel on the owner's account). */
function boxed(lines, y, size, alpha = 1, { bg = C.accent || "#d22f5d", fg = "#fff", pop = 1 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = `900 ${size}px ${UI}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "rtl";
  lines.forEach((l, i) => {
    const w = ctx.measureText(l).width + size * 0.7, h = size * 1.32, yy = y + i * (h + 8);
    ctx.save(); ctx.translate(W / 2, yy); const sc = 0.82 + 0.18 * pop; ctx.scale(sc, sc); ctx.rotate((i % 2 ? 1 : -1) * 0.012);
    ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 18; ctx.fillStyle = i === 0 ? bg : "#fff"; rr(ctx, -w / 2, -h / 2, w, h, size * 0.28); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = i === 0 ? fg : "#17131f"; ctx.fillText(l, 0, 3); ctx.restore();

}
/* A short white flash + punch on a scene cut. */
function cutFlash(t, at) {
  const k = 1 - clamp(Math.abs(t - at) / 0.18);

}

/* ------------------------------------------------------------ ai_story */
// Two AI character scenes (labelled) → the product's REAL photo → comment CTA.
function aiStory(ms) {
  const t = ms / 1000;
  const noEmoji = (x) => String(x || "").replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, "").trim();
  const AI = C.aiStory, TH = C.textHook;
  const sceneAt = (img, a, b, fx, from = 1.04, to = 1.14) => { const k = easeInOut(win(t, a, b)); coverDraw(ctx, img, 0, 0, W, H, from + (to - from) * k, fx, 0.4); };
  const fade = (a, b) => ease(win(t, a, a + 0.4)) * (1 - ease(win(t, b - 0.35, b)));
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  if (t < 4.2 && SCENES[0]) sceneAt(SCENES[0], 0, 4.2, 0.45, 1.16, 1.04);
  else if (t < 7.6 && SCENES[1]) sceneAt(SCENES[1], 4.2, 7.6, 0.55);
  else { ctx.drawImage(BLUR, 0, 0, W, H); coverDraw(ctx, IMG, 0, 0, W, H, 1.02 + 0.08 * easeInOut(win(t, 7.6, 14)), 0.5, 0.45); }
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "rgba(0,0,0,.5)"); g.addColorStop(0.4, "rgba(0,0,0,0)"); g.addColorStop(0.78, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.6)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const c1 = fade(0.2, 4.2), c2 = fade(4.3, 7.6), c3 = fade(7.7, 10.8), c4 = t >= 10.8 ? ease(win(t, 10.8, 11.2)) : 0;
  if (c1 > 0) boxed(wrap(noEmoji(AI.scenes[0].caption), `900 60px ${UI}`, 600, 3), 250, 60, c1, { pop: back(win(t, 0.05, 0.45)) });
  if (c2 > 0) boxed(wrap(noEmoji(AI.scenes[1].caption), `900 60px ${UI}`, 600, 3), 250, 60, c2, { pop: back(win(t, 4.3, 4.7)) });
  if (c3 > 0) outlined([...wrap(noEmoji(TH.reveal[0] || ""), `900 54px ${UI}`, 640, 3), ...TH.reveal.slice(1).map(noEmoji)], 240, 54, c3);
  if (c4 > 0) {
    outlined(TH.cta.map(noEmoji), 250, 66, c4);
    pill((TH.pill || "הקישור בביו"), W / 2, 1110, { bg: C.accent, fg: "#fff", alpha: c4, scale: back(win(t, 11, 11.5)), font: `900 36px ${UI}`, h: 74, padX: 30 });
  }
  if (t < 7.6) pill("דמות שנוצרה ב-AI · המוצר בהמשך בתמונה אמיתית", W / 2, 120, { font: `700 22px ${UI}`, bg: "rgba(10,8,14,.6)", fg: "#fff", h: 42, padX: 16 });
  cutFlash(t, 4.2); cutFlash(t, 7.6);
  brandMark(W / 2, 1200, 0.9);

}

/* ------------------------------------------------------------- ai_ugc */
// A virtual 3D creator (AI, labelled) films herself: HOOK → PROBLEM/DESIRE →
// the product's REAL photo → real facts only → comment CTA. No testimonial,
// no claim of use: the captions are questions and catalog fields.
function aiUgc(ms) {
  const t = ms / 1000;
  const noEmoji = (x) => String(x || "").replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, "").trim();
  const AI = C.aiStory, TH = C.textHook;
  const fade = (a, b) => ease(win(t, a, a + 0.35)) * (1 - ease(win(t, b - 0.3, b)));
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const inScene = t < 6.4;
  if (t < 3.2 && SCENES[0]) { const k = easeInOut(win(t, 0, 3.2)); const jx = Math.sin(t * 5.3) * 4, jy = Math.cos(t * 4.1) * 3; coverDraw(ctx, SCENES[0], jx - 10, jy - 10, W + 20, H + 20, 1.06 + 0.05 * k, 0.5, 0.4); }
  else if (t < 6.4 && SCENES[1]) { const k = easeInOut(win(t, 3.2, 6.4)); const jx = Math.sin(t * 4.7) * 4, jy = Math.cos(t * 3.9) * 3; coverDraw(ctx, SCENES[1], jx - 10, jy - 10, W + 20, H + 20, 1.12 - 0.05 * k, 0.5, 0.4); }
  else { ctx.drawImage(BLUR, 0, 0, W, H); const punch = 1 + 0.06 * (1 - ease(win(t, 6.4, 6.9))); coverDraw(ctx, IMG, 0, 0, W, H, (1.02 + 0.08 * easeInOut(win(t, 6.4, 15))) * punch, 0.5, 0.45); }
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "rgba(0,0,0,.5)"); g.addColorStop(0.4, "rgba(0,0,0,0)"); g.addColorStop(0.75, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.65)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // creator-video chrome while the virtual creator is on screen
  if (inScene) {
    ctx.fillStyle = (t % 1) < 0.6 ? "#ff3b4e" : "rgba(255,59,78,.35)"; ctx.beginPath(); ctx.arc(W - 48, 168, 9, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 5; i++) { const x = 24 + i * ((W - 48) / 5), w = (W - 48) / 5 - 8; ctx.fillStyle = "rgba(255,255,255,.35)"; rr(ctx, x, 26, w, 6, 3); ctx.fill(); const p = clamp((t - i * 3) / 3); ctx.fillStyle = "#fff"; rr(ctx, x, 26, w * p, 6, 3); ctx.fill(); }
  }

  if (c2 > 0) boxed(wrap(noEmoji(AI.scenes[1].caption), `900 58px ${UI}`, 600, 3), 260, 58, c2, { pop: back(win(t, 3.3, 3.7)) });
  if (c3 > 0) outlined([...wrap(noEmoji(TH.reveal[0] || ""), `900 54px ${UI}`, 640, 3), ...TH.reveal.slice(1).map(noEmoji)], 240, 54, c3);
  if (c4 > 0) (C.lines.facts || []).slice(0, 3).forEach((f, i) => pill(noEmoji(f), W / 2, 820 + i * 78, { alpha: c4, scale: back(win(t, 9.7 + i * 0.25, 10.1 + i * 0.25)), font: `800 30px ${UI}`, h: 62, padX: 26 }));
  if (c5 > 0) {
    outlined(TH.cta.map(noEmoji), 250, 66, c5);
    pill((TH.pill || "הקישור בביו"), W / 2, 1110, { bg: C.accent, fg: "#fff", alpha: c5, scale: back(win(t, 12.4, 12.9)), font: `900 36px ${UI}`, h: 74, padX: 30 });
  }
  if (inScene) pill("יוצרת וירטואלית · נוצרה ב-AI · לא אדם אמיתי", W / 2, 120, { font: `700 22px ${UI}`, bg: "rgba(10,8,14,.62)", fg: "#fff", h: 42, padX: 16 });
  else if (t < 12.2) pill("המוצר · תמונה אמיתית מדף המוצר", W / 2, 120, { font: `700 22px ${UI}`, bg: "rgba(10,8,14,.55)", fg: "#fff", h: 42, padX: 16 });
  cutFlash(t, 3.2); cutFlash(t, 6.4);

window.renderFrame = (t, quality = 0.9) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); ctx.globalAlpha = 1; ctx.filter = "none";
  const hook = C.hookMs || 0;
  if (t < hook) { prelude(t); return cv.toDataURL("image/jpeg", quality); }
  const s = t - hook;
  if (C.style === "cinematic3d") cinematic(s); else if (C.style === "ugc_style") ugc(s); else if (C.style === "animated_unbox") unbox(s); else if (C.style === "likeloop_cinematic") likeloop(s); else if (C.style === "street_story") street(s); else if (C.style === "text_hook") textHook(s); else if (C.style === "ai_story") aiStory(s); else if (C.style === "ai_ugc") aiUgc(s); else story(s);
