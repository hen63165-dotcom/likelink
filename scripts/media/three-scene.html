<script type="module">
// LikeLink native 3D reel ("cinema3d"): a REAL 3D scene rendered frame by frame
// in headless Chromium (WebGL) on the render runner — no AI model, no external
// service, no credits. An ORIGINAL character (not based on any film or studio)
// tells a 5-beat story; the product appears ONLY as its real photo (texture),
// never redrawn. Hebrew text is composited on top in 2D (never asked of a model).
// Every frame carries the disclosure and an "original character · 3D animation" label.
//
//   0.0–3.2 s  HOOK     establishing shot, puzzled character, hook question
//   3.2–6.2 s  PROBLEM  the everyday moment (category world), worried face
//   6.2–9.4 s  REVEAL   a gift box drops, the lid pops, the real photo rises
//   9.4–12.8 s HERO     the real photo front and centre, title + catalog price
//   12.8– end  CTA      character waves, "תגיבו: קישור"
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const W = 720, H = 1280;
const gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
gl.setSize(W, H); gl.setPixelRatio(1);
gl.shadowMap.enabled = true; gl.shadowMap.type = THREE.PCFSoftShadowMap;
gl.toneMapping = THREE.ACESFilmicToneMapping; gl.toneMappingExposure = 1.0;
gl.outputColorSpace = THREE.SRGBColorSpace;
const out = document.createElement("canvas"); out.width = W; out.height = H; document.body.appendChild(out);
const ctx = out.getContext("2d");

const UI = "'Noto Sans Hebrew','Noto Sans','DejaVu Sans',Arial,sans-serif";
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const back = (t) => { t = clamp(t); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const win = (t, a, b) => clamp((t - a) / (b - a));
const lerp = THREE.MathUtils.lerp;
const hash = (s) => [...String(s)].reduce((a, ch) => (a * 31 + ch.codePointAt(0)) >>> 0, 7);
const noEmoji = (x) => String(x || "").replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, "").trim();

/* ------------------------------------------------------------ materials */
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, ...o });
const P = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.5, ...o });
function canvasTex(w, h, draw, repeat = null) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const shadowAll = (o) => o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

/* ---------------------------------------------------------- the stage */
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(gl);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(34, W / H, 0.1, 120);
const key = new THREE.DirectionalLight("#fff0dc", 2.4);
key.position.set(3.5, 7, 5); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 5; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -4, near: 0.5, far: 30 });
scene.add(key);
const rim = new THREE.DirectionalLight("#a9c8ff", 1.5); rim.position.set(-5, 4, -4); scene.add(rim);
const hemi = new THREE.HemisphereLight("#fff6ee", "#b38c7a", 0.55); scene.add(hemi);
const world = new THREE.Group(); scene.add(world);

const PALETTES = {
  room: { bg: "#f4d6c6", wall: "#f6dccd", side: "#efcdbb", floor: "#c98f6b", accent: "#e46d8c" },
  desk: { bg: "#d9dcf2", wall: "#dfe2f6", side: "#d3d6ef", floor: "#a07b63", accent: "#6f5bff" },
  park: { bg: "#bfe4ff", wall: "#bfe4ff", side: "#bfe4ff", floor: "#7cc46a", accent: "#ff8a3d" },
};

function buildRoom(pal) {
  scene.background = new THREE.Color(pal.bg); scene.fog = new THREE.Fog(pal.bg, 12, 30);
  const planks = canvasTex(512, 512, (x, w, h) => { for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? pal.floor : new THREE.Color(pal.floor).offsetHSL(0, 0, 0.04).getStyle(); x.fillRect(0, i * h / 8, w, h / 8 - 3); x.fillStyle = "rgba(0,0,0,.15)"; x.fillRect(0, i * h / 8 + h / 8 - 3, w, 3); } }, [4, 4]);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ map: planks, roughness: 0.6 })); floor.rotation.x = -Math.PI / 2; world.add(floor);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(30, 14), M(pal.wall, { roughness: 0.95 })); back.position.set(0, 7, -4.5); world.add(back);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), M(pal.side, { roughness: 0.95 })); side.rotation.y = Math.PI / 2; side.position.set(-4.2, 7, 2); world.add(side);
  const rug = new THREE.Mesh(new THREE.CircleGeometry(2.2, 64), M(pal.accent, { roughness: 1 })); rug.rotation.x = -Math.PI / 2; rug.position.set(0.3, 0.01, 0.6); rug.scale.y = 0.75; world.add(rug);
  const winGlow = new THREE.Mesh(new RoundedBoxGeometry(2.0, 2.6, 0.12, 4, 0.1), new THREE.MeshStandardMaterial({ color: "#fff8e6", emissive: "#ffefc4", emissiveIntensity: 1.5 }));
  winGlow.position.set(-1.6, 3.6, -4.42); world.add(winGlow);
  const bar = M("#ffffff"); [[0, 0, 0.08, 2.6], [0, 0, 2.0, 0.08]].forEach(([x, y, w, h]) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.16), bar); b.position.set(-1.6 + x, 3.6 + y, -4.36); world.add(b); });
  // shelf with books
  const shelf = new THREE.Mesh(new RoundedBoxGeometry(2.2, 0.1, 0.5, 2, 0.03), M("#9b6a4a")); shelf.position.set(2.2, 3.2, -4.2); world.add(shelf);
  ["#ff9aa2", "#ffd28a", "#9ad7c2", "#a4b4ff", "#f7a6ff"].forEach((c, i) => { const b = new THREE.Mesh(new RoundedBoxGeometry(0.18, 0.55 + (i % 2) * 0.12, 0.38, 2, 0.02), M(c)); b.position.set(1.4 + i * 0.24, 3.55 + (i % 2) * 0.06, -4.2); b.rotation.z = i === 4 ? 0.25 : 0; world.add(b); });
  // plant + lamp
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.24, 0.55, 32), M("#d9734f", { roughness: 0.55 })); pot.position.set(3.0, 0.27, -2.6); world.add(pot);
  for (let i = 0; i < 9; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 20), M("#3f9a5a", { roughness: 0.55 })); l.scale.set(0.55, 1.7, 0.35); l.position.set(3.0 + Math.cos(i * 0.7) * 0.15, 0.95 + (i % 3) * 0.08, -2.6 + Math.sin(i * 0.7) * 0.15); l.rotation.set(Math.sin(i) * 0.4, i, (i - 4) * 0.22); world.add(l); }
  const lampPole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.6), M("#333", { metalness: 0.6, roughness: 0.3 })); lampPole.position.set(-3.1, 1.3, -2.2); world.add(lampPole);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.55, 32, 1, true), new THREE.MeshStandardMaterial({ color: "#fff1d6", emissive: "#ffd99a", emissiveIntensity: 0.8, side: THREE.DoubleSide })); shade.position.set(-3.1, 2.75, -2.2); world.add(shade);
}
function buildDesk(pal) {
  buildRoom(pal);
  const top = new THREE.Mesh(new RoundedBoxGeometry(3.6, 0.16, 1.6, 4, 0.05), M("#8a5a3c", { roughness: 0.45 })); top.position.set(1.9, 1.35, -2.9); world.add(top);
  [[0.3, -3.5], [3.5, -3.5], [0.3, -2.3], [3.5, -2.3]].forEach(([x, z]) => { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.35), M("#3a3a3a", { metalness: 0.5 })); l.position.set(x, 0.67, z); world.add(l); });
  const mon = new THREE.Mesh(new RoundedBoxGeometry(1.7, 1.0, 0.08, 4, 0.04), M("#1d1d24", { roughness: 0.3 })); mon.position.set(2.1, 2.25, -3.4); world.add(mon);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.56, 0.86), new THREE.MeshStandardMaterial({ color: "#2b3a8a", emissive: pal.accent, emissiveIntensity: 0.55 })); scr.position.set(2.1, 2.25, -3.355); world.add(scr);
  const neon = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.03, 12, 64), new THREE.MeshStandardMaterial({ color: pal.accent, emissive: pal.accent, emissiveIntensity: 2 })); neon.position.set(-1.0, 4.4, -4.4); world.add(neon);
}
function buildPark(pal) {
  scene.background = canvasTex(8, 256, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#7fc4ff"); g.addColorStop(0.7, "#d7f0ff"); g.addColorStop(1, "#fff4dc"); x.fillStyle = g; x.fillRect(0, 0, w, h); });
  scene.fog = new THREE.Fog("#dff2ff", 14, 40);
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M(pal.floor, { roughness: 1 })); grass.rotation.x = -Math.PI / 2; world.add(grass);
  const path = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 40), M("#e8d3b0", { roughness: 1 })); path.rotation.x = -Math.PI / 2; path.position.set(0.3, 0.01, -6); world.add(path);
  for (let i = 0; i < 9; i++) {
    const tr = new THREE.Group(); const x = (i % 2 ? 1 : -1) * (3 + (i % 3) * 1.6), z = -2 - i * 2.2;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, 1.6, 12), M("#8a5a3c")); trunk.position.y = 0.8; tr.add(trunk);
    [0, 1, 2].forEach((k) => { const c = new THREE.Mesh(new THREE.SphereGeometry(0.9 - k * 0.15, 24, 24), M(["#4caf50", "#5fbf5f", "#3d9a48"][k], { roughness: 0.8 })); c.position.set((k - 1) * 0.35, 2.0 + k * 0.45, 0); tr.add(c); });
    tr.position.set(x, 0, z); world.add(tr);
  }
  const bench = new THREE.Mesh(new RoundedBoxGeometry(2, 0.12, 0.6, 2, 0.04), M("#b0703f")); bench.position.set(2.6, 0.75, -1.8); world.add(bench);
  [-0.8, 0.8].forEach((dx) => { const l = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.75, 0.5), M("#444")); l.position.set(2.6 + dx, 0.37, -1.8); world.add(l); });
  for (let i = 0; i < 6; i++) { const f = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), M(["#ff7aa8", "#ffd34d", "#ffffff"][i % 3])); f.position.set(-1.6 + i * 0.25, 0.1, 1.4 + (i % 2) * 0.2); world.add(f); }
}

/* ----------------------------------------------------- original character */
// "Noa" — LikeLink's own character: big head, glossy eyes with lids, brows that act,
// a bob haircut that sways, a hoodie in the product's world colour.
const ch = new THREE.Group(); scene.add(ch);
const parts = {};
function buildCharacter(look) {
  const skin = P(look.skin, { roughness: 0.55, sheen: 0.5, sheenColor: new THREE.Color("#ffb3a0"), clearcoat: 0.08 });
  const hairM = P(look.hair, { roughness: 0.38, clearcoat: 0.3 });
  const top = M(look.outfit, { roughness: 0.8 });
  const torso = new THREE.Mesh(new THREE.LatheGeometry([0, 0.05, 0.3, 0.6, 0.85, 1.0].map((y, i) => new THREE.Vector2([0.001, 0.36, 0.44, 0.42, 0.33, 0.12][i], y)), 40), top);
  torso.position.y = 0.55; ch.add(torso);
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.06, 12, 32), M(new THREE.Color(look.outfit).offsetHSL(0, 0, -0.08).getStyle())); collar.rotation.x = Math.PI / 2; collar.position.y = 1.52; ch.add(collar);
  const pocket = new THREE.Mesh(new RoundedBoxGeometry(0.42, 0.18, 0.06, 2, 0.03), M(new THREE.Color(look.outfit).offsetHSL(0, 0, -0.06).getStyle())); pocket.position.set(0, 0.85, 0.38); ch.add(pocket);
  const legM = M(look.pants, { roughness: 0.85 });
  parts.legs = [-0.17, 0.17].map((x) => { const g = new THREE.Group(); const l = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.38, 6, 16), legM); l.position.y = -0.22; g.add(l); const shoe = new THREE.Mesh(new RoundedBoxGeometry(0.24, 0.13, 0.38, 3, 0.06), M("#ffffff", { roughness: 0.4 })); shoe.position.set(0, -0.5, 0.06); g.add(shoe); g.position.set(x, 0.58, 0); ch.add(g); return g; });
  parts.arms = [-1, 1].map((s) => {
    const sh = new THREE.Group(); sh.position.set(s * 0.43, 1.38, 0);
    const up = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.28, 6, 16), top); up.position.y = -0.2; sh.add(up);
    const el = new THREE.Group(); el.position.y = -0.42; sh.add(el);
    const lo = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.24, 6, 16), top); lo.position.y = -0.16; el.add(lo);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 20), skin); hand.position.y = -0.37; hand.scale.set(1, 1.1, 0.8); el.add(hand);
    const thumb = new THREE.Mesh(new THREE.CapsuleGeometry(0.035, 0.06, 4, 8), skin); thumb.position.set(-s * 0.08, -0.33, 0.05); thumb.rotation.z = s * 0.8; el.add(thumb);
    ch.add(sh); return { sh, el };
  });
  const head = new THREE.Group(); head.position.y = 2.08; ch.add(head); parts.head = head;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.25, 16), skin); neck.position.y = 1.6; ch.add(neck);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.6, 64, 64), skin); skull.scale.set(1, 0.96, 0.9); head.add(skull);
  [-1, 1].forEach((s) => { const ear = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), skin); ear.scale.set(0.5, 1, 0.7); ear.position.set(s * 0.6, -0.02, 0); head.add(ear); });
  // hair: cap + bob sides + back volume + fringe swoop (sways)
  const hair = new THREE.Group(); head.add(hair); parts.hair = hair;
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.65, 48, 48, 0, Math.PI * 2, 0, Math.PI * 0.52), hairM); cap.rotation.x = -0.32; cap.position.set(0, 0.06, -0.03); hair.add(cap);
  const backV = new THREE.Mesh(new THREE.SphereGeometry(0.62, 40, 40), hairM); backV.scale.set(1.05, 1.0, 0.8); backV.position.set(0, -0.08, -0.2); hair.add(backV);
  parts.bob = [-1, 1].map((s) => { const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.55, 8, 20), hairM); b.position.set(s * 0.56, -0.3, 0.02); b.rotation.z = s * 0.18; hair.add(b); return b; });
  const fr = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.13, 16, 40, Math.PI * 0.8), hairM); fr.position.set(0.02, 0.2, 0.36); fr.rotation.set(0.25, 0, Math.PI * 0.12); hair.add(fr);
  if (look.bun) { const bun = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 24), hairM); bun.position.set(0, 0.62, -0.2); hair.add(bun); }
  // eyes: sclera, painted iris, pupil, two highlights, eyelids (blink)
  const irisTex = canvasTex(128, 128, (x, w) => { const g = x.createRadialGradient(w / 2, w / 2, 4, w / 2, w / 2, w / 2); g.addColorStop(0, "#1a0f08"); g.addColorStop(0.32, "#1a0f08"); g.addColorStop(0.36, look.eye); g.addColorStop(0.85, new THREE.Color(look.eye).offsetHSL(0, 0.1, -0.15).getStyle()); g.addColorStop(1, "#2a1a10"); x.fillStyle = g; x.fillRect(0, 0, w, w); });
  parts.eyes = [-0.21, 0.21].map((x) => {
    const g = new THREE.Group(); g.position.set(x, 0.03, 0.47);
    const sc = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 32), P("#ffffff", { roughness: 0.08, clearcoat: 1 })); sc.scale.set(1, 1.12, 0.6); g.add(sc);
    const ir = new THREE.Mesh(new THREE.CircleGeometry(0.1, 40), new THREE.MeshPhysicalMaterial({ map: irisTex, roughness: 0.1, clearcoat: 1 })); ir.position.z = 0.092; g.add(ir);
    [[0.035, 0.045, 0.026], [-0.03, -0.03, 0.012]].forEach(([hx, hy, r]) => { const h = new THREE.Mesh(new THREE.CircleGeometry(r, 16), new THREE.MeshBasicMaterial({ color: "#ffffff" })); h.position.set(hx, hy, 0.094); g.add(h); });
    const lid = new THREE.Mesh(new THREE.SphereGeometry(0.158, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), skin); lid.scale.set(1.02, 1.15, 0.66); g.add(lid); g.userData.lid = lid;
    const lash = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.012, 6, 24, Math.PI), M("#1d120c")); lash.scale.set(1, 1.1, 1); lash.position.z = 0.02; g.add(lash); g.userData.lash = lash;
    head.add(g); return g;
  });
  parts.brows = [-1, 1].map((s) => { const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.025, 0.14, 4, 8), hairM); b.rotation.z = Math.PI / 2; b.position.set(s * 0.21, 0.25, 0.5); head.add(b); return b; });
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 16), skin); nose.position.set(0, -0.08, 0.55); head.add(nose);
  const cheek = new THREE.MeshStandardMaterial({ color: "#ff8a8a", transparent: true, opacity: 0.4 });
  [-0.34, 0.34].forEach((x) => { const c = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), cheek); c.scale.set(1, 0.6, 0.25); c.position.set(x, -0.15, 0.47); head.add(c); });
  // mouth: smile arc, frown arc, open "o"
  const lip = M("#8a2f35", { roughness: 0.4 });
  parts.smile = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.02, 8, 24, Math.PI), lip); parts.smile.rotation.z = Math.PI; parts.smile.position.set(0, -0.2, 0.53); head.add(parts.smile);
  parts.frown = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.018, 8, 24, Math.PI), lip); parts.frown.position.set(0, -0.26, 0.53); head.add(parts.frown);
  parts.oh = new THREE.Mesh(new THREE.SphereGeometry(0.06, 20, 20), M("#5a1a20")); parts.oh.scale.set(0.9, 1.1, 0.4); parts.oh.position.set(0, -0.23, 0.52); head.add(parts.oh);
  shadowAll(ch);
}

/* ------------------------------------------------- product: real photo only */
const product = new THREE.Group(); scene.add(product);
const box = new THREE.Group(); scene.add(box);
const sparks = [];
let lid = null, glow = null;
function buildProduct(tex, accent) {
  const card = new THREE.Mesh(new RoundedBoxGeometry(1.5, 1.5, 0.08, 4, 0.07), P("#ffffff", { roughness: 0.25, clearcoat: 1 })); product.add(card);
  const photo = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 1.36), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false })); photo.position.z = 0.045; product.add(photo);
  glow = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.03, 12, 80), new THREE.MeshStandardMaterial({ color: accent, emissive: accent, emissiveIntensity: 2.2, transparent: true })); glow.position.z = -0.08; product.add(glow);
  shadowAll(product);
  const boxM = P(accent, { roughness: 0.35, clearcoat: 0.6 });
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.1, 0.8, 1.1, 4, 0.05), boxM); body.position.y = 0.4; box.add(body);
  const rib = M("#ffffff", { roughness: 0.3 });
  [[0.16, 0.82, 1.12], [1.12, 0.82, 0.16]].forEach(([w, h, d]) => { const r = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), rib); r.position.y = 0.4; box.add(r); });
  lid = new THREE.Group(); lid.position.y = 0.82; box.add(lid);
  const lt = new THREE.Mesh(new RoundedBoxGeometry(1.2, 0.2, 1.2, 4, 0.05), boxM); lid.add(lt);
  const bow = [-1, 1].map((s) => { const b = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.06, 12, 24), rib); b.position.set(s * 0.14, 0.2, 0); b.rotation.set(0, s * 0.5, s * 0.6); lid.add(b); return b; });
  void bow;
  shadowAll(box);
  for (let i = 0; i < 48; i++) {
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.045 + (i % 3) * 0.015), new THREE.MeshBasicMaterial({ color: ["#fff3b0", "#ffffff", accent][i % 3], transparent: true }));
    s.userData = { a: (i / 48) * Math.PI * 2, r: 0.6 + (i % 5) * 0.25, v: 1.2 + (i % 4) * 0.5 }; scene.add(s); sparks.push(s);
  }
}

/* -------------------------------------------------------------- 2D overlay */
function wrap(text, font, maxW, maxLines = 3) {
  ctx.font = font; const words = noEmoji(text).split(/\s+/).filter(Boolean); const lines = []; let line = "";
  for (const w of words) { const t = line ? `${line} ${w}` : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines.slice(0, maxLines);
}
function outlined(lines, y, size, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = `900 ${size}px ${UI}`; ctx.textAlign = "center"; ctx.direction = "rtl";
  ctx.lineJoin = "round"; ctx.lineWidth = Math.round(size * 0.2); ctx.strokeStyle = "rgba(0,0,0,.9)"; ctx.fillStyle = "#fff";

}
function pill(text, x, y, { font = `700 22px ${UI}`, bg = "rgba(10,8,14,.6)", fg = "#fff", h = 42, padX = 16, alpha = 1, scale = 1 } = {}) {

  ctx.translate(x, y); ctx.scale(scale, scale); ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "rtl"; ctx.fillText(text, 0, 2); ctx.restore();
}

/* ------------------------------------------------------------------ load */
let C = null;
window.loadConcept = async (concept, dataUrl) => {
  C = concept;
  const S = concept.scene3d;
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  // square, centred crop of the real photo (no redrawing)
  const tex = canvasTex(1024, 1024, (x, w, h) => { const s = Math.max(w / img.width, h / img.height); const dw = img.width * s, dh = img.height * s; x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh); });
  const pal = PALETTES[S.world] || PALETTES.room;
  ({ room: buildRoom, desk: buildDesk, park: buildPark })[S.world in PALETTES ? S.world : "room"](pal);
  buildCharacter(S.look);
  buildProduct(tex, pal.accent);
  await document.fonts.ready;
  return true;
};

/* ---------------------------------------------------------------- animate */
function face(mood, t) {
  const happy = mood === "happy", sad = mood === "sad", wow = mood === "wow";
  parts.smile.visible = happy; parts.frown.visible = sad; parts.oh.visible = wow || mood === "think";
  parts.oh.scale.set(0.9, wow ? 1.3 : 0.6, 0.4);
  parts.brows.forEach((b, i) => { const s = i ? 1 : -1; b.position.y = 0.25 + (wow ? 0.07 : happy ? 0.03 : 0); b.rotation.z = Math.PI / 2 + (sad ? s * 0.35 : happy ? -s * 0.12 : mood === "think" ? (i ? 0.3 : -0.1) : 0); });
  const blink = (t % 2.9) > 2.76 || (wow && t % 1 > 0.95) ? 0.05 : 1;
  parts.eyes.forEach((e) => { e.userData.lid.scale.y = blink < 1 ? 1.15 : 0.0001; e.userData.lid.rotation.x = blink < 1 ? 0 : -1.2; e.userData.lash.visible = blink >= 1; });
}
window.renderAt = (ms) => {
  const t = ms / 1000, T = C.durationMs / 1000;
  const b = (a, c) => win(t, a, c);
  const mood = t < 3.2 ? "think" : t < 6.2 ? "sad" : t < 7.4 ? "wow" : "happy";
  face(mood, t);
  // character body language
  const bounce = Math.abs(Math.sin(t * (mood === "happy" ? 5 : 2.4))) * (mood === "happy" ? 0.12 : 0.04);
  const jump = mood === "wow" ? Math.sin(b(6.2, 7.0) * Math.PI) * 0.45 : 0;
  ch.position.set(-0.55, bounce + jump, 0.35);
  ch.rotation.y = t < 6.2 ? 0.25 + Math.sin(t * 0.8) * 0.12 : lerp(0.25, 0.55, ease(b(6.2, 7)));
  const sq = 1 - bounce * 0.5; ch.scale.set(1 + bounce * 0.3, sq, 1 + bounce * 0.3);
  parts.head.rotation.z = mood === "think" ? 0.18 + Math.sin(t * 2) * 0.05 : mood === "sad" ? -0.1 : Math.sin(t * 3) * 0.06;
  parts.head.rotation.x = mood === "sad" ? 0.18 : -0.05;
  parts.hair.rotation.z = Math.sin(t * 4.2) * 0.03 + (mood === "wow" ? Math.sin(t * 14) * 0.04 : 0);
  parts.bob.forEach((h, i) => { h.rotation.x = Math.sin(t * 3.4 + i) * 0.08; });
  const [L, R] = parts.arms;
  // think: hand to chin; sad: arms down; wow: both up; happy: point to product; CTA: wave
  const cta = t >= 12.8;
  L.sh.rotation.set(mood === "think" ? -1.2 : mood === "wow" ? -2.6 : -0.15, 0, mood === "think" ? -0.35 : mood === "wow" ? -0.5 : -0.12);
  L.el.rotation.x = mood === "think" ? -1.6 : 0;
  R.sh.rotation.set(cta ? -2.7 : mood === "wow" ? -2.6 : mood === "happy" ? -1.3 : -0.1, 0, cta ? 0.5 + Math.sin(t * 9) * 0.35 : mood === "happy" ? 0.9 : 0.12);
  R.el.rotation.x = cta ? -0.3 : 0;
  parts.legs.forEach((l, i) => { l.rotation.x = Math.sin(t * 5 + i * Math.PI) * bounce * 1.6; });
  // gift box drop (6.2) → lid pops (7.0) → photo rises (7.2 → 9.4) → hero (9.4)
  const drop = easeOut(b(6.2, 6.9)); box.visible = t >= 6.0 && t < 12.8;
  box.position.set(0.9, lerp(5, 0, drop) + (drop >= 1 ? Math.sin(b(6.9, 7.2) * Math.PI) * 0.12 : 0), 0.9); box.rotation.y = -0.5;
  const pop = b(7.0, 7.5); lid.position.set(lerp(0, 0.9, ease(pop)), 0.82 + Math.sin(pop * Math.PI) * 0.9 + pop * 0.2, lerp(0, -0.4, pop)); lid.rotation.set(-pop * 1.4, 0, pop * 0.8);
  const rise = easeOut(b(7.2, 8.6)); const hero = ease(b(9.4, 10.3)); const ctaK = ease(b(12.8, 13.6));
  product.visible = t >= 7.15;
  product.position.set(lerp(lerp(0.9, 0.95, rise), 0.25, hero), lerp(lerp(0.6, 2.2, rise), 2.25, hero) + Math.sin(t * 2.2) * 0.04 + lerp(0, 0.25, ctaK), lerp(lerp(0.9, 1.0, rise), 1.75, hero) - ctaK * 0.5);
  product.rotation.set(0, lerp(lerp(Math.PI * 2.5, -0.35, rise), -0.08, hero) + Math.sin(t * 1.4) * 0.05, 0);
  const ps = lerp(lerp(0.2, 1, rise), 1.18, hero); product.scale.setScalar(ps);
  glow.material.opacity = 0.5 + Math.sin(t * 6) * 0.3; glow.rotation.z = t;
  sparks.forEach((s) => { const k = b(7.1, 9.5); s.visible = k > 0 && k < 1; const u = s.userData; const r = u.r * easeOut(k) * 1.6; s.position.set(0.9 + Math.cos(u.a) * r, 1.0 + u.v * easeOut(k) * 1.4 - k * k * 0.8, 0.9 + Math.sin(u.a) * r * 0.6); s.rotation.set(t * 4, t * 3, 0); s.material.opacity = 1 - k; });
  // camera: establishing → close-up → orbit on reveal → hero → pull back
  const shots = [
    [0.0, [0.6, 2.4, 8.6], [0, 1.6, 0]],
    [3.0, [-0.2, 2.35, 4.4], [-0.5, 2.0, 0.3]],
    [6.0, [1.6, 2.2, 6.4], [0.5, 1.4, 0.6]],
    [9.2, [0.3, 2.35, 5.0], [0.2, 2.15, 1.2]],
    [12.6, [0.4, 2.3, 7.4], [0.0, 1.8, 0.6]],
  ];
  let i = 0; while (i < shots.length - 1 && t >= shots[i + 1][0]) i++;
  const [t0, p0, l0] = shots[i], nxt = shots[Math.min(i + 1, shots.length - 1)];
  const k = i < shots.length - 1 ? ease(win(t, nxt[0] - 0.9, nxt[0])) : 0;
  const drift = (t - t0) * 0.06;
  cam.position.set(lerp(p0[0], nxt[1][0], k) + Math.sin(t * 0.5) * 0.08, lerp(p0[1], nxt[1][1], k), lerp(p0[2], nxt[1][2], k) - drift);
  cam.lookAt(lerp(l0[0], nxt[2][0], k), lerp(l0[1], nxt[2][1], k), lerp(l0[2], nxt[2][2], k));
  gl.render(scene, cam);

  // 2D composite: captions, labels, disclosure
  ctx.clearRect(0, 0, W, H); ctx.drawImage(gl.domElement, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "rgba(0,0,0,.42)"); g.addColorStop(0.3, "rgba(0,0,0,0)"); g.addColorStop(0.82, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.5)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const S = C.scene3d, fade = (a, c) => ease(win(t, a, a + 0.3)) * (1 - ease(win(t, c - 0.3, c)));
  const cap = (txt, a, c, size = 60) => { const al = fade(a, c); if (al > 0 && txt) outlined(wrap(txt, `900 ${size}px ${UI}`, 640, 3), 230, size, al); };
  cap(S.captions.hook, 0.1, 3.2);
  cap(S.captions.problem, 3.3, 6.2);
  cap(S.captions.reveal, 6.4, 9.4);
  const ha = fade(9.5, 12.8); if (ha > 0) outlined([...wrap(S.captions.title, `900 50px ${UI}`, 640, 2), S.captions.price].filter(Boolean), 200, 50, ha);
  const ca = ease(win(t, 12.9, 13.3));
  if (ca > 0) { outlined(S.captions.cta, 200, 62, ca); pill(`תגיבו: ${S.captions.keyword}`, W / 2, 1090, { bg: (PALETTES[S.world] || PALETTES.room).accent, font: `900 36px ${UI}`, h: 74, padX: 30, alpha: ca, scale: back(win(t, 13, 13.5)) }); }
  pill(S.label, W / 2, 104, { font: `700 21px ${UI}` });
  ctx.save(); ctx.font = `900 30px ${UI}`; ctx.textAlign = "center"; ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.fillText("LikeLink2", W / 2, 1180); ctx.restore();
  pill(C.disclosure, W / 2, 1232, { font: `600 19px ${UI}`, h: 36, bg: "rgba(0,0,0,.55)" });
  void T;
  return out.toDataURL("image/jpeg", 0.9);
};
window.ready = true;
</script>
