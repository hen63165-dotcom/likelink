<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  /* Talking-object tip reel (series F). 720x1280, rendered frame by frame:
     window.renderAt(t) draws the exact state at time t (deterministic). */
  html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #120d1f; font-family: "Heebo", sans-serif; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(28px) saturate(1.2) brightness(.75); }
  #char { position: absolute; inset: 0; background-size: cover; background-position: center top; transform-origin: 50% 70%; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #tag { position: absolute; top: 34px; left: 28px; padding: 9px 18px; border-radius: 14px; background: #6d3df2; color: #fff; font-weight: 800; font-size: 26px; box-shadow: 0 6px 18px rgba(0,0,0,.35); direction: rtl; }
  #box { position: absolute; left: 36px; right: 36px; bottom: 150px; padding: 22px 26px; border-radius: 26px; background: rgba(18,13,31,.82); border: 4px solid #ffd23f; color: #fff; text-align: center; font-weight: 900; font-size: 50px; line-height: 1.18; box-shadow: 0 14px 40px rgba(0,0,0,.45); transform-origin: 50% 100%; }
  #box .hl { color: #ffd23f; }
  #ai { position: absolute; bottom: 92px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.82); font-size: 22px; font-weight: 400; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .bubble { position: absolute; padding: 14px 22px; border-radius: 26px 26px 26px 6px; background: #fff; color: #111; font-weight: 800; font-size: 34px; box-shadow: 0 8px 20px rgba(0,0,0,.35); white-space: nowrap; transform-origin: 50% 100%; }
  .bubble.g { background: #dcf8c6; border-radius: 26px 26px 6px 26px; }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: radial-gradient(120% 90% at 50% 0%, #8b5cf6 0%, #3b1d8f 55%, #170c3a 100%); color: #fff; text-align: center; }
  #end .face { width: 330px; height: 330px; border-radius: 50%; background-size: cover; background-position: center 18%; border: 8px solid #ffd23f; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  #end .title { font-weight: 900; font-size: 92px; line-height: 1; }
  #end .sub { font-weight: 800; font-size: 46px; color: #ffd23f; }
  #end .url { font-weight: 400; font-size: 30px; opacity: .9; direction: ltr; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="char"></div>
  <div id="shade"></div>
  <div id="bubbles"></div>
  <div id="tag"></div>
  <div id="box"></div>
  <div id="ai"></div>
  <div id="end" style="display:none"><div class="face"></div><div class="title"></div><div class="sub"></div><div class="url"></div></div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  let S = null;
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const pop = (x) => { x = Math.min(1, Math.max(0, x)); const c = 1.70158 + 1; return 1 + c * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2); };

  window.load = (spec, assets) => {
    S = spec;
    document.fonts.add(new FontFace("Heebo", `url(${assets.font400})`, { weight: "400" }));
    document.fonts.add(new FontFace("Heebo", `url(${assets.font800})`, { weight: "800" }));
    document.fonts.add(new FontFace("Heebo", `url(${assets.font900})`, { weight: "900" }));
    $("#bg").style.backgroundImage = `url(${assets.character})`;
    $("#char").style.backgroundImage = `url(${assets.character})`;
    $("#end .face").style.backgroundImage = `url(${assets.endImage})`;
    $("#tag").textContent = spec.tag;
    $("#ai").textContent = spec.aiLabel;
    $("#end .title").textContent = spec.end.title;
    $("#end .sub").textContent = spec.end.sub;
    $("#end .url").textContent = spec.end.url;
    // Timeline: hook, then each line, then the end card.
    let t = 0;
    S.cues = [{ text: spec.hook, from: 0, to: spec.hookDur, hook: true }];
    t = spec.hookDur;
    for (const l of spec.lines) { S.cues.push({ text: l.text, from: t, to: t + l.dur }); t += l.dur; }
    S.endFrom = t; S.total = t + spec.end.dur;
    // Bubbles: fixed pseudo-random positions so every render is identical.
    const host = $("#bubbles"); host.innerHTML = "";
    const b = spec.bubbles || { items: [] };
    S.bub = b.items.map((text, i) => {
      const el = document.createElement("div");
      el.className = "bubble" + (i % 3 === 1 ? " g" : "");
      el.textContent = text;
      const col = i % 2, row = Math.floor(i / 2);
      el.style.top = `${150 + row * 118 + (col ? 46 : 0)}px`;
      el.style[col ? "left" : "right"] = `${30 + ((i * 37) % 70)}px`;
      host.appendChild(el);
      return { el, at: b.from + i * b.every, until: b.to };
    });
    return document.fonts.ready.then(() => S.total);
  };

  window.renderAt = (t) => {
    const ending = t >= S.endFrom;
    $("#end").style.display = ending ? "flex" : "none";
    if (ending) {
      const k = ease((t - S.endFrom) / 0.45);
      $("#end").style.opacity = String(k);
      $("#end .face").style.transform = `scale(${0.6 + 0.4 * pop((t - S.endFrom) / 0.6)})`;
      $("#end .title").style.transform = `translateY(${(1 - k) * 40}px)`;
      return;
    }
    const cue = S.cues.find((c) => t >= c.from && t < c.to) || S.cues[S.cues.length - 1];
    const local = t - cue.from;
    // Character: slow push-in, breathing, and a "talking" bounce while a line plays.
    const talk = cue.hook ? 0 : Math.abs(Math.sin(local * Math.PI * 4.2)) * 0.012;
    const sc = 1.06 + t * 0.006 + Math.sin(t * 1.7) * 0.008 + talk;
    const rot = Math.sin(t * 2.3) * 0.6 + (cue.hook ? Math.sin(t * 9) * 1.2 * Math.max(0, 1 - t / 1.2) : 0);
    $("#char").style.transform = `scale(${sc}) rotate(${rot}deg)`;
    // Bottom box: pops in on every new line; key words in yellow via *word*.
    const box = $("#box");
    const lines = cue.text.map((s) => s.replace(/\*(.+?)\*/g, '<span class="hl">$1</span>')).join("<br>");
    if (box.dataset.k !== String(cue.from)) { box.innerHTML = lines; box.dataset.k = String(cue.from); }
    box.style.fontSize = cue.hook ? "56px" : "48px";
    box.style.transform = `scale(${pop(local / 0.35)})`;
    // Bubbles pop in one after another, then fly off together.
    for (const b of S.bub) {
      const shown = t >= b.at && t < b.until + 0.4;
      b.el.style.display = shown ? "block" : "none";
      if (!shown) continue;
      const out = t > b.until ? ease((t - b.until) / 0.4) : 0;
      b.el.style.transform = `scale(${pop((t - b.at) / 0.3) * (1 - out)}) translateY(${-out * 80}px)`;
    }
  };
</script>
</body>
</html>
