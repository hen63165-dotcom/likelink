<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>LikeLink2 studio promo</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<script>
// LikeLink2 self-promo reel ("open a studio"): 3 ORIGINAL AI character scenes
// (LikeLink's own image model, labelled AI) + REAL screenshots of the live site
// (labelled as such) + Hebrew captions. Every line describes something the
// site really does today; no income promise, no testimonial, no numbers.
const W = 720, H = 1280, cv = document.getElementById("c"), ctx = cv.getContext("2d");
const UI = "'Noto Sans Hebrew','Noto Sans','DejaVu Sans',Arial,sans-serif";
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const back = (t) => { t = clamp(t); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const win = (t, a, b) => clamp((t - a) / (b - a));
let IMG = {};
window.loadAssets = async (map) => {
  const entries = await Promise.all(Object.entries(map).map(([k, src]) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res([k, i]); i.onerror = rej; i.src = src; })));
  IMG = Object.fromEntries(entries);
  await document.fonts.ready;
  return Object.keys(IMG).length;
};
function cover(img, x, y, w, h, z = 1, fx = 0.5, fy = 0.5) {
  const s = Math.max(w / img.width, h / img.height) * z, dw = img.width * s, dh = img.height * s;
  ctx.drawImage(img, x + (w - dw) * fx, y + (h - dh) * fy, dw, dh);
}
function wrap(text, font, maxW, max = 3) {
  ctx.font = font; const words = String(text).split(/\s+/); const out = []; let line = "";
  for (const w of words) { const t = line ? `${line} ${w}` : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); return out.slice(0, max);
}
function outlined(lines, y, size, alpha = 1, color = "#fff") {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = `900 ${size}px ${UI}`; ctx.textAlign = "center"; ctx.direction = "rtl";
  ctx.lineJoin = "round"; ctx.lineWidth = Math.round(size * 0.2); ctx.strokeStyle = "rgba(0,0,0,.9)"; ctx.fillStyle = color;
  lines.forEach((l, i) => { const yy = y + i * size * 1.22; ctx.strokeText(l, W / 2, yy); ctx.fillText(l, W / 2, yy); }); ctx.restore();
}
function pill(text, x, y, { font = `700 22px ${UI}`, bg = "rgba(10,8,14,.62)", fg = "#fff", h = 42, padX = 16, alpha = 1, scale = 1 } = {}) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = font; const w = ctx.measureText(text).width + padX * 2;
  ctx.translate(x, y); ctx.scale(scale, scale); ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "rtl"; ctx.fillText(text, 0, 2); ctx.restore();
}
function phone(img, t, a) {
  // the real screenshot inside a phone frame, gently scrolling
  const pw = 430, ph = 820, px = (W - pw) / 2, py = 375 + (1 - back(win(t, a, a + 0.5))) * 120;
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 40; ctx.fillStyle = "#111"; ctx.beginPath(); ctx.roundRect(px - 14, py - 14, pw + 28, ph + 28, 48); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 36); ctx.clip();
  const s = pw / img.width, dh = img.height * s, scroll = Math.max(0, dh - ph) * ease(win(t, a + 0.6, a + 3));
  ctx.fillStyle = "#fff"; ctx.fillRect(px, py, pw, ph); ctx.drawImage(img, px, py - scroll, pw, dh); ctx.restore();
}
function grad(top = 0.5, bottom = 0.55) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `rgba(0,0,0,${top})`); g.addColorStop(0.35, "rgba(0,0,0,0)"); g.addColorStop(0.8, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${bottom})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// The plan (render-promo.mjs) is a list of 3 s segments: { kind: "ai"|"site", img, cap },
// followed by the call-to-action card. Every caption states what the site does today.
const SEG = 3;
window.renderFrame = (ms, q = 0.9) => {
  const t = ms / 1000, P = window.PLAN; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const i = Math.floor(t / SEG), local = t - i * SEG, seg = P.segments[i];
  const fade = (a, b) => ease(win(local, a, a + 0.3)) * (1 - ease(win(local, b - 0.3, b)));
  ctx.fillStyle = "#14101f"; ctx.fillRect(0, 0, W, H);
  if (seg && seg.kind === "ai") {
    cover(IMG[seg.img], 0, 0, W, H, i % 2 ? 1.12 - 0.06 * ease(local / SEG) : 1.05 + 0.06 * ease(local / SEG));
    grad();
    if (seg.section) pill(seg.section, W / 2, 1110, { font: `800 26px ${UI}`, bg: seg.sectionColor || "#d22f5d", h: 52, padX: 22, alpha: fade(0.1, SEG) });
    outlined(wrap(seg.cap, `900 56px ${UI}`, 640, 3), 210, 56, fade(0.1, SEG));
    pill("דמות מקורית שנוצרה ב-AI", W / 2, 96);
    ctx.save(); ctx.font = `900 30px ${UI}`; ctx.textAlign = "center"; ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.fillText("LikeLink2", W / 2, 1210); ctx.restore();
  } else if (seg) {
    const bg = ctx.createLinearGradient(0, 0, W, H); bg.addColorStop(0, seg.bg0 || "#ffd6e7"); bg.addColorStop(1, seg.bg1 || "#b9a7ff"); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    phone(IMG[seg.img], local, 0);
    outlined(wrap(seg.cap, `900 42px ${UI}`, 640, 3), 168, 42, fade(0.1, SEG));
    pill("צילום מסך אמיתי מהאתר", W / 2, 96, { bg: "rgba(43,22,80,.8)" });
  } else {
    const k = t - P.segments.length * SEG;
    const bg = ctx.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#2b1650"); bg.addColorStop(1, "#d22f5d"); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    outlined(["LikeLink2"], 330, 96, ease(win(k, 0, 0.4)));
    P.cta.forEach((line, j) => outlined(wrap(line, `900 48px ${UI}`, 640, 2), 500 + j * 120, 48, ease(win(k, 0.3 + j * 0.3, 0.7 + j * 0.3))));
    pill(P.url, W / 2, 860, { font: `800 30px ${UI}`, bg: "#fff", fg: "#2b1650", h: 66, padX: 28, alpha: ease(win(k, 1, 1.4)), scale: back(win(k, 1, 1.5)) });
    pill("הקישור בביו", W / 2, 960, { font: `800 28px ${UI}`, bg: "rgba(255,255,255,.18)", h: 58, alpha: ease(win(k, 1.4, 1.8)) });
  }
  return cv.toDataURL("image/jpeg", q);
};
window.durationS = () => window.PLAN.segments.length * SEG + 4;
</script>
</body>
</html>
