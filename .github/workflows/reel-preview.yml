# Review helper: pulls published reels through the public media proxy and commits
# a few frames back to the working branch (the dev sandbox cannot reach storage).
name: Reel preview frames
on:
  push:
    branches: ["claude/likelink2-design-execution-f0ga6q"]
    paths: ["scripts/media/preview-list.txt"]
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Extract frames
        run: |
          mkdir -p scripts/media/preview
          while read -r p; do
            [ -z "$p" ] && continue
            n=$(basename "$p" .mp4)
            curl -sSf -o "/tmp/$n.mp4" "https://likelink2.vercel.app/api/og?mode=media&path=$p"
            for s in 2 4.5 6.5 9 10.5 13 15; do ffmpeg -loglevel error -y -ss $s -i "/tmp/$n.mp4" -frames:v 1 -vf scale=360:-1 "scripts/media/preview/$n-$s.jpg"; done
          done < scripts/media/preview-list.txt
      - name: Commit frames
        run: |
          git config user.name "likelink-bot"; git config user.email "likelink-bot@users.noreply.github.com"
          git add scripts/media/preview
          git commit -m "Reel preview frames" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
