# Page read: opens a public Notion page the owner sent (this session's container cannot reach
# notion.site; a runner can) in the runner's own Chrome, and stores its visible text and a
# screenshot on the "page-reads" pre-release for review. Public notion.site pages only, with no
# query string (a shared link's tracking token is never sent or stored). Nothing is installed or posted.
name: Page read
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/marketing/pages/read.json
      - .github/workflows/page-read.yml
permissions:
  contents: write
concurrency:
  group: page-read-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Open each page in Chrome
        run: |
          set -euo pipefail
          mkdir -p page-out
          node -e 'for (const p of JSON.parse(require("fs").readFileSync("scripts/marketing/pages/read.json","utf8"))) console.log(p.name + " " + p.url)' > /tmp/list.txt
          while read -r name url; do
            [[ "$name" =~ ^[a-z0-9-]+$ ]] || { echo "bad name: $name"; exit 1; }
            [[ "$url" =~ ^https://[a-z0-9-]+\.notion\.site/[A-Za-z0-9-]+$ ]] || { echo "not a public notion.site page without a query: $name"; exit 1; }
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=25000 --window-size=1100,1400 --dump-dom "$url" > "page-out/$name.html" 2>/dev/null || true
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=25000 --hide-scrollbars --window-size=1100,6000 --screenshot="page-out/$name.png" "$url" 2>/dev/null || true
            python3 - "page-out/$name.html" "page-out/$name.txt" <<'PY'
          import sys, re, html
          from html.parser import HTMLParser
          class T(HTMLParser):
              def __init__(s): super().__init__(); s.out=[]; s.skip=0; s.links=[]
              def handle_starttag(s, t, a):
                  if t in ("script","style","noscript"): s.skip+=1
                  if t in ("p","div","li","h1","h2","h3","br","tr"): s.out.append("\n")
                  if t=="a":
                      h=dict(a).get("href") or ""
                      if h.startswith("http"): s.links.append(h)
              def handle_endtag(s, t):
                  if t in ("script","style","noscript") and s.skip: s.skip-=1
              def handle_data(s, d):
                  if not s.skip: s.out.append(d)
          p=T(); p.feed(open(sys.argv[1],encoding="utf-8",errors="replace").read())
          text=re.sub(r"\n\s*\n+","\n\n","".join(p.out)).strip()
          open(sys.argv[2],"w",encoding="utf-8").write(text+"\n\nLINKS:\n"+"\n".join(dict.fromkeys(p.links)))
          print(len(text), "chars,", len(set(p.links)), "links")
          PY
          done < /tmp/list.txt
          ls -la page-out
      - name: Store them on the review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view page-reads >/dev/null 2>&1 || gh release create page-reads --prerelease --title "Page reads (review)" --notes "Public pages the owner sent, read on a runner for review. Nothing here is installed or posted, and the site never reads this release."
          gh release upload page-reads page-out/*.txt page-out/*.png --clobber
