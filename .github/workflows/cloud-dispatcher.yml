name: LikeLink2 cloud dispatcher
# Production env refresh: keep this workflow as the canonical cloud trigger.

on:
  schedule:
    # Hourly (was every 15 min): the light cron is time-boxed and catches up on
    # due jobs, and every beat reads cloud state (counts toward free egress).
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Trigger due cloud jobs
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$AUTOPILOT_SECRET"
          curl --fail-with-body --silent --show-error --max-time 200             -H "Authorization: Bearer $AUTOPILOT_SECRET"             "https://likelink2.vercel.app/api/autopilot?cron=light"
