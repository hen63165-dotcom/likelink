name: LikeLink2 cloud dispatcher
# Production env refresh: keep this workflow as the canonical cloud trigger.

on:
  schedule:
    # Hourly (was every 15 min): the light cron is time-boxed and catches up on
    # due jobs, and every beat reads cloud state (counts toward free egress).
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Trigger due cloud jobs
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$AUTOPILOT_SECRET"
          # Straight to the cloud's Edge Function "api" (src/constants/cloud.js CLOUD.url),
          # not through likelink2.vercel.app: that path (Vercel route -> Netlify -> Supabase)
          # answers 504 after ~30 s while the time-boxed light cron (up to 90 s) still runs,
          # so every beat since 2026-11-01 was red although its jobs finished.
          curl --fail-with-body --silent --show-error --max-time 200 \
            -H "Authorization: Bearer $AUTOPILOT_SECRET" \
            "https://vjitiuirqfysexsxdxqx.supabase.co/functions/v1/api/autopilot?cron=light"
