# Instagram comment → private message ("comment רוצה and I'll send you the link").
# Every 15 minutes: people who asked for the link in a comment on a recent
# product post get ONE private reply with the link and the ad disclosure
# (Instagram's private-reply API: only as an answer to their own comment,
# within 7 days), plus a public "sent you a DM" reply. Nobody else is messaged.
# Without the IG_ACCESS_TOKEN / IG_USER_ID secrets it sends nothing.
name: Instagram comment bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be sent"
        default: "false"

concurrency:
  group: instagram-comment-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Answer comments that ask for the link
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/instagram/comment-bot.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
