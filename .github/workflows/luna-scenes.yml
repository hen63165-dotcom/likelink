# Luna's scenes for the story reels (scripts/luna_reels, look "story"):
# the own image model (open weights on the CPU runner, no account, no key,
# no credits) draws Luna in each scene of scripts/media/ai-image/luna-scenes.json,
# with her face kept by the IP-Adapter reference (scripts/media/talking/samples/luna-face.jpg).
# The pictures are committed to scripts/luna_reels/assets/scenes/candidates/
# for a person to choose by eye; only chosen scenes are used by episodes.
# No jewellery is drawn: the product is always the store's real photo.
name: Luna scenes
on:
  workflow_dispatch:
  push:
    branches: ["claude/likelink2-design-execution-f0ga6q"]
    paths: ["scripts/media/ai-image/luna-scenes.json", ".github/workflows/luna-scenes.yml"]
permissions:
  contents: write
concurrency:
  group: luna-scenes
  cancel-in-progress: false
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: own-image-model-scenes-v1
      - name: Install (CPU torch + diffusers)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "diffusers>=0.30" transformers accelerate peft safetensors
      - name: Draw the scenes
        run: |
          out=scripts/luna_reels/assets/scenes/candidates
          mkdir -p "$out"
          python scripts/media/ai-image/generate.py --jobs scripts/media/ai-image/luna-scenes.json --out "$out" \
            --ref scripts/media/talking/samples/luna-face.jpg --width 576 --height 1024 2>&1 | tee /tmp/scenes.log
          grep '^{' /tmp/scenes.log > "$out/log.jsonl" || true
      - name: Commit the scenes for review
        run: |
          git config user.name "likelink-bot"; git config user.email "likelink-bot@users.noreply.github.com"
          git add scripts/luna_reels/assets/scenes/candidates
          git commit -m "Luna scenes: candidates from the own image model (review by eye)" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
