name: Luna reels

# Fully autonomous premium video engine.
# Runs by itself twice a day (08:00 / 17:00 UTC) — no manual clicks required.
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      text:
        description: "Optional Hebrew ad script override"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: luna-reels
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (Edge-TTS layer)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Ensure ffmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install Edge-TTS (he-IL-AvriNeural)
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade edge-tts
          python -m edge_tts --list-voices | grep -F "he-IL-AvriNeural"

      - name: Generate reel
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LUNA_VOICE: ${{ vars.LUNA_VOICE || 'he-IL-AvriNeural' }}
          LUNA_SCRIPT: ${{ inputs.text }}
        run: node scripts/luna-reels/generate.mjs

      - name: Upload rendered reel
        uses: actions/upload-artifact@v4
        with:
          name: luna-reel-${{ github.run_number }}
          path: out/luna-reels/
          if-no-files-found: error
          retention-days: 30

      - name: Publish reel to luna-reels branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f out/luna-reels/manifest.json
          work="$(mktemp -d)"
          cp -r out/luna-reels/. "$work/"
          cd "$work"
          git init -q
          git checkout -q -b luna-reels
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new reel output."
            exit 0
          fi
          git commit -q -m "luna: reel run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin luna-reels
