# Luna reels: free Hebrew tip reels (scripts/luna_reels).
# Runs by itself every day at 08:00 and 17:00 UTC: each run renders the next
# episode in rotation (3 variants), so the release gets 6 new reels a day.
# Or one click: Actions → Luna reels → Run workflow. Results go to the
# "luna-reels" release (video, caption .txt, preview .jpg, details .json per
# variant) and to the run's artifacts. Nothing is posted anywhere: posting
# stays a person's choice (with a trending sound from the Instagram app).
# A push that changes the engine renders two episodes as a check.
name: Luna reels
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      episode:
        description: "episode id (file in scripts/luna_reels/episodes), or 'all'"
        default: "silver-925"
      variants:
        description: "1, 2 or 3 (different hooks / music)"
        default: "3"
      voice:
        description: "edge | gtts | chatterbox | none"
        default: "edge"
      visual:
        description: "auto | still | aurora | talking | pexels:SEARCH"
        default: "auto"
      tier:
        description: "free (LikeLink2 wordmark + outro) | pro (none)"
        default: "free"
  push:
    branches: ["claude/likelink2-design-execution-f0ga6q"]
    paths: ["scripts/luna_reels/**", ".github/workflows/luna-reels.yml"]
permissions:
  contents: write
concurrency:
  group: luna-reels
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EPISODE: ${{ github.event.inputs.episode || (github.event_name == 'schedule' && 'next') || 'silver-925 link-chaos' }}
      VARIANTS: ${{ github.event.inputs.variants || '3' }}
      VOICE: ${{ github.event.inputs.voice || 'edge' }}
      VISUAL: ${{ github.event.inputs.visual || 'auto' }}
      TIER: ${{ github.event.inputs.tier || 'free' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/luna_reels/requirements.txt
      - name: Install FFmpeg and the engine
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q -r scripts/luna_reels/requirements.txt
      - name: Check the inputs
        run: |
          echo "$EPISODE" | grep -Eq '^(all|next|[a-z0-9 -]{2,200})$' || { echo "episode: letters, digits, '-', 'all' or 'next'"; exit 2; }
          echo "$VARIANTS" | grep -Eq '^[1-3]$' || { echo "variants: 1, 2 or 3"; exit 2; }
          echo "$VOICE" | grep -Eq '^(edge|gtts|chatterbox|none)$' || { echo "voice: edge|gtts|chatterbox|none"; exit 2; }
          echo "$VISUAL" | grep -Eq '^(auto|still|aurora|talking|pexels:[A-Za-z0-9 ,-]{1,60})$' || { echo "visual: auto|still|aurora|talking|pexels:SEARCH"; exit 2; }
          echo "$TIER" | grep -Eq '^(free|pro)$' || { echo "tier: free|pro"; exit 2; }
      - name: Tests (no render without them)
        working-directory: scripts/luna_reels
        run: |
          python -m unittest discover -s tests -v
          python -m luna_reels check episodes/
      - name: Talking Luna needs SadTalker (only when asked)
        if: env.VISUAL == 'talking'
        run: |
          pip install -q torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==1.23.4 face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 librosa==0.9.2 numba resampy==0.3.1 \
            pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml joblib==1.1.0 scikit-image==0.19.3 basicsr==1.4.2 \
            facexlib==0.3.0 gfpgan av safetensors
      - name: Chatterbox voice needs its model (only when asked)
        if: env.VOICE == 'chatterbox'
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts dicta-onnx faster-whisper
          mkdir -p ~/.cache/dicta
          gh release download model-files-v1.0 -R thewh1teagle/dicta-onnx -p '*.onnx' -D ~/.cache/dicta --skip-existing
          f=$(ls ~/.cache/dicta/*int8*.onnx 2>/dev/null | head -1); [ -n "$f" ] || f=$(ls ~/.cache/dicta/*.onnx | head -1)
          echo "DICTA_MODEL=$f" >> "$GITHUB_ENV"
      - name: Today's matching trends
        working-directory: scripts/luna_reels
        run: python -m luna_reels trends episodes/ || true
      - name: Render
        working-directory: scripts/luna_reels
        run: |
          all=$(ls episodes/*.json | xargs -n1 basename | sed 's/\.json$//')
          if [ "$EPISODE" = "all" ]; then list="$all"
          elif [ "$EPISODE" = "next" ]; then
            # Two runs a day walk the episode list in order: day*2 + (afternoon run).
            n=$(echo "$all" | wc -l); slot=$(( $(date -u +%j | sed 's/^0*//') * 2 + ( $(date -u +%H | sed 's/^0//') >= 12 ? 1 : 0 ) ))
            list=$(echo "$all" | sed -n "$(( slot % n + 1 ))p"); echo "Scheduled run: episode $list"
          else list="$EPISODE"; fi
          [ -n "$PEXELS_API_KEY" ] || echo "::notice::No PEXELS_API_KEY secret: backgrounds are Luna / the brand backdrop (README → Pexels)."
          status=0
          for ep in $list; do
            [ -f "episodes/$ep.json" ] || { echo "::error::no episode '$ep'"; status=1; continue; }
            python -m luna_reels make "episodes/$ep.json" --variants "$VARIANTS" --voice "$VOICE" --visual "$VISUAL" --tier "$TIER" --out out || status=1
          done
          ls -la out || true
          exit $status
      - name: Publish to the luna-reels release
        if: always()
        working-directory: scripts/luna_reels
        run: |
          ls out/*.mp4 >/dev/null 2>&1 || { echo "nothing rendered"; exit 0; }
          gh release view luna-reels >/dev/null 2>&1 || gh release create luna-reels --title "Luna reels" --notes "רילסים מוכנים להורדה: וידאו, כיתוב (.txt), תצוגה מקדימה (.jpg). נוצרו ב־scripts/luna_reels. שום דבר לא פורסם אוטומטית." --prerelease
          gh release upload luna-reels out/*.mp4 out/*.txt out/*.jpg out/*.json --clobber
          echo "### Luna reels" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.mp4; do n=$(basename "$f"); echo "- [$n](https://github.com/${{ github.repository }}/releases/download/luna-reels/$n)" >> "$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-reels
          path: scripts/luna_reels/out
          if-no-files-found: ignore
