# LikeLink's 3D studio (scripts/media/studio3d), free: no account, no key, no
# credits (the owner, 2026-10-27: "@ravitrecommends' level, on our own free
# engine"). Four stages on the free runners:
#   draw     the scene pictures, FLUX.1 [schnell] (Apache-2.0), one
#            shot per runner, side by side                            flux.py
#   animate  each picture → a clip with real motion, LTX-Video 2B
#            distilled, one shot per runner, side by side             animate.py
#   reel     the story with the reel engine (scripts/luna_reels): a
#            shot's clip, else its picture with a 3D camera move by
#            its depth map; Hebrew voice, captions, the name tag, the
#            seller's real product photo, the AI and ad labels        episode.py, depth.py
#   commit   pictures and clips to scripts/media/studio3d/shots/<shot list>/,
#            the reel to the studio3d-preview pre-release, which the site
#            never reads: a person watches it before anything is posted.
#
# What a push runs is written in scripts/media/studio3d/run.json ({"jobs":
# shot list, "only": shot ids, "stage": "all" | "animate" | "reel", and
# optionally "from_run": an earlier run whose drawn pictures to use): a
# branch workflow cannot be started by hand until it is on main.
name: 3D studio
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "shot list under scripts/media/studio3d/jobs/ (file name)"
        default: "pilot-hoops.json"
      only:
        description: "only these shot ids (comma-separated), or empty for all"
        default: ""
      stage:
        description: "all = draw, animate, reel | animate = animate + reel from the committed pictures | reel = the reel only"
        default: "all"
  push:
    branches: ["claude/likelink2-design-execution-f0ga6q"]
    paths: ["scripts/media/studio3d/run.json", "scripts/media/studio3d/*.py", ".github/workflows/studio3d.yml"]
# Read-only by default: only the commit job can push (the other jobs install
# packages and download model weights, and never hold a write token).
permissions:
  contents: read
  actions: read
# A new push waits for the work in progress (hours on a CPU) instead of
# cancelling it.
concurrency:
  group: studio3d-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.p.outputs.jobs }}
      name: ${{ steps.p.outputs.name }}
      only: ${{ steps.p.outputs.only }}
      stage: ${{ steps.p.outputs.stage }}
      shots: ${{ steps.p.outputs.shots }}
      from_run: ${{ steps.p.outputs.from_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: p
        env:
          IN_JOBS: ${{ github.event.inputs.jobs }}
          IN_ONLY: ${{ github.event.inputs.only }}
          IN_STAGE: ${{ github.event.inputs.stage }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            JOBS="$IN_JOBS"; ONLY="$IN_ONLY"; STAGE="$IN_STAGE"
          else
            f=scripts/media/studio3d/run.json
            JOBS=$(python3 -c "import json; print(json.load(open('$f')).get('jobs', ''))")
            ONLY=$(python3 -c "import json; print(json.load(open('$f')).get('only', ''))")
            STAGE=$(python3 -c "import json; print(json.load(open('$f')).get('stage', 'all'))")
            FROM_RUN=$(python3 -c "import json; print(json.load(open('$f')).get('from_run', ''))")
          fi
          echo "${FROM_RUN:-}" | grep -Eq '^[0-9]{0,15}$' || { echo "from_run: a run id"; exit 2; }
          echo "$JOBS" | grep -Eq '^[a-z0-9-]{1,40}\.json$' || { echo "jobs: a file name like pilot-hoops.json"; exit 2; }
          echo "$ONLY" | grep -Eq '^([a-z0-9-]{1,30}(,[a-z0-9-]{1,30})*)?$' || { echo "only: shot ids like hero,cta"; exit 2; }
          echo "$STAGE" | grep -Eq '^(all|animate|reel)$' || { echo "stage: all, animate or reel"; exit 2; }
          test -f "scripts/media/studio3d/jobs/$JOBS"
          SHOTS=$(ONLY="$ONLY" JOBS="$JOBS" python3 -c "
          import json, os
          ids = [s['id'] for s in json.load(open('scripts/media/studio3d/jobs/' + os.environ['JOBS']))['shots']]
          only = [x for x in os.environ['ONLY'].split(',') if x]
          print(json.dumps([i for i in ids if not only or i in only]))")
          { echo "jobs=$JOBS"; echo "name=${JOBS%.json}"; echo "only=$ONLY"; echo "stage=$STAGE"; echo "shots=$SHOTS"; echo "from_run=${FROM_RUN:-}"; } >> "$GITHUB_OUTPUT"
          echo "plan: $JOBS · stage $STAGE · shots $SHOTS"
  draw:
    needs: plan
    if: needs.plan.outputs.stage == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.plan.outputs.shots) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Room for the weights (the runner's second disk)
        run: |
          sudo mkdir -p /mnt/hf && sudo chown "$USER" /mnt/hf
          df -h / /mnt | tail -2
          free -g | head -2
          nproc
      - name: Install (CPU torch + diffusers with GGUF)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "diffusers>=0.32" "gguf>=0.10" transformers accelerate sentencepiece protobuf safetensors
      - name: Draw ${{ matrix.shot }}
        env:
          HF_HOME: /mnt/hf
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          JOBS: ${{ needs.plan.outputs.jobs }}
          SHOT: ${{ matrix.shot }}
        run: |
          set -o pipefail
          out="studio3d/${JOBS%.json}"; mkdir -p "$out"
          python scripts/media/studio3d/flux.py --jobs "scripts/media/studio3d/jobs/$JOBS" --out "$out" \
            --width 576 --height 1024 --only "$SHOT" 2>&1 | tee /tmp/flux.log
          grep '^{' /tmp/flux.log > "$out/$SHOT.draw.jsonl" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio3d-pic-${{ matrix.shot }}
          path: studio3d
          if-no-files-found: ignore
  animate:
    needs: [plan, draw]
    if: always() && needs.plan.result == 'success' && ((needs.plan.outputs.stage == 'all' && needs.draw.result != 'cancelled') || needs.plan.outputs.stage == 'animate')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.plan.outputs.shots) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.draw.result != 'skipped'
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          path: scripts/media/studio3d/shots
      - uses: actions/download-artifact@v4
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run != ''
        with:
          name: studio3d
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: scripts/media/studio3d/shots
      - name: The newest committed pictures (animate only)
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run == ''
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: git fetch -q --depth 1 origin "$GITHUB_REF_NAME" && git checkout FETCH_HEAD -- "scripts/media/studio3d/shots/$NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Room for the weights
        run: sudo mkdir -p /mnt/hf && sudo chown "$USER" /mnt/hf
      - name: Install (CPU torch + diffusers)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "diffusers>=0.33" transformers accelerate sentencepiece protobuf safetensors imageio imageio-ffmpeg
      - name: Animate ${{ matrix.shot }}
        env:
          HF_HOME: /mnt/hf
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          NAME: ${{ needs.plan.outputs.name }}
          SHOT: ${{ matrix.shot }}
        run: |
          set -o pipefail
          dir="scripts/media/studio3d/shots/$NAME"
          mkdir -p /tmp/clip
          python scripts/media/studio3d/animate.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "$dir" --only "$SHOT" 2>&1 | tee /tmp/animate.log
          cp "$dir/$SHOT.mp4" /tmp/clip/
      - name: Keep the log
        if: always()
        env:
          SHOT: ${{ matrix.shot }}
        run: mkdir -p /tmp/clip && (grep '^{' /tmp/animate.log > "/tmp/clip/$SHOT.animate.jsonl" || true)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio3d-clip-${{ matrix.shot }}
          path: /tmp/clip
          if-no-files-found: ignore
  reel:
    needs: [plan, draw, animate]
    if: always() && needs.plan.result == 'success' && needs.draw.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.draw.result != 'skipped'
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          path: scripts/media/studio3d/shots
      - uses: actions/download-artifact@v4
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run != ''
        with:
          name: studio3d
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: scripts/media/studio3d/shots
      - name: The newest committed pictures and clips
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run == ''
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: git fetch -q --depth 1 origin "$GITHUB_REF_NAME" && git checkout FETCH_HEAD -- "scripts/media/studio3d/shots/$NAME" || true
      - uses: actions/download-artifact@v4
        if: needs.animate.result != 'skipped'
        continue-on-error: true
        with:
          pattern: studio3d-clip-*
          merge-multiple: true
          path: scripts/media/studio3d/shots/${{ needs.plan.outputs.name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/luna_reels/requirements.txt
      - name: Install FFmpeg, the reel engine and the depth model
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q -r scripts/luna_reels/requirements.txt
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers
      - name: Render the reel
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          pics="scripts/media/studio3d/shots/$NAME"
          ls -la "$pics"
          python scripts/media/studio3d/depth.py "$pics"
          python scripts/media/studio3d/episode.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "$pics" \
            --episode "$RUNNER_TEMP/episode.json" || { [ $? -eq 3 ] && exit 0; exit 1; }
          cd scripts/luna_reels
          python -m luna_reels make "$RUNNER_TEMP/episode.json" --variants 1 --voice edge --visual auto --tier free --out "$RUNNER_TEMP/reel"
          ls -la "$RUNNER_TEMP/reel"
      - uses: actions/upload-artifact@v4
        with:
          name: studio3d-reel
          path: ${{ runner.temp }}/reel
          if-no-files-found: ignore
  commit:
    needs: [plan, draw, animate, reel]
    if: always() && needs.plan.result == 'success' && (needs.draw.result != 'skipped' || needs.animate.result != 'skipped' || needs.reel.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.plan.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.draw.result != 'skipped'
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          path: /tmp/studio3d
      - uses: actions/download-artifact@v4
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run != ''
        continue-on-error: true
        with:
          name: studio3d
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: /tmp/studio3d
      - uses: actions/download-artifact@v4
        if: needs.animate.result != 'skipped'
        continue-on-error: true
        with:
          pattern: studio3d-clip-*
          merge-multiple: true
          path: /tmp/studio3d/${{ needs.plan.outputs.name }}
      - uses: actions/download-artifact@v4
        if: needs.reel.result == 'success'
        continue-on-error: true
        with:
          name: studio3d-reel
          path: /tmp/reel
      - name: Commit the pictures and clips for review
        run: |
          [ -d /tmp/studio3d ] || { echo "nothing new"; exit 0; }
          mkdir -p scripts/media/studio3d/shots
          cp -r /tmp/studio3d/. scripts/media/studio3d/shots/
          git config user.name "likelink-bot"; git config user.email "likelink-bot@users.noreply.github.com"
          git add scripts/media/studio3d/shots
          git commit -m "3D studio: $NAME pictures and clips from the free engine (review by eye)" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
      # The reel waits on a pre-release the site never reads: a person watches
      # it before anything is posted or shown.
      - name: The reel, for review (studio3d-preview)
        if: needs.reel.result == 'success'
        run: |
          ls /tmp/reel/*.mp4 >/dev/null 2>&1 || { echo "no reel"; exit 0; }
          gh release view studio3d-preview >/dev/null 2>&1 || gh release create studio3d-preview --prerelease \
            --title "3D studio previews" --notes "סרטוני בדיקה מהסטודיו התלת־ממדי. לא מפורסמים ולא מוצגים באתר."
          gh release upload studio3d-preview /tmp/reel/* --clobber
          for f in /tmp/reel/*.mp4; do n=$(basename "$f"); echo "- [$n](https://github.com/${{ github.repository }}/releases/download/studio3d-preview/$n)" >> "$GITHUB_STEP_SUMMARY"; done
