# LikeLink's 3D studio (scripts/media/studio3d), free: no account, no key, no
# credits (the owner, 2026-10-27: "@ravitrecommends' level, on our own free
# engine"). Four stages on the free runners:
#   draw     the scene pictures, FLUX.1 [schnell] (Apache-2.0), one
#            shot (or one take of a shot) per runner, side by side    flux.py
#   pick     per shot, the take that is most the same adult presenter
#            (YuNet face + CLIP: adult, same face/hair, the shot, no
#            jewellery) — the same woman in every shot                pick.py
#   animate  each picture → a clip with real motion, LTX-Video 2B
#            distilled, one shot per runner, side by side             animate.py
#   reel     the story with the reel engine (scripts/luna_reels): a
#            shot's clip, else its picture with a 3D camera move by
#            its depth map; Hebrew voice, captions, the name tag, the
#            seller's real product photo, the AI and ad labels        episode.py, depth.py
#   commit   pictures and clips to scripts/media/studio3d/shots/<shot list>/,
#            the reel to the studio3d-preview pre-release, which the site
#            never reads: a person watches it before anything is posted.
#
# What a push runs is written in scripts/media/studio3d/run.json ({"jobs":
# shot list, "only": shot ids, "stage": "all" | "animate" | "reel", and
# optionally "from_run": an earlier run whose pictures and clips to use): a
# branch workflow cannot be started by hand until it is on main.
# One product in, one reel out: {"product": <id>, "presenter": <cast id>}
# (or the same two inputs by hand) writes the shot list itself (autoplan.py:
# the story for the product's kind, the presenter's look, the truth check and
# the master's length) and runs everything from it.
# The cloud studio (scripts/media/gpu, "gpu" job): when the repository has the
# owner's Modal token (MODAL_TOKEN_ID / MODAL_TOKEN_SECRET), a product's reel is
# made on cloud GPUs in minutes instead — every scene says its own line on
# camera (InfiniteTalk), within a monthly GPU allowance under the free credit;
# without the token, or when that job fails, the free CPU path below runs.
# From the Studio: a creator presses "סרטון אנימציה עם דמות" and her product
# carries a request; every 10 minutes the scheduled run takes the oldest open one
# (queue.mjs next), makes it, and records the reel in the "studio3d" release
# (queue.mjs record), which deploy-frontend.yml serves to her Studio
# (media/studio3d/index.json). Rules: src/lib/growth/animatedReels.js.
name: 3D studio
on:
  # Every 10 minutes: a press in the Studio starts within minutes (a run with
  # no open request ends after its plan job, ~15 s).
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "shot list under scripts/media/studio3d/jobs/ (file name)"
        default: "pilot-hoops.json"
      only:
        description: "only these shot ids (comma-separated), or empty for all"
        default: ""
      stage:
        description: "all = draw, animate, reel | animate = animate + reel from the committed pictures | reel = the reel only | finds = the finds cut of a finished reel (jobs = its spec under finds/) | preview = a run's pictures on the review pre-release (from_run) | voiceover = a voice-over for a real-footage reel (jobs = its spec under voiceover/)"
        default: "all"
      product:
        description: "or: a product id (the shot list is written for it; jobs is then ignored)"
        default: ""
      presenter:
        description: "with product: the presenter from the cast (noa, maya, shira, tal, yael)"
        default: "shira"
      from_run:
        description: "stage preview: the run whose drawn pictures go to the review pre-release (a run id)"
        required: false
      ending:
        description: "with product: dm = 'write רוצה and I'll send it' (an account with the comment bot) | comment = the link in the first comment, no end card"
        default: "dm"
  push:
    branches: ["claude/likelink2-design-execution-f0ga6q"]
    paths: ["scripts/media/studio3d/run.json", "scripts/media/studio3d/*.py", ".github/workflows/studio3d.yml"]
# Read-only by default: only the commit job can push (the other jobs install
# packages and download model weights, and never hold a write token).
permissions:
  contents: read
  actions: read
# A new push waits for the work in progress (hours on a CPU) instead of
# cancelling it.
concurrency:
  group: studio3d-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.p.outputs.jobs }}
      name: ${{ steps.p.outputs.name }}
      only: ${{ steps.p.outputs.only }}
      stage: ${{ steps.p.outputs.stage }}
      shots: ${{ steps.p.outputs.shots }}
      moving: ${{ steps.p.outputs.moving }}
      draws: ${{ steps.p.outputs.draws }}
      takes: ${{ steps.p.outputs.takes }}
      from_run: ${{ steps.p.outputs.from_run }}
      talk: ${{ steps.p.outputs.talk }}
      talking: ${{ steps.p.outputs.talking }}
      product: ${{ steps.p.outputs.product }}
      presenter: ${{ steps.p.outputs.presenter }}
      request_at: ${{ steps.p.outputs.request_at }}
      marketer: ${{ steps.p.outputs.marketer }}
      gpu: ${{ steps.p.outputs.gpu }}
      finds: ${{ steps.p.outputs.finds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The hour's run: the oldest open request from the Studio, if any.
      - id: q
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/media/studio3d/queue.mjs next
      # Whether the owner's Modal token can be used (an id ak-… and a secret
      # as-…, read out of whatever was pasted); only its shape is ever logged.
      - id: mt
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python3 scripts/media/gpu/cloudplan.py tokens --check
      - id: p
        env:
          IN_JOBS: ${{ github.event.inputs.jobs }}
          IN_ONLY: ${{ github.event.inputs.only }}
          IN_STAGE: ${{ github.event.inputs.stage }}
          IN_PRODUCT: ${{ github.event.inputs.product }}
          IN_PRESENTER: ${{ github.event.inputs.presenter }}
          IN_FROM_RUN: ${{ github.event.inputs.from_run }}
          IN_ENDING: ${{ github.event.inputs.ending }}
          Q_PRODUCT: ${{ steps.q.outputs.product }}
          Q_PRESENTER: ${{ steps.q.outputs.presenter }}
          Q_REQUEST_AT: ${{ steps.q.outputs.request_at }}
          Q_MARKETER: ${{ steps.q.outputs.marketer }}
          # Only whether the owner's Modal token is usable (true/false), never its value.
          HAS_GPU: ${{ steps.mt.outputs.ok == 'true' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if [ -z "$Q_PRODUCT" ]; then
              { echo "stage=none"; echo "shots=[]"; echo "moving=[]"; echo "draws=[]"; echo "takes=false"; echo "talk=false"; echo "talking=[]"; echo "product="; echo "gpu=false"; } >> "$GITHUB_OUTPUT"
              echo "no open request"; exit 0
            fi
            JOBS=""; ONLY=""; STAGE="all"; PRODUCT="$Q_PRODUCT"; PRESENTER="$Q_PRESENTER"
            { echo "request_at=$Q_REQUEST_AT"; echo "marketer=$Q_MARKETER"; } >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            JOBS="$IN_JOBS"; ONLY="$IN_ONLY"; STAGE="$IN_STAGE"; PRODUCT="$IN_PRODUCT"; PRESENTER="$IN_PRESENTER"
            [ "$STAGE" = "finds" ] && FINDS="${IN_JOBS%.json}"  # by hand: the cut's spec name in "jobs"
            [ "$STAGE" = "voiceover" ] && VOICEOVER="${IN_JOBS%.json}"  # by hand: the voice-over's spec name in "jobs"
            FROM_RUN="${IN_FROM_RUN:-}"
            ENDING="${IN_ENDING:-dm}"
          else
            f=scripts/media/studio3d/run.json
            JOBS=$(python3 -c "import json; print(json.load(open('$f')).get('jobs', ''))")
            ONLY=$(python3 -c "import json; print(json.load(open('$f')).get('only', ''))")
            STAGE=$(python3 -c "import json; print(json.load(open('$f')).get('stage', 'all'))")
            FROM_RUN=$(python3 -c "import json; print(json.load(open('$f')).get('from_run', ''))")
            PRODUCT=$(python3 -c "import json; print(json.load(open('$f')).get('product', ''))")
            PRESENTER=$(python3 -c "import json; print(json.load(open('$f')).get('presenter', 'shira'))")
            ENGINE=$(python3 -c "import json; print(json.load(open('$f')).get('engine', ''))")
            FINDS=$(python3 -c "import json; print(json.load(open('$f')).get('finds', ''))")
            ENDING=$(python3 -c "import json; print(json.load(open('$f')).get('ending', 'dm'))")
          fi
          # The finds cut (finds.py): a finished reel re-edited with the product on screen
          # from the first frame; nothing is drawn, animated or voiced again.
          # A voice-over for a finished real-footage reel (voiceover.py): her voice, captions and a bed.
          if [ "$STAGE" = "voiceover" ]; then
            echo "${VOICEOVER:-}" | grep -Eq '^[a-z0-9-]{1,60}$' || { echo "voiceover: a spec name under scripts/media/studio3d/voiceover/"; exit 2; }
            test -f "scripts/media/studio3d/voiceover/$VOICEOVER.json"
            { echo "stage=voiceover"; echo "finds=$VOICEOVER"; echo "shots=[]"; echo "moving=[]"; echo "draws=[]"; echo "takes=false"; echo "talk=false"; echo "talking=[]"; echo "product="; echo "gpu=false"; } >> "$GITHUB_OUTPUT"
            echo "voice-over: $VOICEOVER"; exit 0
          fi
          # A run's drawn pictures on the review pre-release (a run on main commits none).
          if [ "$STAGE" = "preview" ]; then
            echo "${FROM_RUN:-}" | grep -Eq '^[0-9]{6,15}$' || { echo "preview: from_run, the run id whose pictures to show"; exit 2; }
            { echo "stage=preview"; echo "from_run=$FROM_RUN"; echo "shots=[]"; echo "moving=[]"; echo "draws=[]"; echo "takes=false"; echo "talk=false"; echo "talking=[]"; echo "product="; echo "gpu=false"; } >> "$GITHUB_OUTPUT"
            echo "preview of run $FROM_RUN"; exit 0
          fi
          if [ "$STAGE" = "finds" ]; then
            echo "${FINDS:-}" | grep -Eq '^[a-z0-9-]{1,60}$' || { echo "finds: a spec name under scripts/media/studio3d/finds/"; exit 2; }
            test -f "scripts/media/studio3d/finds/$FINDS.json"
            { echo "stage=finds"; echo "finds=$FINDS"; echo "shots=[]"; echo "moving=[]"; echo "draws=[]"; echo "takes=false"; echo "talk=false"; echo "talking=[]"; echo "product="; echo "gpu=false"; } >> "$GITHUB_OUTPUT"
            echo "finds cut: $FINDS"; exit 0
          fi
          # The cloud studio when the owner connected it, for a whole new reel; run.json may ask for "cpu".
          if [ -z "${ENGINE:-}" ]; then ENGINE=cpu; [ "$HAS_GPU" = "true" ] && [ "$STAGE" = "all" ] && ENGINE=gpu; fi
          [ "$ENGINE" = "gpu" ] && [ "$HAS_GPU" != "true" ] && { echo "engine gpu: no usable Modal token (see the step before); the free studio runs"; ENGINE=cpu; }
          echo "$ENGINE" | grep -Eq '^(cpu|gpu)$' || { echo "engine: cpu or gpu"; exit 2; }
          echo "${FROM_RUN:-}" | grep -Eq '^[0-9]{0,15}$' || { echo "from_run: a run id"; exit 2; }
          if [ "$STAGE" = "none" ]; then  # run.json at rest: a push that only changes code runs nothing
            { echo "stage=none"; echo "shots=[]"; echo "moving=[]"; echo "draws=[]"; echo "takes=false"; echo "talk=false"; echo "talking=[]"; echo "product="; echo "gpu=false"; } >> "$GITHUB_OUTPUT"
            echo "nothing to run"; exit 0
          fi
          if [ -n "$PRODUCT" ]; then  # one product in: the shot list is written for it
            echo "$PRODUCT" | grep -Eq '^[a-z0-9-]{2,30}$' || { echo "product: an id like ae-1005006861665924"; exit 2; }
            echo "$PRESENTER" | grep -Eq '^[a-z]{2,10}$' || { echo "presenter: a cast id like shira"; exit 2; }
            echo "${ENDING:-dm}" | grep -Eq '^(dm|comment|keyword)$' || { echo "ending: dm, comment or keyword"; exit 2; }
            JOBS=$(python3 scripts/media/studio3d/autoplan.py --product "$PRODUCT" --presenter "$PRESENTER" --engine "$ENGINE" --ending "${ENDING:-dm}")
            { echo "product=$PRODUCT"; echo "presenter=$PRESENTER"; } >> "$GITHUB_OUTPUT"
          fi
          echo "$JOBS" | grep -Eq '^[a-z0-9-]{1,40}\.json$' || { echo "jobs: a file name like pilot-hoops.json"; exit 2; }
          echo "$ONLY" | grep -Eq '^([a-z0-9-]{1,30}(,[a-z0-9-]{1,30})*)?$' || { echo "only: shot ids like hero,cta"; exit 2; }
          echo "$STAGE" | grep -Eq '^(all|pick|animate|reel)$' || { echo "stage: all, pick, animate or reel"; exit 2; }
          test -f "scripts/media/studio3d/jobs/$JOBS"
          SHOTS=$(ONLY="$ONLY" JOBS="$JOBS" python3 -c "
          import json, os
          ids = [s['id'] for s in json.load(open('scripts/media/studio3d/jobs/' + os.environ['JOBS']))['shots']]
          only = [x for x in os.environ['ONLY'].split(',') if x]
          print(json.dumps([i for i in ids if not only or i in only]))")
          MOVING=$(ONLY="$ONLY" JOBS="$JOBS" python3 -c "
          import json, os
          ids = [s['id'] for s in json.load(open('scripts/media/studio3d/jobs/' + os.environ['JOBS']))['shots'] if not s.get('still')]
          only = [x for x in os.environ['ONLY'].split(',') if x]
          print(json.dumps([i for i in ids if not only or i in only]))")
          # One draw per shot, or one per take of it when the shot list asks for takes.
          DRAWS=$(ONLY="$ONLY" JOBS="$JOBS" python3 -c "
          import json, os
          spec = json.load(open('scripts/media/studio3d/jobs/' + os.environ['JOBS']))
          only = [x for x in os.environ['ONLY'].split(',') if x]
          out = []
          for s in spec['shots']:
              if (only and s['id'] not in only) or s.get('cast'):  # the presenter's checked keyframe: never drawn
                  continue
              n = int(s.get('takes', spec.get('takes', 1)))
              out += [{'shot': s['id'], 'take': k} for k in range(n)] if n > 1 else [{'shot': s['id'], 'take': -1}]
          print(json.dumps(out))")
          TAKES=$(echo "$DRAWS" | python3 -c "import json, sys; print('true' if any(d['take'] >= 0 for d in json.load(sys.stdin)) else 'false')")
          TALK=$(JOBS="$JOBS" python3 -c "
          import json, os
          print('true' if any(s.get('talk') for s in json.load(open('scripts/media/studio3d/jobs/' + os.environ['JOBS']))['shots']) else 'false')")
          # Every shot where she says her line (the free lip-sync makes each on its own runner).
          # Only hers: the free lip-sync needs a human face, and the talking object has none
          # (v14, 2026-11-05: "hook.mp4: no face found"; it plays its own clip with its voice).
          TALKING=$(JOBS="$JOBS" python3 -c "
          import json, os
          print(json.dumps([s['id'] for s in json.load(open('scripts/media/studio3d/jobs/' + os.environ['JOBS']))['shots'] if s.get('talk') and not s.get('still') and (s.get('character') or s.get('cast'))]))")
          # The cloud studio makes a whole story: a shot list with an episode, every shot.
          GPU=$(JOBS="$JOBS" ENGINE="$ENGINE" STAGE="$STAGE" ONLY="$ONLY" python3 -c "
          import json, os
          spec = json.load(open('scripts/media/studio3d/jobs/' + os.environ['JOBS']))
          print('true' if os.environ['ENGINE'] == 'gpu' and os.environ['STAGE'] == 'all' and not os.environ['ONLY'] and isinstance(spec.get('episode'), dict) else 'false')")
          { echo "jobs=$JOBS"; echo "name=${JOBS%.json}"; echo "only=$ONLY"; echo "stage=$STAGE"; echo "shots=$SHOTS"; echo "moving=$MOVING"; echo "draws=$DRAWS"; echo "takes=$TAKES"; echo "from_run=${FROM_RUN:-}"; echo "talk=$TALK"; echo "talking=$TALKING"; echo "gpu=$GPU"; } >> "$GITHUB_OUTPUT"
          echo "plan: $JOBS · stage $STAGE · engine $ENGINE (cloud $GPU) · shots $SHOTS · animated $MOVING · takes $TAKES"
          mkdir -p /tmp/jobs && cp "scripts/media/studio3d/jobs/$JOBS" /tmp/jobs/
      # The shot list every later job reads (written here when a product was given).
      - uses: actions/upload-artifact@v4
        with:
          name: studio3d-jobs
          path: /tmp/jobs
  # The cloud studio: the voices on the runner, then every scene says its
  # line on Modal GPUs side by side (scripts/media/gpu/studio_gpu.py).
  gpu:
    needs: plan
    if: needs.plan.outputs.gpu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: studio3d-jobs
          path: scripts/media/studio3d/jobs
      - name: The presenter's checked keyframe (shots drawn from the cast)
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: python3 scripts/media/studio3d/castframes.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "$RUNNER_TEMP/pictures"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/luna_reels/requirements.txt
      - name: Install FFmpeg, the reel engine and Modal's client
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q -r scripts/luna_reels/requirements.txt
          pip install -q "modal>=1.0"
      - name: The voices (spoken once; the edit plays the same files)
        env:
          NAME: ${{ needs.plan.outputs.name }}
          LUNA_VOICE_CACHE: ${{ runner.temp }}/voicecache
        run: |
          python scripts/media/studio3d/episode.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "$RUNNER_TEMP/pictures" \
            --episode "$RUNNER_TEMP/episode.json"
          cd scripts/luna_reels
          python -m luna_reels voices "$RUNNER_TEMP/episode.json" --out "$RUNNER_TEMP/voices"
      - name: Every scene says its line (Modal GPUs)
        env:
          NAME: ${{ needs.plan.outputs.name }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          STUDIO_GPU_MONTH_HOURS: ${{ vars.STUDIO_GPU_MONTH_HOURS }}
        run: |
          # A pasted token can carry more than the token: a line break (2026-11-03:
          # "Invalid metadata value: '***\n'"), then "Token ID is malformed" (2026-11-04).
          # The id (ak-…) and secret (as-…) are read out of it, masked, never printed.
          python3 scripts/media/gpu/cloudplan.py tokens --env-file "$RUNNER_TEMP/modal.env"
          set -a; . "$RUNNER_TEMP/modal.env"; set +a
          rm -f "$RUNNER_TEMP/modal.env"
          mkdir -p "$RUNNER_TEMP/gpu"
          modal run scripts/media/gpu/studio_gpu.py --jobs "scripts/media/studio3d/jobs/$NAME.json" \
            --pictures "$RUNNER_TEMP/pictures" --voices "$RUNNER_TEMP/voices" --out "$RUNNER_TEMP/gpu"
          cp -r "$RUNNER_TEMP/voicecache" "$RUNNER_TEMP/gpu/voicecache"
          ls -la "$RUNNER_TEMP/gpu"
      - uses: actions/upload-artifact@v4
        with:
          name: studio3d-gpu
          path: ${{ runner.temp }}/gpu
          if-no-files-found: error
  draw:
    needs: [plan, gpu]
    # The free studio: when the cloud studio was not asked for, or failed.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.stage == 'all' && needs.gpu.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.draws) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: studio3d-jobs
          path: scripts/media/studio3d/jobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Room for the weights (the runner's second disk)
        run: |
          sudo mkdir -p /mnt/hf && sudo chown "$USER" /mnt/hf
          df -h / /mnt | tail -2
          free -g | head -2
          nproc
      - name: Install (CPU torch + diffusers with GGUF)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "diffusers>=0.32" "gguf>=0.10" transformers accelerate sentencepiece protobuf safetensors
      - name: Draw ${{ matrix.shot }} (take ${{ matrix.take }})
        env:
          HF_HOME: /mnt/hf
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          JOBS: ${{ needs.plan.outputs.jobs }}
          SHOT: ${{ matrix.shot }}
          TAKE: ${{ matrix.take }}
        run: |
          set -o pipefail
          out="studio3d/${JOBS%.json}"; mkdir -p "$out"
          python scripts/media/studio3d/flux.py --jobs "scripts/media/studio3d/jobs/$JOBS" --out "$out" \
            --width 576 --height 1024 --only "$SHOT" --take "$TAKE" 2>&1 | tee /tmp/flux.log
          log="$out/$SHOT.draw.jsonl"; [ "$TAKE" -ge 0 ] && log="$out/$SHOT.t$TAKE.draw.jsonl"
          grep '^{' /tmp/flux.log > "$log" || true
      # A single draw is a picture already; takes wait for the pick job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.take < 0 && format('studio3d-pic-{0}', matrix.shot) || format('studio3d-take-{0}-{1}', matrix.shot, matrix.take) }}
          path: studio3d
          if-no-files-found: ignore
  pick:
    needs: [plan, draw]
    if: always() && needs.plan.outputs.takes == 'true' && ((needs.plan.outputs.stage == 'all' && needs.draw.result != 'skipped' && needs.draw.result != 'cancelled') || (needs.plan.outputs.stage == 'pick' && needs.plan.outputs.from_run != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: studio3d-jobs
          path: scripts/media/studio3d/jobs
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.stage != 'pick'
        with:
          pattern: studio3d-take-*
          merge-multiple: true
          path: studio3d
      # stage "pick": choose again from an earlier run's takes, without drawing them again.
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.stage == 'pick'
        with:
          pattern: studio3d-take-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: studio3d
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch, CLIP, OpenCV)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers pillow opencv-python-headless
      - name: Pick the same woman in every shot
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          ls -la "studio3d/$NAME"
          python scripts/media/studio3d/pick.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "studio3d/$NAME"
          ls -la "studio3d/$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: studio3d-pic-picked
          path: studio3d
          if-no-files-found: error
  animate:
    needs: [plan, gpu, draw, pick]
    if: always() && needs.plan.result == 'success' && needs.gpu.result != 'success' && needs.plan.outputs.moving != '[]' && needs.pick.result != 'failure' && ((needs.plan.outputs.stage == 'all' && needs.draw.result != 'cancelled') || needs.plan.outputs.stage == 'animate' || (needs.plan.outputs.stage == 'pick' && needs.pick.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.plan.outputs.moving) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: studio3d-jobs
          path: scripts/media/studio3d/jobs
      - name: The newest committed pictures and clips
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: git fetch -q --depth 1 origin "$GITHUB_REF_NAME" && git checkout FETCH_HEAD -- "scripts/media/studio3d/shots/$NAME" || true
      - uses: actions/download-artifact@v4
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run != ''
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: scripts/media/studio3d/shots
      - uses: actions/download-artifact@v4
        if: needs.draw.result != 'skipped' || needs.pick.result == 'success'
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          path: scripts/media/studio3d/shots
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Room for the weights
        run: sudo mkdir -p /mnt/hf && sudo chown "$USER" /mnt/hf
      - name: Install (CPU torch + diffusers)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "diffusers>=0.33" transformers accelerate sentencepiece protobuf safetensors imageio imageio-ffmpeg
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
      - name: The presenter's checked keyframe (shots drawn from the cast)
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: python3 scripts/media/studio3d/castframes.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "scripts/media/studio3d/shots/$NAME"
      - name: Animate ${{ matrix.shot }}
        env:
          HF_HOME: /mnt/hf
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          NAME: ${{ needs.plan.outputs.name }}
          SHOT: ${{ matrix.shot }}
        run: |
          set -o pipefail
          dir="scripts/media/studio3d/shots/$NAME"
          mkdir -p /tmp/clip
          python scripts/media/studio3d/animate.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "$dir" --only "$SHOT" 2>&1 | tee /tmp/animate.log
          cp "$dir/$SHOT.mp4" /tmp/clip/
      - name: Keep the log
        if: always()
        env:
          SHOT: ${{ matrix.shot }}
        run: mkdir -p /tmp/clip && (grep '^{' /tmp/animate.log > "/tmp/clip/$SHOT.animate.jsonl" || true)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio3d-clip-${{ matrix.shot }}
          path: /tmp/clip
          if-no-files-found: ignore
  # The free lip-sync (when the cloud studio did not run): her mouth and jaw
  # redrawn to each line by MuseTalk 1.5 on a CPU (scripts/media/talking/
  # musetalk.py), over her own animated clip. The voices are spoken once, so
  # every talking shot and the edit play the very same recording.
  voices:
    needs: [plan, gpu]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.talk == 'true' && needs.plan.outputs.stage != 'none' && needs.gpu.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: studio3d-jobs
          path: scripts/media/studio3d/jobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/luna_reels/requirements.txt
      - name: Install FFmpeg and the reel engine
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q -r scripts/luna_reels/requirements.txt
      - name: The voices (spoken once)
        env:
          NAME: ${{ needs.plan.outputs.name }}
          LUNA_VOICE_CACHE: ${{ runner.temp }}/voices/voicecache
        run: |
          mkdir -p "$RUNNER_TEMP/pictures"
          python scripts/media/studio3d/episode.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "$RUNNER_TEMP/pictures" \
            --episode "$RUNNER_TEMP/episode.json"
          cd scripts/luna_reels
          python -m luna_reels voices "$RUNNER_TEMP/episode.json" --out "$RUNNER_TEMP/voices"
      - uses: actions/upload-artifact@v4
        with:
          name: studio3d-voices
          path: ${{ runner.temp }}/voices
          if-no-files-found: error
  lips:
    needs: [plan, gpu, draw, pick, animate, voices]
    if: always() && needs.voices.result == 'success' && needs.draw.result != 'cancelled' && needs.pick.result != 'failure' && needs.animate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.plan.outputs.talking) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: studio3d-jobs
          path: scripts/media/studio3d/jobs
      - name: The newest committed pictures and clips
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: git fetch -q --depth 1 origin "$GITHUB_REF_NAME" && git checkout FETCH_HEAD -- "scripts/media/studio3d/shots/$NAME" || true
      - name: A redrawn picture's old clip is stale
        if: needs.draw.result != 'skipped'
        env:
          NAME: ${{ needs.plan.outputs.name }}
          SHOTS: ${{ needs.plan.outputs.shots }}
        run: for s in $(echo "$SHOTS" | python3 -c "import json, sys; print(' '.join(json.load(sys.stdin)))"); do rm -f "scripts/media/studio3d/shots/$NAME/$s.mp4"; done
      - uses: actions/download-artifact@v4
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run != ''
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: scripts/media/studio3d/shots
      - uses: actions/download-artifact@v4
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run != ''
        continue-on-error: true
        with:
          pattern: studio3d-clip-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: scripts/media/studio3d/shots/${{ needs.plan.outputs.name }}
      - uses: actions/download-artifact@v4
        if: needs.draw.result != 'skipped' || needs.pick.result == 'success'
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          path: scripts/media/studio3d/shots
      - uses: actions/download-artifact@v4
        if: needs.animate.result != 'skipped'
        continue-on-error: true
        with:
          pattern: studio3d-clip-*
          merge-multiple: true
          path: scripts/media/studio3d/shots/${{ needs.plan.outputs.name }}
      - uses: actions/download-artifact@v4
        with:
          name: studio3d-voices
          path: ${{ runner.temp }}/voices
      - name: The presenter's checked keyframe (shots drawn from the cast)
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: python3 scripts/media/studio3d/castframes.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "scripts/media/studio3d/shots/$NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Room for the weights
        run: sudo mkdir -p /mnt/hf && sudo chown "$USER" /mnt/hf
      - name: Install (CPU torch, diffusers, Whisper, OpenCV)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q -r scripts/luna_reels/requirements.txt
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "diffusers>=0.33" transformers accelerate safetensors huggingface_hub opencv-python-headless
      - name: She says her line (${{ matrix.shot }})
        env:
          HF_HOME: /mnt/hf
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          NAME: ${{ needs.plan.outputs.name }}
          SHOT: ${{ matrix.shot }}
        run: |
          set -o pipefail
          mkdir -p /tmp/lips
          python scripts/media/talking/musetalk.py --scene "$SHOT" --jobs "scripts/media/studio3d/jobs/$NAME.json" \
            --pictures "scripts/media/studio3d/shots/$NAME" --voices "$RUNNER_TEMP/voices" --out "/tmp/lips/$SHOT.talk.mp4" 2>&1 | tee /tmp/lips.log
      - name: Keep the log
        if: always()
        env:
          SHOT: ${{ matrix.shot }}
        run: mkdir -p /tmp/lips && (grep '^{' /tmp/lips.log > "/tmp/lips/$SHOT.lips.jsonl" || true)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio3d-lips-${{ matrix.shot }}
          path: /tmp/lips
          if-no-files-found: ignore
  reel:
    needs: [plan, gpu, draw, pick, animate, voices, lips]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.stage != 'none' && needs.plan.outputs.stage != 'finds' && needs.plan.outputs.stage != 'preview' && needs.plan.outputs.stage != 'voiceover' && needs.draw.result != 'cancelled' && needs.pick.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: studio3d-jobs
          path: scripts/media/studio3d/jobs
      - name: The newest committed pictures and clips
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: git fetch -q --depth 1 origin "$GITHUB_REF_NAME" && git checkout FETCH_HEAD -- "scripts/media/studio3d/shots/$NAME" || true
      # A talking clip is tied to the voice it was made for: only this run's are used.
      - name: No talking clip from an earlier run
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: rm -f scripts/media/studio3d/shots/"$NAME"/*.talk.mp4
      - name: A redrawn picture's old clip is stale
        if: needs.draw.result != 'skipped' || needs.pick.result == 'success' || needs.gpu.result == 'success'
        env:
          NAME: ${{ needs.plan.outputs.name }}
          SHOTS: ${{ needs.plan.outputs.shots }}
        run: for s in $(echo "$SHOTS" | python3 -c "import json, sys; print(' '.join(json.load(sys.stdin)))"); do rm -f "scripts/media/studio3d/shots/$NAME/$s.mp4" "scripts/media/studio3d/shots/$NAME/$s.talk.mp4"; done
      - uses: actions/download-artifact@v4
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run != ''
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: scripts/media/studio3d/shots
      - uses: actions/download-artifact@v4
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run != ''
        continue-on-error: true
        with:
          pattern: studio3d-clip-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: scripts/media/studio3d/shots/${{ needs.plan.outputs.name }}
      - uses: actions/download-artifact@v4
        if: needs.draw.result != 'skipped' || needs.pick.result == 'success'
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          path: scripts/media/studio3d/shots
      - uses: actions/download-artifact@v4
        if: needs.animate.result != 'skipped'
        continue-on-error: true
        with:
          pattern: studio3d-clip-*
          merge-multiple: true
          path: scripts/media/studio3d/shots/${{ needs.plan.outputs.name }}
      # The cloud studio's talking scenes (+ any picture it drew) and the very voices they say.
      - uses: actions/download-artifact@v4
        if: needs.gpu.result == 'success'
        with:
          name: studio3d-gpu
          path: scripts/media/studio3d/shots/${{ needs.plan.outputs.name }}
      - name: The cloud studio's voices
        if: needs.gpu.result == 'success'
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          mv "scripts/media/studio3d/shots/$NAME/voicecache" "$RUNNER_TEMP/voicecache"
          echo "LUNA_VOICE_CACHE=$RUNNER_TEMP/voicecache" >> "$GITHUB_ENV"
      # The free lip-sync's talking shots and the very voices they say.
      - uses: actions/download-artifact@v4
        if: needs.lips.result != 'skipped' && needs.voices.result == 'success'
        continue-on-error: true
        with:
          pattern: studio3d-lips-*
          merge-multiple: true
          path: scripts/media/studio3d/shots/${{ needs.plan.outputs.name }}
      - uses: actions/download-artifact@v4
        if: needs.voices.result == 'success'
        with:
          name: studio3d-voices
          path: ${{ runner.temp }}/voices
      - name: The free lip-sync's voices
        if: needs.voices.result == 'success'
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          echo "LUNA_VOICE_CACHE=$RUNNER_TEMP/voices/voicecache" >> "$GITHUB_ENV"
          cat scripts/media/studio3d/shots/"$NAME"/*.lips.jsonl 2>/dev/null || true
      - name: The presenter's checked keyframe (shots drawn from the cast)
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: python3 scripts/media/studio3d/castframes.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "scripts/media/studio3d/shots/$NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/luna_reels/requirements.txt
      # When the free lip-sync did not make every talking shot: SadTalker
      # (Apache-2.0) in its own Python 3.10 venv, as in the Luna reels workflow.
      - uses: actions/setup-python@v5
        id: py310
        if: needs.plan.outputs.talk == 'true' && needs.gpu.result != 'success' && needs.lips.result != 'success'
        with:
          python-version: "3.10"
      - uses: actions/cache@v4
        if: needs.plan.outputs.talk == 'true' && needs.gpu.result != 'success' && needs.lips.result != 'success'
        with:
          path: ~/sadtalker
          key: sadtalker-v0.0.2-rc
      - name: SadTalker (lip-sync)
        if: needs.plan.outputs.talk == 'true' && needs.gpu.result != 'success' && needs.lips.result != 'success'
        run: |
          "${{ steps.py310.outputs.python-path }}" -m venv ~/sadtalker-venv
          V=~/sadtalker-venv/bin/pip
          $V install -q --upgrade pip wheel "setuptools<70"
          $V install -q torch==2.0.1+cpu torchvision==0.15.2+cpu torchaudio==2.0.2+cpu \
            --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          $V install -q numpy==1.23.4 cython
          $V install -q --no-build-isolation basicsr==1.4.2
          $V install -q numpy==1.23.4 face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 librosa==0.9.2 numba resampy==0.3.1 \
            pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml joblib==1.1.0 scikit-image==0.19.3 basicsr==1.4.2 \
            facexlib==0.3.0 gfpgan av safetensors
          echo "SADTALKER_VENV=$HOME/sadtalker-venv" >> "$GITHUB_ENV"
      - name: Install FFmpeg, the reel engine and the depth model
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q -r scripts/luna_reels/requirements.txt
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers "rembg[cpu]"
      - name: Render the reel
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          pics="scripts/media/studio3d/shots/$NAME"
          ls -la "$pics"
          python scripts/media/studio3d/depth.py "$pics"
          python scripts/media/studio3d/product_set.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "$pics" || true
          python scripts/media/studio3d/episode.py --jobs "scripts/media/studio3d/jobs/$NAME.json" --pictures "$pics" \
            --episode "$RUNNER_TEMP/episode.json" || { [ $? -eq 3 ] && exit 0; exit 1; }
          cd scripts/luna_reels
          python -m luna_reels make "$RUNNER_TEMP/episode.json" --variants 1 --voice edge --visual auto --tier free --out "$RUNNER_TEMP/reel"
          ls -la "$RUNNER_TEMP/reel"
      - uses: actions/upload-artifact@v4
        with:
          name: studio3d-reel
          path: ${{ runner.temp }}/reel
          if-no-files-found: ignore
  commit:
    needs: [plan, gpu, draw, pick, animate, reel]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.stage != 'none' && needs.plan.outputs.stage != 'finds' && needs.plan.outputs.stage != 'preview' && needs.plan.outputs.stage != 'voiceover' && (needs.draw.result != 'skipped' || needs.animate.result != 'skipped' || needs.reel.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.plan.outputs.name }}
    steps:
      # The branch as it is now (an earlier run may have committed since this
      # one started): the 2026-10-27 redraw's rebase hit add/add conflicts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: studio3d-jobs
          path: scripts/media/studio3d/jobs
      # An earlier run's pictures first, this run's over them (the other way
      # round, a pick from an earlier run's takes would commit its old choice).
      - uses: actions/download-artifact@v4
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run != ''
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: /tmp/studio3d
      - uses: actions/download-artifact@v4
        if: needs.draw.result != 'skipped' || needs.pick.result == 'success'
        continue-on-error: true
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          path: /tmp/studio3d
      - uses: actions/download-artifact@v4
        if: needs.draw.result == 'skipped' && needs.plan.outputs.from_run != ''
        continue-on-error: true
        with:
          pattern: studio3d-clip-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: /tmp/studio3d/${{ needs.plan.outputs.name }}
      - uses: actions/download-artifact@v4
        if: needs.animate.result != 'skipped'
        continue-on-error: true
        with:
          pattern: studio3d-clip-*
          merge-multiple: true
          path: /tmp/studio3d/${{ needs.plan.outputs.name }}
      - uses: actions/download-artifact@v4
        if: needs.gpu.result == 'success'
        continue-on-error: true
        with:
          name: studio3d-gpu
          path: /tmp/studio3d/${{ needs.plan.outputs.name }}
      - uses: actions/download-artifact@v4
        if: needs.reel.result == 'success'
        continue-on-error: true
        with:
          name: studio3d-reel
          path: /tmp/reel
      - name: Commit the pictures and clips for review
        if: github.ref_name != 'main'
        env:
          DRAWN: ${{ needs.draw.result }}
          SHOTS: ${{ needs.plan.outputs.shots }}
        run: |
          [ -d /tmp/studio3d ] || { echo "nothing new"; exit 0; }
          rm -rf "/tmp/studio3d/$NAME/voicecache"
          mkdir -p scripts/media/studio3d/shots
          if [ "$DRAWN" != "skipped" ]; then  # a redrawn picture's old clip is stale
            for s in $(echo "$SHOTS" | python3 -c "import json, sys; print(' '.join(json.load(sys.stdin)))"); do
              git rm -q -f --ignore-unmatch "scripts/media/studio3d/shots/$NAME/$s.mp4"
            done
          fi
          cp -r /tmp/studio3d/. scripts/media/studio3d/shots/
          git config user.name "likelink-bot"; git config user.email "likelink-bot@users.noreply.github.com"
          git add scripts/media/studio3d/shots "scripts/media/studio3d/jobs/$NAME.json"
          git commit -m "3D studio: $NAME pictures and clips from the free engine (review by eye)" || exit 0
          git push -q origin "HEAD:$GITHUB_REF_NAME" || { git pull --rebase -X theirs -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; }
      # The reel waits on a pre-release the site never reads: a person watches
      # it before anything is posted or shown.
      - name: The reel, for review (studio3d-preview)
        if: needs.reel.result == 'success'
        run: |
          ls /tmp/reel/*.mp4 >/dev/null 2>&1 || { echo "no reel"; exit 0; }
          gh release view studio3d-preview >/dev/null 2>&1 || gh release create studio3d-preview --prerelease \
            --title "3D studio previews" --notes "סרטוני בדיקה מהסטודיו התלת־ממדי. לא מפורסמים ולא מוצגים באתר."
          gh release upload studio3d-preview /tmp/reel/* --clobber
          for f in /tmp/reel/*.mp4; do n=$(basename "$f"); echo "- [$n](https://github.com/${{ github.repository }}/releases/download/studio3d-preview/$n)" >> "$GITHUB_STEP_SUMMARY"; done
  # A reel made for a product (from the Studio's queue, or by hand with a
  # product) goes to the "studio3d" release with its outcome, and from there
  # to that creator's Studio (deploy-frontend.yml → media/studio3d/index.json).
  # A run that did not finish is recorded as FAILED, so the Studio says so
  # and the queue tries once more later.
  record:
    needs: [plan, gpu, draw, pick, animate, reel]
    # Only from main (the site's queue, or a run by hand there): a branch run is a review run (studio3d-preview).
    if: always() && github.ref_name == 'main' && needs.plan.result == 'success' && needs.plan.outputs.stage != 'none' && needs.plan.outputs.product != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: needs.reel.result == 'success'
        continue-on-error: true
        with:
          name: studio3d-reel
          path: /tmp/reel
      - name: Record the reel for the Studio
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ needs.plan.outputs.product }}
          PRESENTER: ${{ needs.plan.outputs.presenter }}
          REQUEST_AT: ${{ needs.plan.outputs.request_at }}
          MARKETER: ${{ needs.plan.outputs.marketer }}
          REASON: "cloud ${{ needs.gpu.result }} · draw ${{ needs.draw.result }} · pick ${{ needs.pick.result }} · animate ${{ needs.animate.result }} · reel ${{ needs.reel.result }}"
          OK: ${{ needs.reel.result == 'success' }}
        run: |
          if [ "$OK" = "true" ] && ls /tmp/reel/*.mp4 >/dev/null 2>&1; then
            node scripts/media/studio3d/queue.mjs record READY /tmp/reel
          else
            node scripts/media/studio3d/queue.mjs record FAILED
          fi
  # The finds cut of a finished reel (scripts/media/studio3d/finds.py): the
  # store's real photos on screen from the first frame, the presenter in a
  # circle with her own voice and lips. Goes to the review pre-release only.
  finds:
    needs: [plan]
    if: needs.plan.outputs.stage == 'finds'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FINDS: ${{ needs.plan.outputs.finds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/luna_reels/requirements.txt
      - name: Install FFmpeg and the reel engine
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q -r scripts/luna_reels/requirements.txt
      - name: The finds cut
        run: |
          spec="scripts/media/studio3d/finds/$FINDS.json"
          rel=$(python3 -c "import json; print(json.load(open('$spec'))['source']['release'])")
          asset=$(python3 -c "import json; print(json.load(open('$spec'))['source']['asset'])")
          echo "$rel" | grep -Eq '^studio3d(-preview)?$' || { echo "source: a studio3d release"; exit 2; }
          echo "$asset" | grep -Eq '^[a-z0-9-]{1,80}\.mp4$' || { echo "source asset: a reel file name"; exit 2; }
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/finds"
          gh release download "$rel" --repo "${{ github.repository }}" --pattern "$asset" --dir "$RUNNER_TEMP/src"
          python scripts/media/studio3d/finds.py --spec "$spec" --reel "$RUNNER_TEMP/src/$asset" --out "$RUNNER_TEMP/finds"
          rm -rf "$RUNNER_TEMP/finds/photos" "$RUNNER_TEMP/finds/voice.m4a"
          ls -la "$RUNNER_TEMP/finds"
      - name: The cut, for review (studio3d-preview)
        run: |
          gh release view studio3d-preview --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create studio3d-preview --repo "${{ github.repository }}" --prerelease \
            --title "3D studio previews" --notes "סרטוני בדיקה מהסטודיו התלת־ממדי. לא מפורסמים ולא מוצגים באתר."
          gh release upload studio3d-preview "$RUNNER_TEMP"/finds/* --repo "${{ github.repository }}" --clobber
          for f in "$RUNNER_TEMP"/finds/*.mp4; do n=$(basename "$f"); echo "- [$n](https://github.com/${{ github.repository }}/releases/download/studio3d-preview/$n)" >> "$GITHUB_STEP_SUMMARY"; done
  # A run's drawn pictures (cast keyframe candidates, shots) as files on the
  # review pre-release, with a numbered contact sheet, for a person to choose
  # by eye. A run on main keeps its pictures only as artifacts.
  preview:
    needs: [plan]
    if: needs.plan.outputs.stage == 'preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      FROM_RUN: ${{ needs.plan.outputs.from_run }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: studio3d-pic-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pics
      - name: The pictures and a contact sheet, for review (studio3d-preview)
        run: |
          pip install -q pillow
          mkdir -p "$RUNNER_TEMP/out"
          find "$RUNNER_TEMP/pics" -type f -name '*.png' | sort > "$RUNNER_TEMP/list.txt"
          test -s "$RUNNER_TEMP/list.txt" || { echo "no pictures in run $FROM_RUN"; exit 1; }
          python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw
          tmp = Path(os.environ["RUNNER_TEMP"]); run = os.environ["FROM_RUN"]
          files = [Path(p) for p in (tmp / "list.txt").read_text().split()]
          tiles = []
          for f in files:
              im = Image.open(f).convert("RGB")
              im.save(tmp / "out" / f"run{run}-{f.stem}.jpg", quality=92)
              t = im.copy(); t.thumbnail((360, 640)); tiles.append((f.stem, t))
          w = sum(t.width for _, t in tiles) + 10 * (len(tiles) + 1); h = max(t.height for _, t in tiles) + 60
          sheet = Image.new("RGB", (w, h), (20, 20, 24)); d = ImageDraw.Draw(sheet); x = 10
          for name, t in tiles:
              sheet.paste(t, (x, 50)); d.text((x, 16), name, fill=(255, 255, 255)); x += t.width + 10
          sheet.save(tmp / "out" / f"run{run}-sheet.jpg", quality=90)
          PY
          gh release upload studio3d-preview "$RUNNER_TEMP"/out/* --repo "${{ github.repository }}" --clobber
          ls "$RUNNER_TEMP/out" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
  # A voice-over for a finished real-footage reel (scripts/media/studio3d/voiceover.py):
  # the free Edge voice (labelled), captions and a generated music bed over the
  # seller's cut. Goes to the review pre-release only; nothing is posted.
  voiceover:
    needs: [plan]
    if: needs.plan.outputs.stage == 'voiceover'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SPEC_NAME: ${{ needs.plan.outputs.finds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/luna_reels/requirements.txt
      - name: Install FFmpeg and the reel engine
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q -r scripts/luna_reels/requirements.txt
      - name: The voice-over
        run: |
          spec="scripts/media/studio3d/voiceover/$SPEC_NAME.json"
          rel=$(python3 -c "import json; print(json.load(open('$spec'))['source']['release'])")
          asset=$(python3 -c "import json; print(json.load(open('$spec'))['source']['asset'])")
          echo "$rel" | grep -Eq '^(reels|studio3d|studio3d-preview)$' || { echo "source: the reels or a studio3d release"; exit 2; }
          echo "$asset" | grep -Eq '^[a-z0-9-]{1,80}\.mp4$' || { echo "source asset: a reel file name"; exit 2; }
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/vo"
          gh release download "$rel" --repo "${{ github.repository }}" --pattern "$asset" --dir "$RUNNER_TEMP/src"
          python scripts/media/studio3d/voiceover.py --spec "$spec" --video "$RUNNER_TEMP/src/$asset" --out "$RUNNER_TEMP/vo"
          rm -rf "$RUNNER_TEMP/vo/work"
          ls -la "$RUNNER_TEMP/vo"
      - name: The reel, for review (studio3d-preview)
        run: |
          gh release upload studio3d-preview "$RUNNER_TEMP"/vo/* --repo "${{ github.repository }}" --clobber
          for f in "$RUNNER_TEMP"/vo/*.mp4; do n=$(basename "$f"); echo "- [$n](https://github.com/${{ github.repository }}/releases/download/studio3d-preview/$n)" >> "$GITHUB_STEP_SUMMARY"; done
