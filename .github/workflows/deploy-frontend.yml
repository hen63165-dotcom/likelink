name: Deploy frontend to GitHub Pages

# Vercel-free static delivery: builds the Vite production bundle with the
# Supabase endpoints injected from GitHub Secrets and force-pushes only the
# static assets to the `gh-pages` branch (served by GitHub Pages).

on:
  push:
    branches: [main]
  # New reels (luna-reels and reels releases) and synced store prices reach the site right away.
  workflow_run:
    workflows: ["Luna reels", "Catalog sync", "Product video reels", "Creative engine", "Add trend products", "TikTok results"]
    types: [completed]
  # Every morning (06:40 Israel summer time): a fresh daily drop with today's trends.
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve public base path
        id: base
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then base="/"; else base="/${repo}/"; fi
          echo "path=$base" >> "$GITHUB_OUTPUT"
          echo "Base path: $base"

      - name: Inject Supabase configuration from GitHub Secrets
        # The anon key is public by design (it ships inside the client bundle),
        # so a repository *variable* is an accepted fallback for the *secret*.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # The client bundle reads VITE_* (src/lib/env.js); accept the
          # NEXT_PUBLIC_* names as aliases so either set works.
          url="${VITE_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          key="${VITE_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Supabase URL/anon key missing — add repository secrets (or variables) NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY."
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$url"
            echo "VITE_SUPABASE_ANON_KEY=$key"
          } >> "$GITHUB_ENV"

      - name: Build production static bundle
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Add the product reels (luna-reels + reels releases → media/reels)
        # One reel per listed product plus the sellers' own videos, served by
        # GitHub Pages to every host (scripts/reels-feed.mjs). ffmpeg cuts one
        # frame of each video as its cover. A failure here never blocks the site.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; } || echo "::warning::no ffmpeg: covers fall back to the product photos"
          node scripts/reels-feed.mjs dist || echo "::warning::reels feed skipped"

      - name: The Creative Engine's job ledger (ops/creative → media/creative/jobs.json)
        # The Studio's Creative Engine screen reads each product's pipeline from
        # it (statuses, QC, byte proofs, errors — no secrets). A failure here never blocks the site.
        run: |
          mkdir -p dist/media/creative
          if git fetch -q origin "+refs/heads/ops/creative:refs/remotes/origin/ops/creative" 2>/dev/null; then
            git show origin/ops/creative:jobs.json > dist/media/creative/jobs.json && echo "ledger published" || echo "::warning::no ledger yet"
          else
            echo "::warning::no ops/creative branch yet"
          fi

      - name: Pinterest feed (pins.xml, read by Pinterest's auto-publish)
        # Products, reel covers and the size meter as an RSS feed the owner's
        # Pinterest account picks up by itself (scripts/pins-feed.mjs).
        run: node scripts/pins-feed.mjs dist || echo "::warning::pins feed skipped"

      - name: The daily drop (today's post for every network → /drop/)
        # Today's product, its best video and Google Trends Israel → a page the
        # owner posts from in a minute (scripts/marketing/daily-drop.mjs).
        run: node scripts/marketing/daily-drop.mjs dist || echo "::warning::daily drop skipped"

      - name: The TikTok kit (today's TikToks, rendered slides, what the results taught → /tiktok/)
        # src/lib/growth/tiktok.js + scripts/marketing/tiktok-kit.mjs. The owner's
        # logged results live on ops/tiktok (tiktok-results.yml). The slides are
        # rendered with the runner's own Chrome; without it they are listed as text.
        run: |
          echo "[]" > "$RUNNER_TEMP/tiktok-results.json"
          if git fetch --depth=1 origin ops/tiktok:refs/remotes/origin/ops/tiktok 2>/dev/null; then
            git show refs/remotes/origin/ops/tiktok:marketing/tiktok-results.json > "$RUNNER_TEMP/tiktok-results.json" 2>/dev/null || echo "[]" > "$RUNNER_TEMP/tiktok-results.json"
          fi
          npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.56.1 >/dev/null 2>&1 || echo "::warning::no playwright: slides listed as text"
          TIKTOK_RESULTS="$RUNNER_TEMP/tiktok-results.json" PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright \
            node scripts/marketing/tiktok-kit.mjs dist || echo "::warning::tiktok kit skipped"

      - name: The Instagram grid (nine posts in one look → /instagram/)
        # src/lib/growth/instagramGrid.js + scripts/marketing/instagram-grid.mjs:
        # product posts with the product's own photo and the disclosure first,
        # tip posts from the free guide with the AI character labelled, one name
        # tag and one hook bar on every picture. Rendered with the Chrome the
        # TikTok kit installed; nothing is posted from here.
        run: PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright node scripts/marketing/instagram-grid.mjs dist || echo "::warning::instagram grid skipped"

      - name: The trend board (AliExpress hot products by category → /trend-board/)
        # src/lib/growth/trendBoard.js + scripts/catalog/trend-finder.mjs: AliExpress's
        # own hot-products list per category (ship to Israel, ILS, the owner's
        # tracked link), Google Trends Israel matches first. Nothing reaches the
        # site from here: the owner picks items for "Add trend products".
        # The script stops asking after 150 s; a failed read keeps yesterday's board
        # (from gh-pages) instead of publishing an empty one, and never blocks the site.
        timeout-minutes: 6
        continue-on-error: true
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
        run: |
          set -o pipefail
          stage="$(mktemp -d)"
          if node scripts/catalog/trend-finder.mjs "$stage"; then
            rm -rf dist/trend-board && cp -r "$stage/trend-board" dist/trend-board
          else
            echo "::warning::trend board not refreshed: keeping the last published one"
            rm -rf dist/trend-board
            if git fetch -q --depth=1 origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null \
              && git archive refs/remotes/origin/gh-pages trend-board | tar -x -C dist; then
              echo "kept the previous board"
            else
              # No earlier board yet: publish the page that says the read failed.
              cp -r "$stage/trend-board" dist/trend-board 2>/dev/null || true
            fi
          fi

      - name: Publish dist to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          stage="$(mktemp -d)"
          cp -r dist/. "$stage/"
          printf '' > "$stage/.nojekyll"
          # Keep the premium domain on the primary host only: never publish
          # public/CNAME into the gh-pages mirror (GitHub would redirect
          # the mirror's *.github.io URL to the CNAME domain).
          rm -f "$stage/CNAME"
          # SPA fallback: GitHub Pages answers unknown paths with 404.html, so
          # the React router can take over deep links (/discover, /p/:id, …).
          cp "$stage/index.html" "$stage/404.html"
          cd "$stage"
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7} static frontend"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Tell search engines about the pages (IndexNow)
        # Bing, Yandex, Seznam, Naver… share one free endpoint (scripts/indexnow.mjs).
        # Only after a code push: the page list does not change with new reels.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/indexnow.mjs dist || echo "::warning::indexnow skipped"
