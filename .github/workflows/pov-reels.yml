# POV reels (scripts/marketing/pov-reel.mjs): the store's own video for each
# product in scripts/marketing/pov-reels/jobs.json, cut every 1 s, one POV line
# fixed at the top, the labels on every frame and our own beat. The finished
# reels and their contact sheets are committed to marketing/reels/pov/ on the
# branch that ran, for a person to review; nothing is posted from here.
name: POV reels
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "render (jobs.json) or sheets (every listed product with a store video: its shots, for captions)"
        default: render
      limit:
        description: "sheets: how many products"
        default: "40"
  push:
    paths:
      - scripts/marketing/pov-reel.mjs
      - scripts/marketing/pov-reels/**
      - .github/workflows/pov-reels.yml
permissions:
  contents: write
concurrency:
  group: pov-reels-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
      FONTSOURCE_DIR: /tmp/pw/node_modules/@fontsource
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (the runner's Chrome), ffmpeg, the Hebrew font and numpy
        run: |
          npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.56.1 @fontsource/heebo@5.3.0 >/dev/null
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-noto-core >/dev/null
          python3 -m pip install --quiet numpy
      - name: Render the reels (or the shot sheets)
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -o pipefail
          # A push runs what scripts/marketing/pov-reels/run.json says (the workflow is not on main yet).
          [ -n "$MODE" ] || MODE=$(node -p 'require("./scripts/marketing/pov-reels/run.json").mode || "render"')
          [ -n "$LIMIT" ] || LIMIT=$(node -p 'require("./scripts/marketing/pov-reels/run.json").limit || 40')
          if [ "$MODE" = "hot" ]; then
            node scripts/marketing/pov-reel.mjs --hot pov-reels-out "$LIMIT" | tee /tmp/report.txt
          elif [ "$MODE" = "sheets" ]; then
            node scripts/marketing/pov-reel.mjs --sheets pov-reels-out "$LIMIT" | tee /tmp/report.txt
          else
            node scripts/marketing/pov-reel.mjs scripts/marketing/pov-reels/jobs.json pov-reels-out | tee /tmp/report.txt
          fi
          { echo "### POV reels ($MODE)"; echo '```json'; cat /tmp/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Put the reels on the "pov-reels" release (for the owner's phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(pov-reels-out/*.mp4)
          [ ${#files[@]} -gt 0 ] || { echo "no reels"; exit 0; }
          gh release view pov-reels >/dev/null 2>&1 || gh release create pov-reels --prerelease --title "POV reels" --notes "POV reels for the owner to download on her phone, add a trending sound and post. Nothing here is posted automatically."
          gh release upload pov-reels "${files[@]}" --clobber
      - name: Commit the sheets and the report for review
        run: |
          shopt -s nullglob
          files=(pov-reels-out/*.jpg pov-reels-out/*.json pov-reels-out/*.mp4)
          [ ${#files[@]} -gt 0 ] || { echo "nothing to commit"; exit 0; }
          mkdir -p marketing/reels/pov && cp "${files[@]}" marketing/reels/pov/
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/reels/pov
          git diff --cached --quiet && exit 0
          git commit -q -m "POV reels: sheets and report for review"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:${GITHUB_REF_NAME} && exit 0
            sleep $((i * 5))
          done
          exit 1
