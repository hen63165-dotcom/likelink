# LikeLink native reels — the executor of the media pipeline.
#
# A Vercel function cannot render video, so the renderer runs here:
#   plan (server) → render (Chromium canvas) → encode (ffmpeg H.264) →
#   ingest (server: store → verify via anon read-back → register → publish → proof)
# then the audit step re-verifies served reels and records measurement.
# Auth: the same AUTOPILOT_SECRET the cloud dispatcher already uses.
name: Native reels

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max reels this run (1-6)"
        default: "4"
  schedule:
    # Once a day. Each run uploads and reads back its reels from Storage; every
    # 3 hours (with the browser check after it) used up the free plan's
    # monthly Storage egress, so the cadence is daily.
    - cron: "23 6 * * *"

concurrency:
  group: native-reels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LIKELINK_API: https://likelink2.vercel.app
      AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install renderer runtime (Chromium, ffmpeg, Hebrew fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core >/dev/null
          npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.56.1 >/dev/null
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null
      # LikeLink's own image model (open weights, CPU): no account, no key, no credits.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: own-image-model-v1
      - name: Install own image model runtime (CPU torch + diffusers)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "diffusers>=0.30" transformers accelerate peft safetensors
      - name: Render, verify and publish reels
        env:
          OWN_MODEL_PYTHON: python
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: node scripts/media/render-reels.mjs --limit "${{ github.event.inputs.limit || '4' }}" --out "$RUNNER_TEMP/reels"
      - name: Audit served reels (verify, measure, learn)
        if: always()
        run: |
          code=$(curl -sS -o audit.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $AUTOPILOT_SECRET" -H "Origin: $LIKELINK_API" \
            "$LIKELINK_API/api/store?mode=media-pipeline&op=audit")
          echo "audit http $code"; cat audit.json; echo
          { echo "### Audit (http $code)"; echo '```json'; cat audit.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "$code" = "200"
      - name: Instagram Reels publisher (two-phase, only with IG_USER_ID + IG_ACCESS_TOKEN on Vercel)
        if: always()
        run: |
          # Phase 1 creates the container, later steps publish it once Instagram finished processing.
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o ig.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $AUTOPILOT_SECRET" -H "Origin: $LIKELINK_API" \
              "$LIKELINK_API/api/store?mode=media-pipeline&op=instagram")
            echo "instagram step $i http $code"; cat ig.json; echo
            { echo "### Instagram step $i (http $code)"; echo '```json'; cat ig.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            status=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('ig.json','utf8')).status||'')}catch{console.log('')}")
            case "$status" in CONTAINER_CREATED|PROCESSING) sleep 40 ;; *) break ;; esac
          done
      - name: LikeLoop — truth, hooks, creatives, queue, learning, trends
        if: always()
        run: |
          for op in instagram-insights likeloop-run; do
            code=$(curl -sS -o ll.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $AUTOPILOT_SECRET" -H "Origin: $LIKELINK_API" \
              "$LIKELINK_API/api/store?mode=media-pipeline&op=$op")
            echo "$op http $code"; head -c 3000 ll.json; echo
            { echo "### $op (http $code)"; echo '```json'; head -c 6000 ll.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
