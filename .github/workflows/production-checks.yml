name: LikeLink2 production checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run portable:check
      - name: Portable runtime smoke test
        run: |
          set -euo pipefail
          npm start > /tmp/likelink-portable.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8787/ > /tmp/likelink-home.html; then break; fi
            sleep 1
          done
          grep -q 'LikeLink' /tmp/likelink-home.html
          test -s /tmp/likelink-home.html
