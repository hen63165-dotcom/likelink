name: LikeLink2 production checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H "content-type: application/json" \
            --data '{"action":"status"}' \
            "https://likelink2.vercel.app/api/autopilot?mode=status")
          echo "$response"
          echo "$response" | grep -q '"scheduler"' 
          echo "$response" | grep -q '"queue"' 
          echo "$response" | grep -q '"jobCount"'
