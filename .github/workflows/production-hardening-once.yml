name: Production hardening (one-time)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: production hardening') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production truth
        run: |
          node <<'NODE'
          const fs = require("fs");
          const patch = (file, pairs) => {
            let s = fs.readFileSync(file, "utf8");
            for (const [a,b] of pairs) {
              if (!s.includes(a)) throw new Error("Missing patch anchor in " + file + ": " + a.slice(0,100));
              s = s.replace(a,b);
            }
            fs.writeFileSync(file,s);
          };

          patch("src/lib/cloud/cloudAutopilot.js", [
            [
              'import { generateProductStory } from "./storyEngine.js";',
              'import { generateProductStory } from "./storyEngine.js";\nimport { CONNECTION_STATE } from "./connectionManager.js";'
            ],
            [
              'const [productsRow, clicksRow, salesRow, campaignsRow, marketersRow, metaRow] =\n    await Promise.all([\n      kvGet("marketplace:products", []),\n      kvGet("marketplace:clicks", []),\n      kvGet("marketplace:sales", []),\n      kvGet("marketplace:site_campaigns", []),\n      kvGet("marketplace:marketers", []),\n      kvGet(CLOUD_CYCLE_KEY),\n    ]);',
              'const [productsRow, clicksRow, salesRow, campaignsRow, marketersRow, metaRow, connectionStatesRow] =\n    await Promise.all([\n      kvGet("marketplace:products", []),\n      kvGet("marketplace:clicks", []),\n      kvGet("marketplace:sales", []),\n      kvGet("marketplace:site_campaigns", []),\n      kvGet("marketplace:marketers", []),\n      kvGet(CLOUD_CYCLE_KEY),\n      kvGet("marketplace:connection_states", []),\n    ]);'
            ],
            [
              'const marketersList = Array.isArray(marketersRow) ? marketersRow.filter(m => m && m.id) : [];\n  const meta = metaRow || {};',
              'const marketersList = Array.isArray(marketersRow) ? marketersRow.filter(m => m && m.id) : [];\n  const connectionStates = Array.isArray(connectionStatesRow) ? connectionStatesRow : [];\n  const connectionByProvider = new Map(connectionStates.filter(c => c && c.provider).map(c => [String(c.provider), c]));\n  const meta = metaRow || {};'
            ],
            [
              'const channelStates = marketersList.filter(m => m && m.enabled).flatMap(m => (m.channels || []).map(ch => ({ provider: String(ch.type || "unknown"), connected: true, authorized: true })));',
              'const channelStates = [{ provider: "owned_web", connected: true, authorized: true, verified: true }, ...marketersList.filter(m => m && m.enabled).flatMap(m => (m.channels || []).map(ch => { const provider = String(ch.type || "unknown"); const state = connectionByProvider.get(provider); const verified = Boolean(state && (state.state === CONNECTION_STATE.CONNECTED || state.state === CONNECTION_STATE.READY) && state.lastVerified); return { provider, connected: verified, authorized: verified, verified }; }))];'
            ],
            [
              'const urgency = trendReport.context?.urgency || "משלוח מהיר לכל הגולנים";',
              'const urgency = trendReport.context?.urgency || "\u05d2\u05d9\u05dc\u05d5\u05d9 \u05de\u05d5\u05e6\u05e8\u05d9\u05dd \u05dc\u05e4\u05d9 \u05d4\u05e7\u05e9\u05e8 \u05d6\u05de\u05df";'
            ]
          ]);

          patch("src/lib/cloud/trendScanner.js", [
            [
              'const TIME_URGENCY = {\n  morning: "הטבות הבוקר החמות — עד הצהריים",\n  afternoon: "פריטים שנמכרים עכשיו — מלאי מוגבל",\n  evening: "קניית ערב מושלמת — משלוח מהיר",\n  night: "דילי לילה — רק עד חצות",\n};',
              'const TIME_URGENCY = {\n  morning: "גילוי מוצרים לפי שעות הבוקר",\n  afternoon: "גילוי מוצרים לפי שעות אחר הצהריים",\n  evening: "גילוי מוצרים לפי שעות הערב",\n  night: "גילוי מוצרים לפי שעות הלילה",\n};'
            ],
            [
              'reasons.push("חדש!");',
              'reasons.push("חדש לפי תאריך המוצר");'
            ],
            [
              'reasons.push("מחיר אימפולס");',
              'reasons.push("מחיר מתחת ל-₪100");'
            ]
          ]);

          patch("src/lib/cloud/publishEngine.js", [
            [
              '    configured: hasConnected || hasReadyProvider || channels.length > 0,',
              '    configured: hasConnected || hasReadyProvider,'
            ]
          ]);

          console.log("Production truth hardening applied.");
          NODE

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit and push
        run: |
          git config user.name "production-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/production-hardening-once.yml
          git add src/lib/cloud/cloudAutopilot.js src/lib/cloud/trendScanner.js src/lib/cloud/publishEngine.js
          git commit -m "chore: production hardening"
          git push origin main
