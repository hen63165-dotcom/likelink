# The trend radar (/radar, src/lib/growth/trendRadar.js + israelGap.js + radarDiscovery.js): every
# day, for every concept on the watch list (scripts/catalog/radar-concepts.json) and the trial
# concepts discovery found, AliExpress's own numbers through the owner's affiliate account
# (matching listings, the top items' recent orders and prices) and the Israel gap (Google's public
# autocomplete in Israel/Hebrew and in the US, Google Trends' Israel feed; robots.txt read first).
# The history, the public self-grading calls and the board live on the "radar" pre-release
# (readings.json, calls.json, awareness.json, discovered.json, board.json); deploy-frontend.yml
# copies board.json into the site. A run from any branch but main reads that history and writes to
# "radar-preview" instead, so the live board only changes from main. Read-only on the store, Google
# and the site; nothing is posted.
name: Trend radar
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/catalog/radar-concepts.json
      - scripts/catalog/trend-radar.mjs
      - src/lib/growth/trendRadar.js
      - src/lib/growth/israelGap.js
      - src/lib/growth/radarDiscovery.js
      - src/lib/growth/radarOpportunity.js
      - src/lib/growth/alpha.js
      - src/lib/growth/radarIntel.js
      - src/lib/growth/worldPulse.js
      - src/lib/cloud/catalogArchive.js
      - scripts/catalog/push-archive.mjs
      - .github/workflows/trend-radar.yml
      - scripts/catalog/radar-state.mjs
      - scripts/catalog/push-board.mjs
      - scripts/catalog/radar-alert.mjs
      - src/lib/growth/radarGate.js
      - src/lib/growth/radarBoard.js
permissions:
  contents: write
concurrency:
  # One run at a time per branch: a branch push must never cancel main's pending run (15.11: the
  # run for #182's merge was cancelled by a branch run queued behind it, so the board never reached
  # the cloud that evening).
  group: trend-radar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
      # The owner's own free YouTube Data API key (src/lib/growth/youtubeSignal.js); without it the
      # YouTube check is skipped (REQUIRES_CONNECTION) and nothing else changes.
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Instagram's own Hashtag Search API for the waves (the owner's business account; without them: REQUIRES_CONNECTION).
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The history so far
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: |
          mkdir -p radar-state
          if gh release view radar >/dev/null 2>&1; then
            gh release download radar --dir radar-state --pattern '*.json' --clobber || true
            # The private state (scripts/catalog/radar-state.mjs): one encrypted file wins over any
            # older plaintext asset.
            gh release download radar --dir radar-state --pattern state.enc --clobber || true
          fi
          node scripts/catalog/radar-state.mjs unpack radar-state
          rm -f radar-state/board-public.json radar-state/briefs-public.json
          ls -la radar-state
      - name: Today's reading
        run: |
          set -o pipefail
          timeout 840 node scripts/catalog/trend-radar.mjs radar-state | tee /tmp/radar.txt
          { echo "### Trend radar"; echo '```'; tail -80 /tmp/radar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The hot-only storefront (archive / restore the owner's products the radar decided)
        # src/lib/cloud/catalogArchive.js on the server decides and refuses; from main it applies
        # (RADAR_ARCHIVE=apply), from any other branch it is a dry run. Never fails the job.
        continue-on-error: true
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
          RADAR_ARCHIVE: apply
        run: |
          node scripts/catalog/push-archive.mjs radar-state | tee -a /tmp/radar.txt
          { echo "### Catalog archive"; echo '```'; grep -A40 "catalog archive:" /tmp/radar.txt | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The full board to the cloud (served behind the trial or a subscription)
        # src/lib/growth/radarGate.js + api/_utils/radarBoardHandler.mjs; from main only.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: node scripts/catalog/push-board.mjs radar-state | tee -a /tmp/radar.txt
      - name: The morning alert (Telegram, only on a day with a new sealed call)
        # src/lib/growth/radarAlert.js: one message a day at most, SENT only with Telegram's message_id;
        # from main only (RADAR_ALERT_SEND), without the brand bot it reports REQUIRES_CONNECTION.
        continue-on-error: true
        env:
          BRAND_TELEGRAM_BOT: ${{ secrets.BRAND_TELEGRAM_BOT }}
          BRAND_TELEGRAM_CHAT: ${{ secrets.BRAND_TELEGRAM_CHAT }}
          RADAR_ALERT_SEND: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          node scripts/catalog/radar-alert.mjs radar-state | tee -a /tmp/radar.txt
          { echo "### Morning alert"; echo '```'; grep -A8 "radar alert:" /tmp/radar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the history (encrypted) and the public board
        # scripts/catalog/radar-state.mjs: every state file in one encrypted state.enc (the releases
        # are public); board-public.json is the full board only while the server says the trial is
        # open, else the teaser (no live call); briefs-public.json (the kits) only while open.
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: |
          node scripts/catalog/radar-state.mjs pack radar-state
          files="radar-state/state.enc radar-state/board-public.json"
          [ -f radar-state/briefs-public.json ] && files="$files radar-state/briefs-public.json"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then rel=radar; else rel=radar-preview; fi
          gh release view $rel >/dev/null 2>&1 || gh release create $rel --prerelease --title "Trend radar (state)" --notes "The trend radar's state, encrypted (state.enc), and the public board (board-public.json). Written by .github/workflows/trend-radar.yml."
          gh release upload $rel $files --clobber
          # The older plaintext assets now live inside state.enc: remove them from the public release.
          [ -f radar-state/briefs-public.json ] || gh release delete-asset $rel briefs-public.json -y 2>/dev/null || true
          for f in readings calls awareness world discovered items catalog briefs catalog-decisions board alerts; do
            gh release delete-asset $rel "$f.json" -y 2>/dev/null || true
          done
