# The trend radar (/radar, src/lib/growth/trendRadar.js + israelGap.js + radarDiscovery.js): every
# day, for every concept on the watch list (scripts/catalog/radar-concepts.json) and the trial
# concepts discovery found, AliExpress's own numbers through the owner's affiliate account
# (matching listings, the top items' recent orders and prices) and the Israel gap (Google's public
# autocomplete in Israel/Hebrew and in the US, Google Trends' Israel feed; robots.txt read first).
# The history, the public self-grading calls and the board live on the "radar" pre-release
# (readings.json, calls.json, awareness.json, discovered.json, board.json); deploy-frontend.yml
# copies board.json into the site. A run from any branch but main reads that history and writes to
# "radar-preview" instead, so the live board only changes from main. Read-only on the store, Google
# and the site; nothing is posted.
name: Trend radar
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/catalog/radar-concepts.json
      - scripts/catalog/trend-radar.mjs
      - src/lib/growth/trendRadar.js
      - src/lib/growth/israelGap.js
      - src/lib/growth/radarDiscovery.js
      - src/lib/growth/radarOpportunity.js
      - src/lib/growth/alpha.js
      - src/lib/growth/radarIntel.js
      - src/lib/cloud/catalogArchive.js
      - scripts/catalog/push-archive.mjs
      - .github/workflows/trend-radar.yml
permissions:
  contents: write
concurrency:
  group: trend-radar
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The history so far
        run: |
          mkdir -p radar-state
          if gh release view radar >/dev/null 2>&1; then
            gh release download radar --dir radar-state --pattern '*.json' --clobber || true
          fi
          ls -la radar-state
      - name: Today's reading
        run: |
          set -o pipefail
          timeout 840 node scripts/catalog/trend-radar.mjs radar-state | tee /tmp/radar.txt
          { echo "### Trend radar"; echo '```'; tail -80 /tmp/radar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The hot-only storefront (archive / restore the owner's products the radar decided)
        # src/lib/cloud/catalogArchive.js on the server decides and refuses; from main it applies
        # (RADAR_ARCHIVE=apply), from any other branch it is a dry run. Never fails the job.
        continue-on-error: true
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
          RADAR_ARCHIVE: apply
        run: |
          node scripts/catalog/push-archive.mjs radar-state | tee -a /tmp/radar.txt
          { echo "### Catalog archive"; echo '```'; grep -A40 "catalog archive:" /tmp/radar.txt | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the history and the board
        run: |
          files="radar-state/readings.json radar-state/calls.json radar-state/awareness.json radar-state/discovered.json radar-state/items.json radar-state/catalog.json radar-state/briefs.json radar-state/catalog-decisions.json radar-state/board.json"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            gh release view radar >/dev/null 2>&1 || gh release create radar --prerelease --title "Trend radar (state)" --notes "The trend radar's daily readings (AliExpress's own numbers), the Israel gap (Google autocomplete levels, never texts), its public self-grading calls and the board the /radar page reads. Written by .github/workflows/trend-radar.yml."
            gh release upload radar $files --clobber
          else
            gh release view radar-preview >/dev/null 2>&1 || gh release create radar-preview --prerelease --title "Trend radar (branch preview)" --notes "A branch run of the trend radar, for review. The site never reads this release; the live board is the radar release, written from main only."
            gh release upload radar-preview $files --clobber
          fi
