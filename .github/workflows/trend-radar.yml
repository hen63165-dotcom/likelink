# The trend radar (/radar, src/lib/growth/trendRadar.js + israelGap.js + radarDiscovery.js): every
# day, for every concept on the watch list (scripts/catalog/radar-concepts.json) and the trial
# concepts discovery found, AliExpress's own numbers through the owner's affiliate account
# (matching listings, the top items' recent orders and prices) and the Israel gap (Google's public
# autocomplete in Israel/Hebrew and in the US, Google Trends' Israel feed; robots.txt read first).
# The history, the public self-grading calls and the board live on the "radar" pre-release
# (readings.json, calls.json, awareness.json, discovered.json, board.json); deploy-frontend.yml
# copies board.json into the site. A run from any branch but main reads that history and writes to
# "radar-preview" instead, so the live board only changes from main. Read-only on the store, Google
# and the site; nothing is posted.
name: Trend radar
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/catalog/radar-concepts.json
      - scripts/catalog/trend-radar.mjs
      - src/lib/growth/trendRadar.js
      - src/lib/growth/israelGap.js
      - src/lib/growth/radarDiscovery.js
      - src/lib/growth/radarOpportunity.js
      - src/lib/growth/alpha.js
      - src/lib/growth/radarIntel.js
      - src/lib/growth/worldPulse.js
      - src/lib/cloud/catalogArchive.js
      - scripts/catalog/push-archive.mjs
      - .github/workflows/trend-radar.yml
      - scripts/catalog/radar-state.mjs
      - scripts/catalog/push-board.mjs
      - scripts/catalog/radar-alert.mjs
      - src/lib/growth/radarGate.js
      - src/lib/growth/radarBoard.js
      - src/lib/growth/newKinds.js
      - scripts/catalog/radar-embed.mjs
      - src/lib/growth/wikiSignal.js
      - src/lib/growth/socialSignal.js
      - src/lib/growth/worldGap.js
      - src/lib/growth/supplyGap.js
      - src/lib/growth/freshRisers.js
      - src/lib/growth/channelEngine.js
      - scripts/marketing/channel-preview.mjs
      - src/lib/growth/radarEvidence.js
      - src/lib/growth/haulSignal.js
      - src/lib/growth/shopSignal.js
      - src/lib/growth/factorySignal.js
      - src/lib/growth/tradeSignal.js
      - src/lib/growth/newsSignal.js
      - src/lib/growth/radarBaseline.js
      - src/lib/growth/trendPath.js
      - src/lib/growth/asiaSignal.js
      - src/lib/growth/saturation.js
      - src/lib/growth/listingWave.js
      - src/lib/growth/beforeNoise.js
      - src/lib/growth/radarBacktest.js
      - src/lib/growth/radarModels.js
      - src/lib/growth/radarVersus.js
      - src/lib/growth/israelGap.js
      - src/lib/growth/runReceipt.js
permissions:
  contents: write
concurrency:
  # One run at a time per branch: a branch push must never cancel main's pending run (15.11: the
  # run for #182's merge was cancelled by a branch run queued behind it, so the board never reached
  # the cloud that evening).
  group: trend-radar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
      # The owner's own free YouTube Data API key (src/lib/growth/youtubeSignal.js); without it the
      # YouTube check is skipped (REQUIRES_CONNECTION) and nothing else changes.
      # The owner's YouTube key has a free daily quota (10,000 units, reset at midnight Pacific time). On
      # 26.11 six branch test runs spent it and main's next reading found YouTube answering 429, so only
      # main's runs use it; a branch run reports YouTube as waiting for a connection.
      # 26.11 again: a push to main at 19:50 asked after the day's reading had spent the units and got
      # 429 on 24 of 26 searches (the first creators lost the day), so only main's daily reading (the
      # schedule, or a run started by hand) spends it; a push to main reads everything else.
      YOUTUBE_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'push' && secrets.YOUTUBE_API_KEY || '' }}
      META_ADLIB_TOKEN: ${{ secrets.META_ADLIB_TOKEN }}
      # The US Census Bureau's free API key (optional: without it the open daily limit per address applies).
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      # Instagram's own Hashtag Search API for the waves (the owner's business account; without them: REQUIRES_CONNECTION).
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      # Pinterest's own trends API (src/lib/growth/pinterestTrends.js): the owner's Pinterest app token;
      # without it nothing is asked (REQUIRES_CONNECTION).
      PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      # Japan's and Korea's biggest stores, official doors (the owner, 22.11: "כן לרקוטן ונאבר"): Rakuten
      # Ichiba's ranking API (her free Rakuten Web Service app) and NAVER API HUB's Shopping Insight (her
      # free Ncloud key). Read only once the keys exist; until then nothing is asked.
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
      NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The history so far
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: |
          mkdir -p radar-state
          if gh release view radar >/dev/null 2>&1; then
            gh release download radar --dir radar-state --pattern '*.json' --clobber || true
            # The private state (scripts/catalog/radar-state.mjs): one encrypted file wins over any
            # older plaintext asset.
            gh release download radar --dir radar-state --pattern state.enc --clobber || true
          fi
          node scripts/catalog/radar-state.mjs unpack radar-state
          rm -f radar-state/board-public.json radar-state/briefs-public.json
          ls -la radar-state
      - name: The radar's sentence and translation models (new kinds by meaning; Korea and Japan in their own words)
        # src/lib/growth/newKinds.js: an open model (all-MiniLM-L6-v2) through transformers.js on this
        # runner's CPU; installed here only, never shipped to the site. A failed install only skips the
        # kinds (the reading reports kinds: FAILED) and nothing else changes.
        # 26.11 19:50: the install timed out once downloading a native image library (sharp) and the run
        # lost the kinds by meaning, the look waves and Asia's translation; three tries, 20 s apart.
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npm install --no-save --no-audit --no-fund @huggingface/transformers@4.3.1 && exit 0
            echo "install try $i failed"; sleep 20
          done
          exit 1
      - name: Today's reading
        env:
          # The crowd sensor's counts (GET mode=radar-board&op=crowd, cron auth).
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: |
          set -o pipefail
          # 45 minutes (17.11: 120 world categories and 16 styles a day did not fit in 14; 26.11: a run
          # reached 30 and was stopped before it saved anything). The run's own deadline (38 minutes)
          # skips the optional readings by name, so the day is always saved; the job's 58 leave time for
          # the archive, the board, the alert and the encrypted state after it.
          timeout 2700 node scripts/catalog/trend-radar.mjs radar-state | tee /tmp/radar.txt
          { echo "### Trend radar"; echo '```'; tail -80 /tmp/radar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The channels' preview (Telegram + Instagram from this board; nothing is sent)
        # src/lib/growth/channelEngine.js over the board just measured: the leading candidates checked
        # at the store (productdetail.get) and by their photo (the lens model on this runner), then
        # consecutive posts simulated against an in-memory history. No message, no post, no cloud write.
        continue-on-error: true
        run: |
          node scripts/marketing/channel-preview.mjs radar-state | tee -a /tmp/radar.txt
          { echo "### Channels preview (nothing sent)"; echo '```'; grep -A12 "channel preview:" /tmp/radar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The hot-only storefront (archive / restore the owner's products the radar decided)
        # src/lib/cloud/catalogArchive.js on the server decides and refuses; from main it applies
        # (RADAR_ARCHIVE=apply), from any other branch it is a dry run. Never fails the job.
        continue-on-error: true
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
          RADAR_ARCHIVE: apply
        run: |
          node scripts/catalog/push-archive.mjs radar-state | tee -a /tmp/radar.txt
          { echo "### Catalog archive"; echo '```'; grep -A40 "catalog archive:" /tmp/radar.txt | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The full board to the cloud (served behind the trial or a subscription)
        # src/lib/growth/radarGate.js + api/_utils/radarBoardHandler.mjs; from main only.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: node scripts/catalog/push-board.mjs radar-state | tee -a /tmp/radar.txt
      - name: The morning alert (Telegram, only on a day with a new sealed call)
        # src/lib/growth/radarAlert.js: one message a day at most, SENT only with Telegram's message_id;
        # from main only (RADAR_ALERT_SEND), without the brand bot it reports REQUIRES_CONNECTION.
        continue-on-error: true
        env:
          BRAND_TELEGRAM_BOT: ${{ secrets.BRAND_TELEGRAM_BOT }}
          BRAND_TELEGRAM_CHAT: ${{ secrets.BRAND_TELEGRAM_CHAT }}
          RADAR_ALERT_SEND: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          node scripts/catalog/radar-alert.mjs radar-state | tee -a /tmp/radar.txt
          { echo "### Morning alert"; echo '```'; grep -A8 "radar alert:" /tmp/radar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the history (encrypted) and the public board
        # scripts/catalog/radar-state.mjs: every state file in one encrypted state.enc (the releases
        # are public); board-public.json is the full board only while the server says the trial is
        # open, else the teaser (no live call); briefs-public.json (the kits) only while open.
        env:
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: |
          node scripts/catalog/radar-state.mjs pack radar-state
          files="radar-state/state.enc radar-state/board-public.json"
          [ -f radar-state/briefs-public.json ] && files="$files radar-state/briefs-public.json"
          [ -f radar-state/prices-public.json ] && files="$files radar-state/prices-public.json"
          # 🔎 The evidence: every graded new-product call with the daily store readings behind it.
          [ -f radar-state/evidence-public.json ] && files="$files radar-state/evidence-public.json"
          # 🥊 The head-to-head cases (radarBacktest.js): every item, day and forecast, to recompute every number.
          [ -f radar-state/backtest-public.json ] && files="$files radar-state/backtest-public.json"
          # The channels' preview (no secrets: store facts, links and the simulated posts), from a branch
          # run only: it names today's picks, which the lock keeps off the public main release.
          if [ "${GITHUB_REF}" != "refs/heads/main" ] && [ -f radar-state/channel-preview.json ]; then files="$files radar-state/channel-preview.json radar-state/channel-preview.md"; fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then rel=radar; else rel=radar-preview; fi
          gh release view $rel >/dev/null 2>&1 || gh release create $rel --prerelease --title "Trend radar (state)" --notes "The trend radar's state, encrypted (state.enc), and the public board (board-public.json). Written by .github/workflows/trend-radar.yml."
          gh release upload $rel $files --clobber
          # The older plaintext assets now live inside state.enc: remove them from the public release.
          [ -f radar-state/briefs-public.json ] || gh release delete-asset $rel briefs-public.json -y 2>/dev/null || true
          for f in readings calls awareness world discovered items catalog briefs catalog-decisions board alerts; do
            gh release delete-asset $rel "$f.json" -y 2>/dev/null || true
          done
