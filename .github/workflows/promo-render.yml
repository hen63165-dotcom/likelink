# LikeLink2 self-promo reel: own image model scenes + real site screenshots →
# public/promo/likelink-studio.mp4, committed back to the working branch for
# review (it reaches the site only through a reviewed PR).
name: Promo reel render
on:
  push:
    branches: ["claude/likelink2-design-execution-f0ga6q"]
    paths: ["scripts/media/promo/jobs.json", "scripts/media/promo/promo.html", "scripts/media/promo/render-promo.mjs"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: own-image-model-v1
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core >/dev/null
          npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.56.1 >/dev/null
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "diffusers>=0.30" transformers accelerate peft safetensors
      - name: Generate AI scenes (own model)
        run: python scripts/media/ai-image/generate.py --jobs scripts/media/promo/jobs.json --out "$RUNNER_TEMP/scenes"
      - name: Render reel
        env:
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
        run: node scripts/media/promo/render-promo.mjs --scenes "$RUNNER_TEMP/scenes"
      - name: Commit for review
        run: |
          git config user.name "likelink-bot"; git config user.email "likelink-bot@users.noreply.github.com"
          git add public/promo scripts/media/promo/preview
          git commit -m "Promo reel: rendered for review" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
