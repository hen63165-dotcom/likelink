# The owner's picks from the trend board (/likelink/trend-board/), or her own
# AliExpress links, → the site, without the cloud.
# Re-reads exactly those AliExpress items from the official affiliate API
# (productdetail.get: ILS, ship to Israel, the owner's tracked link, the store's
# gallery and the seller's own video), adds them to the catalog copy the site
# ships (public/snapshot/kv.json) as the owner's products, checks the copy with
# the site's own tests and commits it to main. deploy-frontend.yml runs after it.
# An item already on the site, without a real photo/price/own link, or whose
# link another product uses, is reported and not added.
name: Add trend products
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Up to 10, separated by commas: item numbers from the trend board, AliExpress product page links, or your own s.click links"
        required: true
permissions:
  contents: write
concurrency:
  group: catalog-sync
  cancel-in-progress: false
jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
      # Passed as data, never pasted into the shell.
      TREND_IDS: ${{ github.event.inputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the chosen items from AliExpress and add them
        run: |
          set -o pipefail
          node scripts/catalog/trend-finder.mjs --add | tee /tmp/add.json
          { echo "### Add trend products"; echo '```json'; cat /tmp/add.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the copy (the site's own rules)
        run: node --test tests/catalogSnapshot.test.mjs tests/publicDiscovery.test.mjs tests/staticForwarder.test.mjs tests/storefrontIntegrity.test.mjs
      - name: Commit the updated catalog copy
        run: |
          git diff --quiet -- public/snapshot/kv.json && { echo "nothing added"; exit 0; }
          git config user.name "likelink-bot"; git config user.email "likelink-bot@users.noreply.github.com"
          git add public/snapshot/kv.json
          git commit -m "catalog: add the owner's picks from the trend board $(date -u +%F)"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep $((i * 5)); git pull --rebase origin main
          done
          exit 1
