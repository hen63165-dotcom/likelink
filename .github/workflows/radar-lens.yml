# The radar's lens labels (src/lib/growth/lens.js): MobileCLIP-S0's text vectors for every kind the radar
# measures, made on this runner (transformers.js, no key) and kept on the "radar-lens" pre-release for a
# person to commit as public/lens/labels.json; then a check of the browser half on real store photos.
# Nothing here is posted and the site never reads the release.
name: Radar lens labels
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/catalog/radar-lens.mjs
      - src/lib/growth/lens.js
      - .github/workflows/radar-lens.yml
permissions:
  contents: write
concurrency:
  group: radar-lens-${{ github.ref }}
  cancel-in-progress: false
jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund @huggingface/transformers@4.3.1
      - name: Labels and the vision check
        run: |
          set -o pipefail
          node scripts/catalog/radar-lens.mjs lens-out | tee /tmp/lens.txt
          { echo "### Radar lens"; echo '```'; cat /tmp/lens.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep them on the review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view radar-lens >/dev/null 2>&1 || gh release create radar-lens --prerelease --title "Radar lens labels" --notes "MobileCLIP-S0 text vectors for the kinds the radar measures, for public/lens/labels.json. The site never reads this release."
          gh release upload radar-lens lens-out/labels.json /tmp/lens.txt --clobber
