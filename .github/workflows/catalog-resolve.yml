# Catalog truth resolver: each product's REAL photo from its own store page.
# A real Chrome follows the product's own affiliate link; the server accepts
# only a store product page + a store-CDN image it downloads itself, writes
# it and reads it back (src/lib/cloud/catalogResolver.js). Then the native
# reel pipeline can render the product honestly.
name: Catalog resolver

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what was found (send nothing)"
        default: "false"
  schedule:
    - cron: "41 5 * * *"

concurrency:
  group: catalog-resolve
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIKELINK_API: https://likelink2.vercel.app
      AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (drives the runner's Google Chrome)
        run: npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.56.1 >/dev/null
      - name: Resolve real product photos
        env:
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
        run: node scripts/catalog/resolve-products.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
