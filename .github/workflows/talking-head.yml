# Feasibility test: Luna talks — the image's face follows the Hebrew voice
# (lips, blinks, head motion) with SadTalker (Apache-2.0) on the CPU runner.
# Runs on pushes that touch it and commits the sample videos back to the same
# branch for review. Nothing here publishes anything.
name: Talking Luna — test
on:
  push:
    branches: ["claude/likelink2-design-execution-f0ga6q"]
    paths: ["scripts/media/talking/talk.sh", ".github/workflows/talking-head.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  talk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/sadtalker/checkpoints
            ~/sadtalker/gfpgan/weights
          key: talking-luna-v1
      - name: Install (CPU torch + SadTalker deps)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==1.23.4 face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 librosa==0.9.2 numba resampy==0.3.1 \
            pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml joblib==1.1.0 scikit-image==0.19.3 basicsr==1.4.2 \
            facexlib==0.3.0 gfpgan av safetensors
      - name: Talk
        env:
          TALK_SECONDS: "14"
        run: |
          mkdir -p scripts/media/talking/samples
          bash scripts/media/talking/talk.sh scripts/media/ai-image/samples/luna-c-2.png \
            scripts/media/voice/samples/studio-phone-lively-full.m4a scripts/media/talking/samples \
            2>&1 | tr "\r" "\n" | grep --line-buffered -v -E "it/s\]|s/it\]" | tee /tmp/talk.log
      - name: Commit samples for review
        if: always()
        run: |
          mkdir -p scripts/media/talking/samples
          cp /tmp/talk.log scripts/media/talking/samples/log.txt 2>/dev/null || true
          git config user.name "likelink-bot"; git config user.email "likelink-bot@users.noreply.github.com"
          git add scripts/media/talking/samples
          git commit -m "Talking Luna: sample videos from the CPU runner" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
