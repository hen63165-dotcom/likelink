# One click: Actions → "Viral reel" → Run workflow.
# script → ElevenLabs voice → Replicate video → MoviePy edit → Instagram Reels
# (published only after Instagram returns the media id and permalink).
# Keys come from repository secrets; nothing is printed. The finished MP4 and
# the run result are attached to the run as an artifact either way.
name: Viral reel

on:
  workflow_dispatch:
    inputs:
      post:
        description: "Post to Instagram (no = render only, for review)"
        type: choice
        options: ["yes", "no"]
        default: "yes"
      variant:
        description: "Script (empty = rotates daily): where-bought, lost-link, real-clicks"
        default: ""

permissions:
  contents: read

concurrency:
  group: viral-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/viral/requirements.txt
      - name: Install ffmpeg, Hebrew fonts and the Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core >/dev/null
          pip install -q -r scripts/viral/requirements.txt
      - name: Make and post the reel
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_TO_INSTAGRAM: ${{ inputs.post == 'yes' && '1' || '0' }}
          SCRIPT_VARIANT: ${{ inputs.variant }}
          OUT_DIR: out
        run: python scripts/viral/viral_reel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viral-reel
          path: |
            out/viral_reel_final.mp4
            out/viral_reel_result.json
          if-no-files-found: ignore
