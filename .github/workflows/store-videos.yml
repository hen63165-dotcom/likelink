# Store videos (review): fetches the store's own product video for the products in
# scripts/marketing/store-videos/list.json through the owner's affiliate account, with a contact
# sheet of each, onto the "store-videos-preview" pre-release for a person to review before an edit.
# Read-only on the store and the cloud; the site never reads this release and nothing is posted.
name: Store videos (review)
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/marketing/store-videos/**
      - .github/workflows/store-videos.yml
permissions:
  contents: write
concurrency:
  group: store-videos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask each store for its own video
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          timeout 600 node scripts/marketing/store-videos/fetch.mjs
          ls -la store-out
      - name: Store them on the review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view store-videos-preview >/dev/null 2>&1 || gh release create store-videos-preview --prerelease --title "Store videos (review)" --notes "The store's own product videos, fetched for a person to review before an edit. Nothing here is posted, and the site never reads this release."
          gh release upload store-videos-preview store-out/* --clobber
