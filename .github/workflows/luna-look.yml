# Casting the character's new look (the owner, 2026-10-23: a model in an
# athleisure set in the spirit of the big yoga brands, with no brand name or
# logo — not the purple hoodie). The own image model (open weights, CPU runner,
# no account, key or credits) draws scripts/media/ai-image/luna-look.json and
# commits the candidates to scripts/luna_reels/assets/look-candidates/ for a
# person to choose; the chosen face then keeps the character the same in every
# story scene (luna-scenes.yml, --ref).
name: Luna look
on:
  workflow_dispatch:
  push:
    branches: ["claude/likelink2-design-execution-f0ga6q"]
    paths: ["scripts/media/ai-image/luna-look.json", ".github/workflows/luna-look.yml"]
permissions:
  contents: write
concurrency:
  group: luna-look
  cancel-in-progress: true
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: own-image-model-scenes-v1
      - name: Install (CPU torch + diffusers)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "diffusers>=0.30" transformers accelerate peft safetensors
      - name: Draw the candidates
        run: |
          out=scripts/luna_reels/assets/look-candidates
          mkdir -p "$out"
          python scripts/media/ai-image/generate.py --jobs scripts/media/ai-image/luna-look.json --out "$out" \
            --width 576 --height 1024 2>&1 | tee /tmp/look.log
          grep '^{' /tmp/look.log > "$out/log.jsonl" || true
      - name: Commit the candidates for review
        run: |
          git config user.name "likelink-bot"; git config user.email "likelink-bot@users.noreply.github.com"
          git add scripts/luna_reels/assets/look-candidates
          git commit -m "Luna look: athleisure candidates from the own image model (review by eye)" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
