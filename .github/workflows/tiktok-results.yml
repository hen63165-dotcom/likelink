name: TikTok results

# The owner logs a TikTok post's numbers (from TikTok's own analytics, 48 hours
# after posting). They are kept on the ops/tiktok branch and the TikTok engine
# (src/lib/growth/tiktok.js) learns from them: deploy-frontend.yml runs right
# after this and rebuilds https://hen63165-dotcom.github.io/likelink/tiktok/.

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "מזהה הפוסט מעמוד הטיקטוק (למשל tt-20261016-1-reveal)"
        required: true
      views:
        description: "צפיות"
        required: true
      likes:
        description: "לייקים"
        required: false
        default: "0"
      comments:
        description: "תגובות"
        required: false
        default: "0"
      shares:
        description: "שיתופים"
        required: false
        default: "0"
      saves:
        description: "שמירות"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: tiktok-results
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add the numbers and save to ops/tiktok
        env:
          POST_ID: ${{ inputs.post_id }}
          VIEWS: ${{ inputs.views }}
          LIKES: ${{ inputs.likes }}
          COMMENTS: ${{ inputs.comments }}
          SHARES: ${{ inputs.shares }}
          SAVES: ${{ inputs.saves }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OPS="$RUNNER_TEMP/ops"
          # The concurrency group queues runs but may drop a waiting one, and a
          # run can still race another: read the branch, add this result, push;
          # when the push is refused (the branch moved), read it again and
          # re-apply. The results file is never rebuilt from an empty list.
          for attempt in 1 2 3 4 5; do
            git worktree remove --force "$OPS" 2>/dev/null || true
            git branch -q -D ops/tiktok >/dev/null 2>&1 || true
            # An explicit ref: checkout's own FETCH_HEAD points at main and must never be used here.
            if git fetch -q --depth=1 origin +ops/tiktok:refs/remotes/origin/ops/tiktok 2>/dev/null; then
              git worktree add -q -b ops/tiktok "$OPS" refs/remotes/origin/ops/tiktok
            else
              git worktree add -q --detach "$OPS"
              git -C "$OPS" switch -q --orphan ops/tiktok
            fi
            node scripts/marketing/tiktok-results.mjs "$OPS/marketing/tiktok-results.json" "$RUNNER_TEMP/out.json"
            mkdir -p "$OPS/marketing"
            cp "$RUNNER_TEMP/out.json" "$OPS/marketing/tiktok-results.json"
            git -C "$OPS" add marketing/tiktok-results.json
            git -C "$OPS" commit -q -m "TikTok results: $POST_ID"
            if git -C "$OPS" push -q origin HEAD:ops/tiktok; then
              echo "saved on attempt $attempt"
              exit 0
            fi
            echo "the branch moved while saving; reading it again ($attempt/5)"
            sleep $((attempt * 3))
          done
          echo "::error::the result could not be saved after 5 tries; run the form again"
          exit 1
