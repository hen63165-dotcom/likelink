<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3EA" />

    <!--
      ===== SEO / AI-Search configuration =====
      CANONICAL DOMAIN: https://likelink2.vercel.app
      This file cannot import ES modules at parse time, so the origin is
      mirrored here from src/constants/domain.js (PRODUCTION_ORIGIN) — the
      single source of truth. Mirrored in /public/robots.txt +
      /public/sitemap.xml. tests/domainOrigin.test.mjs fails the build if
      any of these diverge. Do NOT add "noindex"/"noai"/"noimageai".
      =========================================
    -->
    <title>לייקלינק Likelink2 — גילוי מוצרים דרך יוצרים, תוכן וטרנדים</title>
    <meta name="description" content="לייקלינק — גלו מוצרים דרך יוצרים, אוספים, סרטונים וטרנדים, עם מחיר אמיתי, חנות ברורה וגילוי נאות. Discover products through creators, content and trends." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="google-site-verification" content="1UWIKAws0XC-QI2d1bht9HJ-463zWKbZZXrRr1LHGxA" />
    <meta name="google-site-verification" content="n_kzE1gD95Kotqtc0ZhW6S6nZNV-oiYmCQ3GiSoXqHA" />
    <link rel="canonical" href="https://likelink2.vercel.app/" />

    <!-- Favorites / web app -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.webp" />
    <!-- iOS Add-to-Home-Screen: Safari does NOT render WebP here — PNG required -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Likelink2" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://likelink2.vercel.app/" />
    <meta property="og:title" content="לייקלינק Likelink2 — גילוי מוצרים דרך יוצרים, תוכן וטרנדים" />
    <meta property="og:description" content="גלו מוצרים דרך יוצרים, אוספים, סרטונים וטרנדים — עם מחיר אמיתי, חנות ברורה וגילוי נאות." />
    <meta property="og:image" content="https://likelink2.vercel.app/icons/icon-512.webp" />
    <meta property="og:image:alt" content="Likelink2 — premium creator marketplace" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LikeLink2 — discover products through creators, content and trends" />
    <meta name="twitter:description" content="Creator-picked products, collections, reels and trends — with real prices, a clear store and honest disclosure." />
    <meta name="twitter:image" content="https://likelink2.vercel.app/icons/icon-512.webp" />

    <!-- Structured data: Organization + WebSite (with search action) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://likelink2.vercel.app/#organization",
          "name": "Likelink",
          "url": "https://likelink2.vercel.app/",
          "logo": { "@type": "ImageObject", "url": "https://likelink2.vercel.app/icons/icon-512.webp" },
          "description": "Shop curated product picks from independent creators, all in one place.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://likelink2.vercel.app/#website",
          "url": "https://likelink2.vercel.app/",
          "name": "Likelink",
          "publisher": { "@id": "https://likelink2.vercel.app/#organization" },
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": { "@type": "EntryPoint", "urlTemplate": "https://likelink2.vercel.app/search?q={search_term_string}" },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Heebo:wght@400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
    <script>
      // First-paint theme: apply the Studio's dark premium surface before React
      // hydrates so the first visible frame is never the old cream shell.
      // Visitor preference wins: only default to dark when nothing was saved.
      try {
        var __llTheme = null;
        try { __llTheme = localStorage.getItem('likelink.theme'); } catch (e) { /* private mode — ignore */ }
        if (__llTheme !== 'light' && __llTheme !== 'dark') { __llTheme = 'dark'; }
        document.documentElement.setAttribute('data-theme', __llTheme);
        if (__llTheme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) { /* never block first paint on theme */ }
    </script>
  </head>
  <body>
    <!-- Semantic fallback: present in the initial HTML so JS-less crawlers
         and AI engines can still read accurate page content before React hydrates. -->
    <div id="root" data-ll-public-root>
      <div dir="rtl" lang="he" style="min-height:100vh;background:#0a090b;color:#f4efe7;font-family:Heebo,system-ui,sans-serif">
        <header style="display:flex;align-items:center;gap:10px;height:64px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)">
          <strong style="font-size:21px">LikeLink<span style="color:#d22f5d">2</span></strong>
        </header>
        <main style="max-width:1240px;margin:0 auto;padding:40px 16px 64px">
          <h1 style="font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:500;font-size:42px;line-height:1.05;margin:0">רואים את התכשיט בתנועה. <span style="color:#dcb86f">לפני שקונים.</span></h1>
          <p style="margin:14px 0 22px;color:rgba(244,239,231,.8);max-width:560px;line-height:1.7">תכשיטים שנבחרו בקפידה, עם סרטון של המוצר, מודד מידות חינמי וקישור ישיר לחנות.</p>
          <nav aria-label="ניווט ראשי" style="display:flex;flex-wrap:wrap;gap:10px">
            <a href="/products" style="color:#f4efe7">מוצרים</a> · <a href="/reels" style="color:#f4efe7">סרטונים</a> · <a href="/size" style="color:#f4efe7">מודד מידות</a> · <a href="/guide" style="color:#f4efe7">המדריך</a> · <a href="/discover" style="color:#f4efe7">גילוי</a> · <a href="/creators" style="color:#f4efe7">יוצרים</a> · <a href="/collections" style="color:#f4efe7">אוספים</a> · <a href="/search" style="color:#f4efe7">חיפוש</a> · <a href="/studio" style="color:#f4efe7">Studio</a>
          </nav>
          <noscript>
            <p>הפעילו JavaScript כדי לראות את התכשיטים והסרטונים בלייקלינק.</p>
          </noscript>
        </main>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
    <link rel="stylesheet" href="/luxury.css">
  </body>
</html>
