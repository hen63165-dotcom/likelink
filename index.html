<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3EA" />

    <!--
      ===== SEO / AI-Search configuration =====
      CANONICAL DOMAIN:
      https://www.likelink.com — used below and mirrored in
      /public/robots.txt + /public/sitemap.xml. Do NOT add
      "noindex"/"noai"/"noimageai".
      =========================================
    -->
    <title>Likelink — Shop Curated Picks by Independent Creators</title>
    <meta name="description" content="Discover fashion, beauty and lifestyle products hand-picked by top creators and influencers. Every link is sales-ranked, influencer-verified and shows its store source transparently." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.likelink.com/" />

    <!-- Favorites / web app -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.webp" />
    <link rel="apple-touch-icon" href="/icons/icon-192.webp" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Likelink" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.likelink.com/" />
    <meta property="og:title" content="Likelink — Shop Curated Picks by Independent Creators" />
    <meta property="og:description" content="Discover fashion, beauty and lifestyle products hand-picked by top creators and influencers. Every link is sales-ranked, influencer-verified and shows its store source transparently." />
    <meta property="og:image" content="https://www.likelink.com/icons/icon-512.webp" />
    <meta property="og:image:alt" content="Likelink — curated picks by independent creators" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Likelink — Shop Curated Picks by Independent Creators" />
    <meta name="twitter:description" content="Fashion, beauty and lifestyle picks from top creators — sales-ranked, influencer-verified, with transparent store sources." />
    <meta name="twitter:image" content="https://www.likelink.com/icons/icon-512.webp" />

    <!-- Structured data: Organization + WebSite (with search action) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.likelink.com/#organization",
          "name": "Likelink",
          "url": "https://www.likelink.com/",
          "logo": { "@type": "ImageObject", "url": "https://www.likelink.com/icons/icon-512.webp" },
          "description": "Shop curated product picks from independent creators, all in one place.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://www.likelink.com/#website",
          "url": "https://www.likelink.com/",
          "name": "Likelink",
          "publisher": { "@id": "https://www.likelink.com/#organization" },
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": { "@type": "EntryPoint", "urlTemplate": "https://www.likelink.com/?q={search_term_string}" },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>if (new URLSearchParams(window.location.search).get('debug') === 'storage') { location.replace('/debug-storage.html'); }</script>
  </head>
  <body>
    <!-- Semantic fallback: present in the initial HTML so JS-less crawlers
         and AI engines can still read accurate page content before React hydrates. -->
    <div id="root">
      <h1>Likelink — Curated picks by independent creators</h1>
      <p>Discover fashion, beauty and lifestyle products hand-picked by top creators and influencers. Every link is sales-ranked, influencer-verified and displays its store source transparently.</p>
      <noscript>
        <p>Enable JavaScript to browse the Likelink creator marketplace.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/luxury.js" defer></script>
    <link rel="stylesheet" href="/luxury.css">
  </body>
</html>
