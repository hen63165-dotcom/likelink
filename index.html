<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3EA" />

    <!--
      ===== SEO / AI-Search configuration =====
      CANONICAL DOMAIN:
      https://likelink.com — used below and mirrored in
      /public/robots.txt + /public/sitemap.xml. Do NOT add
      "noindex"/"noai"/"noimageai".
      =========================================
    -->
    <title>לייקלינק Likelink2 — קניות מהיוצרות המובילות בישראל</title>
    <meta name="description" content="לייקלינק — השוק של היוצרות: אופנה, יופי, בית ואקססוריז בקיורציה אישית. קנייה בטוחה בקליק, תשלום מאובטח ב-PayPal. Shop from Israel's top creators." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://likelink.com/" />

    <!-- Favorites / web app -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.webp" />
    <link rel="apple-touch-icon" href="/icons/icon-192.webp" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Likelink2" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://likelink.com/" />
    <meta property="og:title" content="לייקלינק Likelink2 — קניות מהיוצרות המובילות" />
    <meta property="og:description" content="אופנה, יופי ובית בקיורציה אישית של היוצרות המובילות בישראל. קנייה בטוחה בקליק." />
    <meta property="og:image" content="https://likelink.com/icons/icon-512.webp" />
    <meta property="og:image:alt" content="Likelink2 — premium creator marketplace" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Likelink2 — Luxury Creator Marketplace" />
    <meta name="twitter:description" content="Luxury founder-approved finds and creator-curated essentials from premium lifestyle tastemakers." />
    <meta name="twitter:image" content="https://www.likelink.com/icons/icon-512.webp" />

    <!-- Structured data: Organization + WebSite (with search action) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://likelink.com/#organization",
          "name": "Likelink",
          "url": "https://likelink.com/",
          "logo": { "@type": "ImageObject", "url": "https://likelink.com/icons/icon-512.webp" },
          "description": "Shop curated product picks from independent creators, all in one place.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://likelink.com/#website",
          "url": "https://likelink.com/",
          "name": "Likelink",
          "publisher": { "@id": "https://likelink.com/#organization" },
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": { "@type": "EntryPoint", "urlTemplate": "https://likelink.com/?q={search_term_string}" },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>if (new URLSearchParams(window.location.search).get('debug') === 'storage') { location.replace('/debug-storage.html'); }</script>
  </head>
  <body>
    <!-- Semantic fallback: present in the initial HTML so JS-less crawlers
         and AI engines can still read accurate page content before React hydrates. -->
    <div id="root">
      <h1>Likelink2 — Luxury creator marketplace</h1>
      <p>Curated fashion, accessories, beauty and elevated essentials picked by premium creators and styled for modern life.</p>
      <noscript>
        <p>Enable JavaScript to browse the Likelink2 creator marketplace.</p>
      </noscript>
    </div>
        <script type="module" src="./src/main.jsx"></script>
    <link rel="stylesheet" href="/luxury.css">
  </body>
</html>
